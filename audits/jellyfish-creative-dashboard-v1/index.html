<li>Cold vs warm: an ad set is warm if its name includes remarketing, retargeting, website retargeting, or customers, or if its include targeting uses LinkedIn dynamicSegments (website, lead form, company page, or engager retargeting). Everything else is cold, including ABM list and job-title prospecting. The Spotlight ad set is named "Remarketing and Cold" but includes those retargeting segments, so it is counted as warm. Spend on that ad set cannot be split between the two audiences.</li>

<li>Video views follow LinkedIn's definition (2 or more continuous seconds, at least 50% on screen). Views at 75% is videoThirdQuartileCompletions. Completions (97%) is videoCompletions, which LinkedIn defines as watches to 97-100% of the video. There is no separate 97% metric. fullScreenPlays is a different field (taps to full screen) and is not used as a 97% substitute. Completion rate = completions / impressions, which is LinkedIn's definition from March 2025.</li>
