function sum(src,ids){const t={s:0,i:0,c:0,l:0,dws:0,dwi:0};ids.forEach(id=>{const v=src[id];if(!v)return;t.s+=v[0];t.i+=v[1];t.c+=v[2];t.l+=v[3];if(v[4]!=null&&v[1]>0){t.dws+=v[4]*v[1];t.dwi+=v[1]}});t.dw=t.dwi>0?t.dws/t.dwi:null;return t}
function pills(){$('pills').innerHTML=D.order.map(k=>`<button class="${k==P?'on':''}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');const p=D.periods[P];$('range').textContent=`${fmtD(p.start)} to ${fmtD(p.end)} vs ${fmtD(p.prior.start)} to ${fmtD(p.prior.end)}`}
// KPI card. dir: 1 = higher is better, -1 = lower is better, 0 = neutral
function chg(cur,prv,dir,fmt){if(cur==null||prv==null||!(prv>0))return `<span class="c">${prv===0?'none in the prior period':'no prior delivery'}</span>`;const d=100*(cur-prv)/prv;const r=Math.round(d);const cls=r===0||dir===0?'nt':((d>0)===(dir>0)?'up':'dn');const ar=r===0?'':(d>0?'&#8593; ':'&#8595; ');return `<span class="${cls}">${ar}${Math.abs(r)}%</span> vs ${fmt(prv)} prior`}
function kpi(l,v,cur,prv,dir,fmt){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${chg(cur,prv,dir,fmt)}</div></div>`}
function kpiBlock(c,p,keys){const m={
 spend:()=>kpi('Total spend',usd(c.s),c.s,p.s,0,usd),
 impr:()=>kpi('Impressions',num(c.i),c.i,p.i,1,num),
 clicks:()=>kpi('Clicks',num(c.c),c.c,p.c,1,num),
 ctr:()=>kpi('CTR',ctrS(c.c,c.i),c.i>0?c.c/c.i:null,p.i>0?p.c/p.i:null,1,v=>(100*v).toFixed(2)+'%'),
 leads:()=>kpi('Leads (Lead Gen Form)',num(c.l),c.l,p.l,1,num),
 cpl:()=>kpi('CPL',cplS(c.s,c.l),c.l>0?c.s/c.l:null,p.l>0?p.s/p.l:null,-1,usd),
 cpc:()=>kpi('CPC',cpcS(c.s,c.c),c.c>0?c.s/c.c:null,p.c>0?p.s/p.c:null,-1,usd),
 cpm:()=>kpi('CPM',cpmS(c.s,c.i),c.i>0?1000*c.s/c.i:null,p.i>0?1000*p.s/p.i:null,-1,usd),
 dwell:()=>kpi('Dwell time',dwS(c.dw),c.dw,p.dw,1,v=>v.toFixed(1)+'s')};
 return `<div class="kpis">${keys.map(k=>m[k]()).join('')}</div>`}
// Benchmark-colored cells (rows with 1,000+ impressions)
const MINB=1000;
function bCtr(t){const s=ctrS(t.c,t.i);if(t.i<MINB)return s;return `<span class="${100*t.c/t.i>=B.ctr?'bg':'br'}">${s}</span>`}
function bCpc(t){const s=cpcS(t.s,t.c);if(t.i<MINB||!(t.c>0))return s;return `<span class="${t.s/t.c<=B.cpc_hi?'bg':'br'}">${s}</span>`}
function bDw(t){const s=dwS(t.dw);if(t.i<MINB||t.dw==null)return s;return `<span class="${t.dw>=B.dwell?'bg':'br'}">${s}</span>`}
const benchNote=()=>`Green = at or better than Benchmarks (${B.ctr.toFixed(2)}% CTR, $${B.cpc_lo} to $${B.cpc_hi} CPC, ${B.dwell}s dwell time); red = worse. Benchmarks are for image ads and are only applied to rows with 1,000+ impressions. CPL shows a dash when there are no leads.`;
function stPill(st){const c={Active:'p-g',Live:'p-g',Paused:'p-a','Not serving':'p-n',Completed:'p-n',Ended:'p-n',Archived:'p-n'}[st]||'p-n';return `<span class="pill ${c}">${esc(st)}</span>`}
// sorting helper
function sorter(state,key){if(state.k===key)state.d=-state.d;else{state.k=key;state.d=-1}}
function arrow(state,key){return state.k===key?(state.d<0?' &#9660;':' &#9650;'):''}
function metricVal(t,k){return {s:t.s,i:t.i,c:t.c,ctr:t.i>0?t.c/t.i:-1,cpc:t.c>0?t.s/t.c:Infinity,cpm:t.i>0?t.s/t.i:Infinity,l:t.l,cpl:t.l>0?t.s/t.l:Infinity,dw:t.dw==null?-1:t.dw}[k]}
// ---- daily chart ----
const MC={spend:'#4F2D7F',impr:'#7A5BA8',clicks:'#2C6E9E',ctr:'#B05A1E',leads:'#1f7a35',cpl:'#8a1f5c'};
const MLAB={spend:'Rolling Spend',impr:'Rolling Impressions',clicks:'Rolling Clicks',ctr:'Rolling CTR',leads:'Rolling Leads',cpl:'Rolling CPL'};
let DM='spend';
function setDM(k){DM=k;render()}
function chartRange(){const end=D.meta.through;let start;if(P==='l6m')start=D.periods.l6m.start;else{const d=new Date(end+'T12:00:00');d.setDate(d.getDate()-59);start=d.toISOString().slice(0,10)}return [start,end]}
function rollSeries(){const [a,b]=chartRange();const rows=D.daily;const idx={};rows.forEach((r,i)=>idx[r[0]]=i);const out=[];rows.forEach((r,i)=>{if(r[0]<a||r[0]>b)return;let s=0,im=0,c=0,l=0;for(let j=Math.max(0,i-6);j<=i;j++){s+=rows[j][1];im+=rows[j][2];c+=rows[j][3];l+=rows[j][4]}out.push({d:r[0],spend:s,impr:im,clicks:c,leads:l,ctr:im>0?c/im:null,cpl:l>0?s/l:null})});return out}
const nice=v=>{if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};
function yfmt(k,v){if(k==='spend'||k==='cpl')return usd(v);if(k==='ctr')return (100*v).toFixed(2)+'%';return num(v)}
function lineSvg(dd,k,opts){opts=opts||{};const W=1000,H=opts.H||240,L=62,R=14,T=14,Bm=26;const vals=dd.map(r=>r[k]).filter(v=>v!=null);const mx=nice(Math.max(...vals,0)*1.08)||1;const n=dd.length;const x=i=>L+(n<=1?0:(W-L-R)*i/(n-1));const y=v=>T+(H-T-Bm)*(1-v/mx);
 let g='';for(let j=0;j<=4;j++){const v=mx*j/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${L-8}" y="${y(v)+4}" font-size="11" fill="#555" text-anchor="end">${yfmt(k,v)}</text>`}
 const step=Math.max(1,Math.ceil(n/9));for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${H-8}" font-size="11" fill="#555" text-anchor="middle">${sd(dd[i].d)}</text>`;
 let marks='';if(opts.marks){dd.forEach((r,i)=>{const m=D.marks[r.d];if(m)marks+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-Bm}" stroke="${m.some(z=>z.a==='launched')?'#1f7a35':'#b8261b'}" stroke-dasharray="3 3" opacity=".55"/>`})}
 let path='';let pen=false;dd.forEach((r,i)=>{const v=r[k];if(v==null){pen=false;return}path+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true});
 const dots=n<=70?dd.map((r,i)=>r[k]==null?'':`<circle cx="${x(i)}" cy="${y(r[k])}" r="2.3" fill="${MC[k]||'#4F2D7F'}"/>`).join(''):'';
 const id=opts.id||'c';
 return `<svg viewBox="0 0 ${W} ${H}" onmousemove="chMove(event,'${id}','${k}')" onmouseleave="chLeave('${id}')">${g}${marks}<path d="${path}" fill="none" stroke="${MC[k]||'#4F2D7F'}" stroke-width="2"/>${dots}<line id="${id}-vl" x1="0" x2="0" y1="${T}" y2="${H-Bm}" stroke="#999" opacity="0"/></svg><div class="ttip" id="${id}-tip"></div>`}
const CHD={};
function chMove(ev,id,k){const dd=CHD[id];if(!dd)return;const svg=ev.currentTarget;const r=svg.getBoundingClientRect();const W=1000,L=62,R=14;const fx=(ev.clientX-r.left)/r.width*W;const n=dd.length;let i=Math.round((fx-L)/((W-L-R)/(Math.max(1,n-1))));i=Math.max(0,Math.min(n-1,i));const row=dd[i];const xx=L+(n<=1?0:(W-L-R)*i/(n-1));const vl=document.getElementById(id+'-vl');vl.setAttribute('x1',xx);vl.setAttribute('x2',xx);vl.setAttribute('opacity','.6');
 const tip=document.getElementById(id+'-tip');let h=`<b>${fmtD(row.d)}</b><br>${MLAB[k]||'7-day rolling CTR'}: ${row[k]==null?'-':yfmt(k,row[k])}`;const m=D.marks&&D.marks[row.d];if(m&&id==='c'){const la=m.filter(z=>z.a==='launched'),st=m.filter(z=>z.a==='stopped');if(la.length)h+=`<br><span style="color:#1f7a35">First delivery:</span> ${la.map(z=>esc(z.n)).join(', ')}`;if(st.length)h+=`<br><span style="color:#b8261b">Last delivery:</span> ${st.map(z=>esc(z.n)).join(', ')}`}
 tip.innerHTML=h;tip.style.display='block';const px=(xx/W)*r.width;tip.style.left=Math.min(px+12,r.width-240)+'px';tip.style.top='8px'}
function chLeave(id){const t=document.getElementById(id+'-tip');if(t)t.style.display='none';const vl=document.getElementById(id+'-vl');if(vl)vl.setAttribute('opacity','0')}
function dailyChart(){const dd=rollSeries();CHD.c=dd;const [a,b]=chartRange();const ks=['spend','impr','clicks','ctr','leads','cpl'];
 const pl=ks.map(k=>`<button class="${k==DM?'on':''}" onclick="setDM('${k}')">${MLAB[k]}</button>`).join('');
 const span=P==='l6m'?'last 6 months':'last 60 days';
 return `<div class="daily"><div class="ch"><div><h3>Daily performance</h3><div class="desc">${fmtD(a)} to ${fmtD(b)} (${span}). Account level, 7-day rolling window. The Last 6 months pill extends the chart; the other pills show the last 60 days.</div></div><div class="seg sm">${pl}</div></div><div class="chart">${lineSvg(dd,DM,{marks:true,id:'c'})}</div><div class="legend"><span><i style="background:${MC[DM]}"></i>${MLAB[DM]}</span><span><i style="background:#1f7a35"></i>Ad set first delivery</span><span><i style="background:#b8261b"></i>Ad set last delivery</span><span>Hover the chart for the day's value and what changed.</span></div></div>`}

const OPEN=new Set();const SORT={k:'s',d:-1};const SORT2={k:'s',d:-1};const FATOPEN=new Set();
const FORD=['Document','Carousel','Single image','Video','Thought Leader Ad','Spotlight','Text','Message','Follower','Other'];
function togF(f){OPEN.has(f)?OPEN.delete(f):OPEN.add(f);render()}
function srt(k){sorter(SORT,k);render()}
function srt2(k){sorter(SORT2,k);render()}
function togFat(id){FATOPEN.has(id)?FATOPEN.delete(id):FATOPEN.add(id);render()}
function adsInPeriod(){const v=D.AV[P];return Object.keys(D.ads).filter(id=>v[id]&&(v[id][1]>0||v[id][0]>0))}
function cells(t){return `<td>${usd(t.s)}</td><td>${num(t.i)}</td><td>${num(t.c)}</td><td>${bCtr(t)}</td><td>${bCpc(t)}</td><td>${num(t.l)}</td><td>${cplS(t.s,t.l)}</td><td>${bDw(t)}</td>`}
const shortSet=n=>String(n||'').replace(/^GT_LinkedIn_/,'').replace(/_/g,' ');
function adTable(){const v=D.AV[P];const ids=adsInPeriod();if(!ids.length)return '<div class="empty">No ad delivery in this period.</div>';
 const byF={};ids.forEach(id=>{(byF[D.ads[id].fmt]=byF[D.ads[id].fmt]||[]).push(id)});
 const rows=Object.entries(byF).map(([f,a])=>({f,a,t:sum(v,a)}));
 const cmp=(a,b)=>SORT.d*((metricVal(a.t,SORT.k)>metricVal(b.t,SORT.k))?1:(metricVal(a.t,SORT.k)<metricVal(b.t,SORT.k))?-1:0);rows.sort(cmp);
 const H=(k,l)=>`<th class="s" onclick="srt('${k}')">${l}${arrow(SORT,k)}</th>`;
 let body='';rows.forEach(r=>{const open=OPEN.has(r.f);const live=r.a.filter(id=>D.ads[id].live).length;const lg=r.a.filter(id=>D.ads[id].lgf).length;
  body+=`<tr class="grp" onclick="togF('${esc(r.f)}')"><td class="nm"><span class="car">${open?'&#9660;':'&#9654;'}</span><span class="vlab">${esc(r.f)}</span><div class="vdesc">${r.a.length} ad${r.a.length==1?'':'s'}${lg?`, ${lg} with a Lead Gen Form`:''}</div></td><td>${live?`<span class="pill p-g">${live} live</span>`:'<span class="pill p-n">None live</span>'}</td>${cells(r.t)}</tr>`;
  if(open){const kids=r.a.map(id=>({id,t:sum(v,[id])}));kids.sort((a,b)=>cmp(a,b));kids.forEach(k=>{const A=D.ads[k.id];const S=D.sets[A.set]||{};
   body+=`<tr class="kid"><td class="nm"><span class="vlab">${esc(A.n)}</span>${A.lgf?'<span class="tag">Lead Gen Form</span>':''}<div class="vdesc">${esc(shortSet(S.n))}${A.first?' · first delivery '+fmtD(A.first):''}</div></td><td>${stPill(A.st)}</td>${cells(k.t)}</tr>`})}});
 const T=sum(v,ids);body+=`<tr class="tot"><td>Total</td><td></td>${cells(T)}</tr>`;
 return `<div class="tw"><table><thead><tr><th>Format / ad</th><th>Status now</th>${H('s','Spend')}${H('i','Impr.')}${H('c','Clicks')}${H('ctr','CTR')}${H('cpc','CPC')}${H('l','Leads')}${H('cpl','CPL')}${H('dw','Dwell time')}</tr></thead><tbody>${body}</tbody></table></div><div class="note">Click a format to see its ads. Click a column to sort. ${benchNote()}</div>`}
function adsets(){const v=D.CV[P];const ids=Object.keys(D.sets).filter(id=>D.sets[id].st==='Active'||(v[id]&&(v[id][1]>0||v[id][0]>0)));
 const rows=ids.map(id=>({id,t:sum(v,[id]),S:D.sets[id]}));
 const cmp=(a,b)=>{const ac=a.S.st==='Active'?0:1,bc=b.S.st==='Active'?0:1;if(ac!==bc)return ac-bc;const x=metricVal(a.t,SORT2.k),y=metricVal(b.t,SORT2.k);return SORT2.d*(x>y?1:x<y?-1:0)};rows.sort(cmp);
 const H=(k,l)=>`<th class="s" onclick="srt2('${k}')">${l}${arrow(SORT2,k)}</th>`;
 const body=rows.map(r=>{const la=r.S.st==='Active'?`${r.S.live_ads} of ${r.S.ads}${r.S.live_ads<3?' <span class="pill p-r">Under 3</span>':r.S.live_ads>6?' <span class="pill p-a">Over 6</span>':''}`:`0 of ${r.S.ads}`;
  return `<tr><td class="nm"><span class="vlab">${esc(r.S.n)}</span><div class="vdesc">${esc(r.S.obj)} · ${esc(r.S.fmt)}</div></td><td>${stPill(r.S.st)}</td><td>${la}</td><td>${usd(r.t.s)}</td><td>${bCtr(r.t)}</td><td>${num(r.t.l)}</td><td>${cplS(r.t.s,r.t.l)}</td></tr>`}).join('');
 return `<div class="sh"><h2>Ad sets</h2><span class="sc">All ad sets, ${esc(D.periods[P].label.toLowerCase())}</span></div><div class="note" style="margin:0 0 10px">Live ad sets plus paused or completed ad sets with delivery in this period. Live ads = ads that are Active and serving now. Spend, CTR, leads and CPL follow the period pills.</div>
 ${rows.length?`<div class="tw"><table><thead><tr><th>Ad set</th><th>Status</th><th>Live ads</th>${H('s','Spend')}${H('ctr','CTR')}${H('l','Leads')}${H('cpl','CPL')}</tr></thead><tbody>${body}</tbody></table></div>`:'<div class="empty">No ad sets in this period.</div>'}`}
function fatChart(id){const dd=[];const arr=D.ROLL[id]||[];const s=new Date(D.meta.roll[0]+'T12:00:00');arr.forEach((v,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);dd.push({d:d.toISOString().slice(0,10),ctr:v})});
 if(!dd.some(r=>r.ctr!=null))return '<div class="empty">No 7-day rolling CTR window in the last 60 days for this ad.</div>';CHD['f'+id]=dd;
 return `<div class="note" style="margin:0 0 8px">7-day rolling CTR (clicks / impressions), ${sd(D.meta.roll[0])} to ${fmtD(D.meta.roll[1])}. Gaps are days with no impressions in the window. Click the row again to collapse.</div><div class="chart">${lineSvg(dd,'ctr',{H:200,id:'f'+id})}</div>`}
function fatigue(){const w=D.meta.fwin;const F=D.FAT;const rs=Object.entries(F).filter(([id,v])=>v.drop!=null&&v.drop>=20).map(([id,v])=>({id,...v})).sort((a,b)=>b.drop-a.drop);
 const chk=Object.values(F).filter(v=>v.drop!=null).length;const lowLive=Object.entries(F).filter(([id,v])=>v.st==='low'&&D.ads[id].live).length;const nw=Object.entries(F).filter(([id,v])=>v.st==='new'&&D.ads[id].live).length;
 const body=rs.map(r=>{const A=D.ads[r.id];const S=D.sets[A.set]||{};const open=FATOPEN.has(r.id);return `<tr class="fat-row" onclick="togFat('${r.id}')"><td class="nm"><span class="car">${open?'&#9660;':'&#9654;'}</span><span class="vlab">${esc(A.n)}</span><span class="tag">${esc(A.fmt)}</span><div class="vdesc">${esc(shortSet(S.n))} · first delivery ${fmtD(r.first)}</div></td><td>${r.drop>=30?'<span class="pill p-a">Flagged</span>':'<span class="pill p-n">Watch</span>'}</td><td>${r.ctr1.toFixed(2)}%</td><td>${r.ctr2.toFixed(2)}%</td><td><span class="dn">&#8595; ${Math.round(r.drop)}%</span></td><td>${num(r.i1)}</td><td>${num(r.i2)}</td></tr>`+(open?`<tr class="fat-chart"><td colspan="7">${fatChart(r.id)}</td></tr>`:'')}).join('');
 return `<div class="sh"><h2>Creative fatigue</h2><span class="sc">All ad sets</span></div>
 <div class="note" style="margin:0 0 12px">CTR in the last 14 days (${sd(w[0])} to ${fmtD(w[1])}) vs each ad's first 14 days. Flagged at a 30%+ drop, watch at 20 to 30%. Needs 1,000+ impressions in both windows, and the ad's first delivery must be on or before ${fmtD(D.meta.felig)} so the windows do not overlap. Fixed windows, not tied to the period. Click an ad to see its 7-day rolling CTR over the last 60 days.</div>
 ${rs.length?`<div class="tw"><table><thead><tr><th>Ad</th><th>Status</th><th>CTR, first 14 days</th><th>CTR, last 14 days</th><th>Change</th><th>Impr., first 14 days</th><th>Impr., last 14 days</th></tr></thead><tbody>${body}</tbody></table></div>`:'<div class="empty">No ads flagged or near the threshold.</div>'}
 <div class="note">${chk} ad${chk==1?'':'s'} had enough volume in both windows to check. ${lowLive} live ad${lowLive==1?' is':'s are'} under 1,000 impressions in one of the windows and ${nw} live ad${nw==1?' is':'s are'} too new to compare.</div>`}
function render(){pills();const ids=Object.keys(D.ads);const c=sum(D.AV[P],ids),p=sum(D.AV[P+'p'],ids);const per=D.periods[P];
 $('themes').innerHTML=`<div class="sh"><h2>Creative performance by format</h2><span class="sc">All ads, ${esc(per.label.toLowerCase())}</span></div>${kpiBlock(c,p,['spend','clicks','leads','cpl'])}${dailyChart()}${adTable()}`;
 $('adsets').innerHTML=adsets();$('fatigue').innerHTML=fatigue()}
$('thru').textContent=fmtD(D.meta.through);$('asof').textContent=D.meta.asof;$('nlive').textContent=D.meta.live_sets;
$('foot').innerHTML=`<li>LinkedIn Ads account ${D.meta.account} (Grant Thornton US), USD, creative-level data from the LinkedIn Marketing API through ${fmtD(D.meta.through)} (last complete UTC day). Status now is each ad's current status as of ${esc(D.meta.asof)}: Live = Active and serving; Not serving = Active but its ad set or campaign has ended.</li>
<li>Format comes from the ad set's format in Campaign Manager (document ads from the ad itself). Thought Leader Ad = boosted member posts, which the API reports with an unknown format. Lead Gen Form = the ad has a LinkedIn Lead Gen Form attached.</li>
<li>Leads = LinkedIn Lead Gen Form submissions (oneClickLeads). CPL = spend / leads, a dash when there are no leads. LinkedIn counts will not match Marketo or CRM totals exactly (sync timing, de-duplication, junk or test submissions, and leads from other sources).</li>
<li>CTR = clicks / impressions. CPC = spend / clicks. Dwell time = LinkedIn average dwell time, impression-weighted when rows are combined. Period totals come from LinkedIn period pulls.</li>
<li>Ad sets: on live ad sets, a red pill flags fewer than 3 live ads and an amber pill flags more than 6.</li>
<li>Creative fatigue uses daily ad-level clicks and impressions with fixed windows: the last 14 complete days vs each ad's own first 14 days of delivery.</li>`;
render();

</script></body></html>
