 let g='';const ticks=4;for(let k=0;k<=ticks;k++){const v=y0+(y1-y0)*k/ticks,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#ECECEC"/>`+TX(L-8,yy+4,String(Math.round(v)),{a:'end'})}
 if(y0<100&&100<y1)g+=`<line x1="${L}" x2="${W-R}" y1="${y(100)}" y2="${y(100)}" stroke="#BDBDBD" stroke-dasharray="3 4"/>`+TX(L-8,y(100)+4,'100',{a:'end',c:'#6B6B6B'});
 g+=TX(L,12,'Index',{fs:10,c:'#8A8A8A'});
 const fmt={lp:v=>num(v),ctr:v=>(100*v).toFixed(2)+'%',cpl:v=>usd(v)};
 const names={lp:'Rolling LP clicks',ctr:'Rolling LP CTR',cpl:'Rolling Cost/LP'};
 let body='';
 keys.forEach(k=>{const pts=d.map((r,i)=>{const v=idxOf(r,k);return v==null?null:[x(i),y(v)]});
  const segs=[];let cur=[];pts.forEach((p,i)=>{if(!p){if(cur.length){segs.push(cur);cur=[]}return}cur.push(p);const nxt=pts[i+1];if(!nxt||(nxt&&Math.abs(nxt[0]-p[0])>bw*1.6)){segs.push(cur);cur=[]}});
  body+=segs.map(s=>s.length===1?'':`<polyline fill="none" stroke="${MC[k]}" stroke-width="2.2" points="${s.map(p=>p.join(',')).join(' ')}"/>`).join('');
  body+=d.map((r,i)=>{const v=idxOf(r,k);return v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${MC[k]}"/>`}).join('')});
 MTIPS={};MTIPN=0;
 const hits=d.map((r,i)=>{const id=tipId(`<div class="mh">${esc(fmtD(r[0]))}</div>`+keys.map(k=>`<div class="ml"><i style="background:${MC[k]}"></i><b>${names[k]}:</b> ${r[k]==null?'n/a':fmt[k](r[k])}</div>`).join(''));return `<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" style="cursor:crosshair" onmouseenter="showMtip(event,'${id}')" onmouseleave="hideMtip()"/>`}).join('');
 const step=Math.ceil(n/12);const lab=d.map((r,i)=>i%step==0||i==n-1?TX(x(i),H-B+18,sd(r[0]),{a:'middle'}):'').join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Rolling LP clicks, LP CTR, and Cost/LP, indexed to 100">${g}${body}${lab}${hits}</svg>`}
function dailyChart(){const ch=D.CHART||{start:'',end:'',s:{}};const pack=chartPack();
 const MET={lp:['lp',v=>v==null?'n/a':num(v),MC.lp,'Rolling LP clicks'],ctr:['ctr',v=>v==null?'n/a':(100*v).toFixed(2)+'%',MC.ctr,'Rolling LP CTR'],cpl:['cpl',v=>v==null?'n/a':usd(v),MC.cpl,'Rolling Cost/LP']};
 const dd=pack.d.map(r=>({0:r[0],lp:r[1],ctr:r[2],cpl:r[3]==null?null:r[3]}));
 MTIPS={};MTIPN=0;
 const byD={};(pack.m||[]).forEach(([d,items])=>{(byD[d]=byD[d]||{d,ads:[],ms:[]}).ads.push(...items)});(pack.ms||[]).forEach(([d,items])=>{(byD[d]=byD[d]||{d,ads:[],ms:[]}).ms.push(...items)});
 const MARKS=Object.keys(byD).sort().map(d=>byD[d]);
 const one=(m,H,o)=>`<div style="font-size:12px;font-weight:600;color:var(--ink);margin:4px 0 0 4px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${m[2]};margin-right:6px"></i>${m[3]}</div>`+tpanel(dd,m[0],m[1],m[2],H,{name:m[3],marks:MARKS,...o});
 const inner=!dd.length?`<div class="empty">No delivery in the last 60 days for this filter.</div>`:(DMODE==='all'?allPanel(dd,320):one(MET[DMODE]||MET.lp,300,{xl:1}));
 const tip='Single-metric views mark bigger account changes in the current filter: a new ad set on its first day with delivery, an ad set paused or ended on its last day with delivery if it is no longer live, and a new campaign (campaign group) if one launched in this window. Objective and daily budget change history is not available from the LinkedIn API, so those are not marked. All three plots the three rolling metrics on one chart, each indexed to 100 at the start of the window; hover for actual values. Rolling metrics use a 7-day window. The chart always shows the last 60 days and follows the segment and industry filters, not the period pills.';
 const pills=[['lp','Rolling LP clicks'],['ctr','Rolling LP CTR'],['cpl','Rolling Cost/LP'],['all','All three']].map(([k,l])=>`<button class="${k==DMODE?'on':''}" onclick="setD('${k}')">${l}</button>`).join('');
 const vis=DMODE==='all'?['lp','ctr','cpl']:[DMODE];
 const metLeg=vis.map(k=>`<span><i style="background:${MET[k][2]}"></i>${MET[k][3]}</span>`).join('');
 const markLeg=DMODE==='all'?'':`<span><i style="background:#2E6B45;border-radius:50%"></i>New ad sets launched</span><span><i style="background:#b8261b;border-radius:50%"></i>Ad sets paused</span><span><i style="background:#7756FF;border-radius:50%"></i>Milestone</span><span>Hover a marker for what changed</span>`;
 const idxNote=DMODE==='all'?'<span>Each line is indexed to 100 at the start of the window. Hover for actual values.</span>':'';
 const rollNote='<span>Rolling metrics use a 7-day window.</span>';
 return `<div class="daily" id="daily"><div class="ch"><div><h2>Daily performance ${info(tip)}</h2><div class="desc">${sd(ch.start)} to ${fmtD(ch.end)} (last 60 days). Follows the segment and industry filters, not the period pills.</div></div><div class="seg sm" id="dmode">${pills}</div></div><div class="chart" id="trend">${inner}</div><div class="legend">${metLeg}${markLeg}${idxNote}${rollNote}</div></div>`}

function render(){if(typeof hideMtip==='function')hideMtip();const p=D.periods[P];const rows=scoped();
 $('pills').innerHTML=ORDER.map(k=>`<button class="${k==P?'on':''}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');
 const pr=p.prior||{start:p.prior_start,end:p.prior_end};
 $('range').textContent=`${sd(p.start)} to ${fmtD(p.end)} vs ${sd(pr.start)} to ${fmtD(pr.end)}`;
 $('segs').innerHTML=[['All','All'],['ENT','ENT'],['GRW','GRW']].map(([k,l])=>`<button class="${k==SEG?'on':''}" onclick="setG('${k}')" title="${k=='All'?'Enterprise, Growth and Retargeting':SEGT[k]+' ad sets only'}">${l}</button>`).join('');
 $('inds').innerHTML=INDS.filter(k=>!(SEG!='All'&&k=='Retargeting')).map(k=>`<button class="${k==IND?'on':''}" onclick="setI('${k}')">${dotH(k)}${k}</button>`).join('');
 const sl=SUBS[IND];$('subs').style.display=sl?'':'none';
 $('subs').innerHTML=sl?[['All','All '+IND]].concat(sl).map(([k,l])=>`<button class="${k==SUB?'on':''}" onclick="setS('${k}')">${k=='All'?'':dotH(SUBT[k])}${esc(l.split(' / ')[0])}</button>`).join(''):'';
 const title=campView()?'Campaign performance':'Ad set performance';
 $('main').innerHTML=`<div class="sh"><h2>${title}</h2><span class="sc">${esc(scopeLabel())}, ${esc(p.label.toLowerCase())}</span></div>${kpis(rows)}${dailyChart()}${table()}`;
}
$('nlive').textContent=(D.meta&&D.meta.live_camps!=null)?D.meta.live_camps:'';
$('nhist').textContent=(D.meta&&D.meta.hist_camps!=null)?D.meta.hist_camps:'';
$('thru').textContent=fmtD((D.meta&&D.meta.through)||D.asof);
$('asof').textContent=(D.meta&&D.meta.asof)||D.asof_label;
$('foot').innerHTML=`<li>LinkedIn Ads account 509859857. The All view lists campaigns (campaign groups). Choose ENT, GRW, or an industry to see ad set rows. Tables include live ad sets and paused or completed ad sets that delivered in the selected period. Status is the ad set's current status: Active (ACTIVE and serving) or Paused.</li>
<li>Cost/LP = spend / landing page clicks, in whole dollars. LP CTR = landing page clicks / impressions, shown to two decimals. Prior = previous equal-length period (month to date: same days last month). Period comparisons are whole percents. Dwell is the period average, shown to one decimal second. Audience size is current targeting from LinkedIn audienceCounts as of the pull, not a historical size for the period. Reach is approximate member reach for the selected period (not a sum of daily reach). Audience penetration = period reach ÷ current audience size, as a whole percent. Campaign-level reach, audience size, and penetration are not shown because those metrics are not de-duplicated across ad sets.</li>
<li>Companies reached counts unique companies with impressions in the period (MEMBER_COMPANY), unioned under the current filter when that pull exists. Combined segment+industry filters, and filtered views on Last 7 days, MTD, and Last 60 days, show a dash rather than a guessed unique count.</li>
<li>The Daily performance chart always covers the last 60 days ending ${fmtD((D.meta&&D.meta.through)||D.asof)}, and uses six days before that so the first chart day has a full 7-day window. It follows the segment and industry filters, not the period pills. Rolling metrics use a 7-day window: Rolling LP clicks = LP clicks in the last 7 days, Rolling LP CTR = LP clicks in the last 7 days / impressions in the last 7 days, and Rolling Cost/LP = spend in the last 7 days / LP clicks in the last 7 days, in whole dollars. All three plots those lines on one chart, each indexed to 100 at the start of the window; hover for actual values. There are no change or milestone markers on All three. On single-metric views, a compact marker is an ad set's first day with delivery for a launch, or last day with delivery for a pause (only if the ad set is no longer live), or a new campaign (campaign group) if one launched in the window. LinkedIn does not provide objective or daily budget change history, so those are not marked. Nearby dates are merged when needed so labels never overlap. Hover a marker for the names of what changed.</li>
<li>Last business day spend is spend on ${D.last_biz_day_label}. Daily budget and objective are current campaign-entity values at pull time.</li>`;
render();
