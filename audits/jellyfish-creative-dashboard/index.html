me":"Irina Stanescu, coding agents","raw":"","camp":"447903864","live":true,"share":"urn:li:share:7402035693453008896","th":"TLA","typ":"tla","ftyp":"tla","fmt":"share","seg":"cold","vid":false,"author":"Irina Stanescu","topic":"coding agents","key":"urn:li:share:7402035693453008896"},{"id":"943268064","name":"Irina Stanescu, coding agents","raw":"","camp":"447803774","live":false,"share":"urn:li:share:7402035693453008896","th":"TLA","typ":"tla","ftyp":"tla","fmt":"share","seg":"cold","vid":false,"author":"Irina Stanescu","topic":"coding agents","key":"urn:li:share:7402035693453008896"},{"id":"943277874","name":"Irina Stanescu, coding agents","raw":"","camp":"447944074","live":true,"share":"urn:li:share:7402035693453008896","th":"TLA","typ":"tla","ftyp":"tla","fmt":"share","seg":"cold","vid":false,"author":"Irina Stanescu","topic":"coding agents","key":"urn:li:share:7402035693453008896"}],"NM":{"id:1070375534":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad","vid":true,"fmt":"video","author":"","pv":null,"link":"has"},"urn:li:share:7402035693453008896":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Irina Stanescu \u00b7 coding agents","label":"Irina Stanescu, coding agents","vid":false,"fmt":"share","author":"Irina Stanescu","pv":null,"text":"Coding agents, review agents, testing agents, documentation agents - some are 10x multipliers, others are burning money, and you can't tell which.\nThat's the gap in every AI strategy.\n\nWhile orgs are tracking adoption rates and counting PRs, the real questions go unanswered:\n\u2192 Which agents actually improve velocity vs. creating busy work?\n\u2192 What do engineers REALLY think about these agents?\n\u2192 How do leaders tell the board if that $2M AI investment is paying off?\n\nAfter analyzing millions of PRs, here's what we know: AI-assisted development jumped from 14% to 51% in one year. Cycle times dropped ~16%.\n\nBut that's the average. The reality? Some teams are thriving with AI agents. Others are drowning in bad suggestions and context switching.\nYou need to know which is which.\n\nThat's why Jellyfish is leading the innovation in measuring AI impact - going beyond simple adoption metrics to give you the complete picture. Their latest AI Impact features include:\n\n\u2b29Autonomous Agent Insights - Finally see what all your agents are actually doing across the SDLC\n\n\u2b29Developer Insights - Understand sentiment beyond adoption metrics (spoiler: adoption \u2260 happiness)\n\n\u2b29Executive Reporting Workflows - Connect agent activity \u2192 developer impact \u2192 business outcomes in one story\n\nThe days of guessing about AI ROI are over.\n\n\ud83d\udc49 Request a demo and start guiding your AI strategy with confidence: https://lnkd.in/gBw_T2yf\n\nP.S. The same AI agent can be a multiplier for one team and a distraction for another. Without the right data, you'll never know which","hook":"Coding agents, review agents, testing agents, documentation agents - some are 10x multipliers, others are burning money, and you can't tell which. That's the gap in every AI...","link":"has"},"urn:li:share:7361185428827217921":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q3 2025 - EMP - Quantexa Jamie, CTO testimonial (Blue)","label":"EMP - Quantexa Jamie, CTO testimonial","vid":false,"fmt":"share","author":"","pv":"previews/share-7361185428827217921.jpg","link":"has"},"urn:li:share:7361184673554657281":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q3 2025 - AI Impact - Hootsuite testimonial (Blue)","label":"AI Impact - Hootsuite testimonial","vid":false,"fmt":"share","author":"","pv":"previews/share-7361184673554657281.jpg","link":"has"},"urn:li:share:7361187372597669888":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q3 2025 - EMP - Quantexa, Ian testimonial (Purple)","label":"EMP - Quantexa, Ian testimonial (Purple)","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7407546360675147776":{"th":"DX","typ":"company","ftyp":"image","desc":"","label":"Q4 BOFU: EMP/DevEx - Theme: Productivity","vid":false,"fmt":"share","author":"","pv":"previews/share-7407546360675147776.jpg","link":"has"},"urn:li:share:7416620735726747648":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q4 BOFU: AI Impact - Theme: ROI, investors (personalized)","label":"Q4 BOFU: AI Impact - Theme: ROI, investors","vid":false,"fmt":"share","author":"","pv":"previews/share-7416620735726747648.jpg","link":"has"},"spotlight:1127680834":{"th":"OTHER","typ":"spotlight","ftyp":"spotlight","desc":"Aircover - Spotlight - AI Impact - AI ROI","label":"Measure AI ROI with Jellyfish","vid":false,"fmt":"spotlight","author":"","pv":null,"link":"has"},"id:1135194414":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad","vid":true,"fmt":"video","author":"","pv":null,"link":"has"},"urn:li:share:7424546389319372802":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q1 2026 - BOFU: AI Impact - ROI, Investors","label":"BOFU: AI Impact - ROI, Investors","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"spotlight:1139860704":{"th":"STRATEGY","typ":"spotlight","ftyp":"spotlight","desc":"Aircover - Spotlight - AI Impact - AI Transformation","label":"Lead AI Transformation with Clarity","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"urn:li:share:7427403713058619393":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Arcolano \u00b7 18% PRs","label":"Arcolano, 18% PRs","vid":false,"fmt":"share","author":"Arcolano","pv":"previews/share-7427403713058619393.jpg","text":"Last year we reported that AI-assisted PRs contained about 18% more lines of code than non-AI PRs. That felt significant at the time. Now? We're seeing 50-160% more code per person depending on the tool, and the gap keeps widening.\n\nThis chart shows average lines of code added per person per week, broken out by AI coding tool, from Jellyfish data over the past two months. In January, Claude Code users averaged 2.6x the lines added compared to engineers not using AI tools. Cursor came in at 1.6x, GitHub Copilot at 1.5x.\n\nOne thing that jumped out: look at the end of December. Activity (predictably) dipped across the board for the holidays... except Claude Code, which spiked. If you were online over the break, you may have heard folks talking about \"Claude Christmas\", where the November Opus 4.5 release + increased usage limits + holiday downtime led to a big surge in usage. Our data corroborates the hype: whatever was happening over the holidays, Claude Code users were shipping.\n\nTo be clear: lines of code isn't the whole story \u2013 quality is paramount, more code isn't always better code, and all this volume has the potential to create bottlenecks elsewhere in the SDLC. But this is a striking signal about how much raw output varies by tool, and it's consistent with the PR throughput patterns we've been tracking.\n\nLast year was about exploration. This year is all about scaling. If January is any indication, it's going to be a wild ride!","hook":"Last year we reported that AI-assisted PRs contained about 18% more lines of code than non-AI PRs. That felt significant at the time. Now? We're seeing 50-160% more code per...","link":"no"},"urn:li:share:7430719728400322560":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"text":"Lately I've been talking with friends asking for advice on where to start and which AI coding tool they should use.  (Should I use Cursor or Claude ?)\nOur users at Jellyfish are asking similar questions: \"How do we know if we're using this agent correctly?\" and \"How should we measure this new workflows?\"\nThis sparked a research article about measuring agents and agentic workflows. We analyzed millions of suggestions across GitHub Copilot, Cursor, and Claude Code throughout 2025.\nSome interesting findings:\n\u2192 Four distinct workflows emerged\u2014each requires different metrics \n\u2192 Claude Code users are barely reverting the code they push (Forward coding and let Claude fix it ! )\n\u2192 Only the most advanced teams are speeding up cycle times with Copilot Chat\u2014everyone else is actually moving slower(?)\n\nWhich of these are you using? Drop your tool in the comments \u2014 Claude, Cursor, GitHub Copilot, or something else?\n\nFull article in the comments \ud83d\udc47","hook":"Lately I've been talking with friends asking for advice on where to start and which AI coding tool they should use.  (Should I use Cursor or Claude ?) Our users at Jellyfish...","link":"no"},"urn:li:share:7432949836695371776":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q1 2026 - AI Impact - TaskRabbit testimonial (Blue)","label":"AI Impact - TaskRabbit testimonial","vid":false,"fmt":"share","author":"","pv":"previews/share-7432949836695371776.jpg","link":"has"},"urn:li:share:7432487770192932864":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Irina Stanescu \u00b7 It started with autocomplete","label":"Irina Stanescu, autocomplete","vid":false,"fmt":"share","author":"Irina Stanescu","pv":null,"text":"It started with autocomplete. Then assistants writing whole functions. Then vibe coding.\n\nNow we're in the era of agentic engineering, where AI agents autonomously ship code on behalf of your team. Each shift happened faster than the last.\n\nAnd with each one, the gap between teams getting the most out of AI and everyone else keeps growing. \n\nMost orgs have adopted AI tools - the median is 63% across 700+ companies. But adopting and optimizing are two very different things.\n\nThe bet players ahead are treating AI like any other engineering investment: measuring what's working, comparing against benchmarks, and adjusting.\n\nThe latest Jellyfish AI Engineering Trends report shows what that looks like in practice. Top adopters are seeing 2x PR throughput without sacrificing quality, and 8% of PRs are now coming from autonomous agents.\n\nAnd the next shift is already here (subagents, teams of agents). If you want to know where your org stands before that wave hits, this is a good place to start: https://lnkd.in/dwkys72x","hook":"It started with autocomplete. Then assistants writing whole functions. Then vibe coding. Now we're in the era of agentic engineering, where AI agents autonomously ship code on...","link":"has"},"urn:li:ugcPost:7434262939710246912":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7434262939710246912.jpg","text":"Pull requests are units of code, not units of value. Recently we've started looking at whether teams with high AI adoption are actually shipping more features.\n\nHere's a short video outlining what we learned when we looked at Jellyfish data around project delivery for 700+ companies over the last 3 months. Check it out!","hook":"Pull requests are units of code, not units of value. Recently we've started looking at whether teams with high AI adoption are actually shipping more features. Here's a short...","link":"no"},"urn:li:share:7328113441322246144":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Adam Ferrari \u00b7 Quantifying AI Coding Impact","label":"Adam Ferrari, Quantifying AI Coding Impact","vid":false,"fmt":"share","author":"Adam Ferrari","pv":null,"text":"More and more Engineering leaders I speak with have quickly graduated from \u201cHow do we get started with AI coding tools?\u201d to the tougher question of \u201cHow do we actually measure the impact?\u201d\n\nRecent stats about AI impact at Microsoft from Satya Nadella (such as the claim that 30% of code in newer areas being created by AI) have only increased the urgency.\n\nGiven how quickly both the tools and approaches around AI coding are evolving, it's no surprise that methods of measuring its impact are far from baked. But we're starting to see signs of progress.\n\nIn my new post I look at the types of analytics that AI coding tools are providing, as well as how Engineering metrics platforms are starting to engage this problem, and where AI impact measurement is (and should be) headed.\n\nRead it here: https://lnkd.in/em_djWpz","hook":"More and more Engineering leaders I speak with have quickly graduated from \u201cHow do we get started with AI coding tools?\u201d to the tougher question of \u201cHow do we actually measure...","link":"has"},"urn:li:share:7336440147447541763":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Andrew Lau \u00b7 friend texted me","label":"Andrew Lau, friend texted me","vid":false,"fmt":"share","author":"Andrew Lau","pv":null,"text":"A friend texted me this weekend for some advice. They said their CEO just sent this over and asked how to reply.\n\n\"If AI tools can really turn junior or average engineers into 10x contributors, why aren\u2019t we doing more? Why does this still feel optional?\"\n\nI wasn\u2019t surprised. This is the number one question I hear from engineering leaders.\u00a0 So here\u2019s how I broke it down:\n\n1. Reality today\n\nAcross teams using tools like Copilot, Cursor, Amazon Q, Gemini Code Assist, Sourcegraph, and others, we\u2019re seeing measurable productivity gains. Studies and data from the Jellyfish platform consistently show:\n\n- 30-50% faster throughput for engineers who engage deeply with these tools\n- Significant reductions in boilerplate work and time-to-implementation\n- But only one-third of engineers are using them consistently (monthly)\n\nIt\u2019s a significant gain, but it\u2019s certainly not 10x. And while those gains do happen, they're just not indicative of what you can realistically expect in the common case. We usually see those outsized speedups under the following conditions:\n\n- Greenfield teams writing entirely new code\n- AI-native workflows with heavy automation\n- Engineers who are deeply enabled, trained, and incentivized to adapt\n\nMost orgs today are still operating in legacy environments, where coding new features is a minority share of engineering time, and maintenance, integration and iteration dominate. AI is powerful, but it hasn\u2019t replaced the full software development lifecycle \u2013 or at least not yet.\n\n2. What to tell your CEO \n\nWe shouldn\u2019t push back on the ambition. Instead, we should match it with clarity and action. If your CEO is asking for 10x productivity, answer with the following:\n\n\u201cI want that too. Let\u2019s lean in together,\u201d then: \n\n- Implement clear telemetry on current AI usage and outcomes\n- Build a plan to increase engagement and enablement \u2013 training, guidance, and accountability\n- Create a case for investing in deeper experimentation with emerging tools and workflows\n- Stay tuned in to the state of the art \u2013\u00a0surface, dig in, investigate and understand the circumstances that made outsized gains possible\n- And, if needed, ensure there is a willingness to make team and process changes to meet the moment\n\nAI in engineering is no longer optional. But we\u2019re still in the very early innings. Just because 10x gains aren\u2019t a reality across the board today doesn\u2019t mean they won\u2019t ever be. Things are moving quickly and as we move out of the IDE to take a more agentic approach, productivity gains will only increase.\n\nSuccess requires more than licenses. It demands leadership, enablement, and serious cultural investment. This is a transformation. Let\u2019s treat it like one.","hook":"A friend texted me this weekend for some advice. They said their CEO just sent this over and asked how to reply. \"If AI tools can really turn junior or average engineers into...","link":"no"},"urn:li:ugcPost:7436534555391524864":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7436534555391524864.jpg","text":"The gap between companies adopting autonomous coding agents and companies that haven't started is widening fast. \n\nWe've been tracking this in Jellyfish data for a while now \u2014 when we launched the AI Engineering Trends benchmark last month, the leading companies were at about 10% autonomous PRs. We just cut the February data, and the acceleration is really striking.\n\nHere's a 3-minute whiteboard video explaining what we're seeing: what we mean by \"autonomous agent PRs\", the current benchmarks, and why this is turning out to be an exponential race in its early stages.\n\nWhat are folks seeing at their orgs? Are autonomous coding agents taking off, or are they still mostly experiments?","hook":"The gap between companies adopting autonomous coding agents and companies that haven't started is widening fast. We've been tracking this in Jellyfish data for a while now \u2014...","link":"no"},"urn:li:share:7366857324138811394":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Irina Stanescu \u00b7 Wild Wild West era of AI dev tools","label":"Irina Stanescu, Wild Wild West","vid":false,"fmt":"share","author":"Irina Stanescu","pv":null,"text":"We\u2019re in the Wild Wild West era of AI dev tools. Copilot, Cursor, Gemini, Claude Code, Windsurf\u2026 the list goes on. Many adopted them, but few can measure their impact. Adoption \u2260 impact. \n\n\u2022 Where are the productivity gains?\n\u2022 Which tools deliver ROI?\n\u2022 Where is adoption adding cost without value?\n\u00a0\u00a0\nVisibility into AI tools' performance across the software development lifecycle is limited or non-existent.\n\nAfter analyzing 2M+ PRs, Jellyfish found that:\n\u2022 AI-assisted PRs jumped from 14% to 51% YoY\n\u2022 Cycle times dropped ~16%\n\u2022 Quality held steady\n\nSo yes, there are gains. But not evenly. Different tools, different teams, different outcomes.\n\nThat\u2019s the blind spot: adoption is easy, impact is hard to measure.\n\nAnd that\u2019s the gap Jellyfish built \ud835\uddd4\ud835\udddc \ud835\udddc\ud835\uddfa\ud835\uddfd\ud835\uddee\ud835\uddf0\ud835\ude01 to solve: giving leaders a vendor-agnostic view across Copilot, Cursor, Gemini, Amazon Q, Claude Code, Windsurf, and review agents like CodeRabbit, Graphite, and Greptile.\n\n\ud83d\udc49 If you\u2019re an engineering leader being asked to prove AI ROI, this is the missing data.\n\nRequest a demo to see AI Impact in action: https://lnkd.in/gUCEj_BY","hook":"We\u2019re in the Wild Wild West era of AI dev tools. Copilot, Cursor, Gemini, Claude Code, Windsurf\u2026 the list goes on. Many adopted them, but few can measure their impact. Adoption...","link":"has"},"urn:li:ugcPost:7437970662293524480":{"th":"DX","typ":"company","ftyp":"video","desc":"Q1 2026 - Dev Insights Video - v1 - Script (remarketing)","label":"Dev Insights Video - v1 - Script (remarketing)","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7437970662293524480.jpg","link":"has"},"urn:li:ugcPost:7437969951153549312":{"th":"DX","typ":"company","ftyp":"video","desc":"Q1 2026 - Dev Insights Video - v3 - Tension (aware)","label":"Dev Insights Video - v3 - Tension (aware)","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7441973489210712065":{"th":"DX","typ":"company","ftyp":"video","desc":"Q1 2026 - JF Assistant Video - v3 - \"opportunity\" hook (remarketing)","label":"JF Assistant Video - v3 - \"opportunity\" hook (remarketing)","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7440778693255380992":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q1 2026 - AI Impact - Box testimonial (Blue) - hook v2 - stakeholders","label":"AI Impact - Box testimonial - hook v2 - stakeholders","vid":false,"fmt":"share","author":"","pv":"previews/share-7440815321340510209.jpg","link":"has"},"urn:li:share:7440815321340510209":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q1 2026 - AI Impact - Box testimonial (Blue) - hook v2 - stakeholders","label":"AI Impact - Box testimonial - hook v2 - stakeholders","vid":false,"fmt":"share","author":"","pv":"previews/share-7440815321340510209.jpg","link":"has"},"urn:li:share:7442203002163261440":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7443358446202220544":{"th":"MEASURE","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: AI-integrated engineering_ROI","label":"AI-integrated engineering_ROI","vid":false,"fmt":"share","author":"","pv":"previews/share-7443358446202220544.jpg","link":"has"},"urn:li:share:7443359035753541633":{"th":"MEASURE","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: DevAI Observability","label":"DevAI Observability","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7447590104576987136":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7447590104576987136.jpg","text":"Token costs for AI-first development are real, growing, and wildly uneven across teams and workflows, so we dug into Jellyfish data to find out more.\n\nWe looked at 12,000 developers across 200 companies in Q1 and found that the 90th percentile user consumes about 380 million tokens a month \u2014 more than 7x the median. When you translate that into dollars and join it to actual PR output, the cost-per-merged-PR ranges from $0.28 in the lowest usage tier to nearly $90 in the highest.\n\nMore tokens = more output \u2013 but at a dramatically higher price point per unit. In this video I break down the numbers and what they mean for teams trying to get the biggest bang for their AI buck.\n\nHow is your org thinking about AI token costs?","hook":"Token costs for AI-first development are real, growing, and wildly uneven across teams and workflows, so we dug into Jellyfish data to find out more. We looked at 12,000...","link":"no"},"urn:li:share:7449881422913224704":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Andrew Lau \u00b7 Tokenmaxxing","label":"Andrew Lau, Tokenmaxxing","vid":false,"fmt":"share","author":"Andrew Lau","pv":"previews/share-7449881422913224704.jpg","text":"\u201cTokenmaxxing\u201d is having a moment \u2013 leaderboards, competitions, billions of tokens consumed.\n\nHonestly, I get it.\n\nRight now, every company is trying to unlock  AI impact, and tokenmaxxing and leaderboards focus on the activity to drive AI native patterns - encouraging experimentation, lowering the barrier to entry, and getting teams actually transforming and using the AI native workflows. That matters.\n\nBut its just the start and is it enough?\n\nWe also have to make sure we're tokenmaxxing to the right outcome. You can tokenmaxx all day long and still miss the outcomes you actually care about (and spend a lot along the way).\n\nThe  question isn\u2019t just: \u201cHow much AI are we using?\u201d alone, it\u2019s:\n\nWhat are we getting from it?\nAre we shipping faster?\nAre teams making better decisions?\nIs the business actually improving?\n\nTokenmaxxing can be a great starting point. It builds the muscle. It drives the direction. It gets people in the game.\n\nBut the companies that win won\u2019t stop there. They\u2019ll take that usage and turn it into outcomes.\n\nMore on \u201ctokenmaxxing\u201d via The Wall Street Journal's Isabelle Bousquette, along with insights from Blitzy\u2019s Brian Elliott.\n\nLink in comments.","hook":"\u201cTokenmaxxing\u201d is having a moment \u2013 leaderboards, competitions, billions of tokens consumed. Honestly, I get it.","link":"no"},"urn:li:share:7450201600385679361":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7450201600385679361.jpg","text":"There's been a lot of talk lately about \"tokenmaxxing\" \u2013 the idea that the right metric for AI transformation success is simply using as many tokens as possible. \n\nI get the appeal. It's a crude metric, but it can be useful in a crisis... kind of like checking someone's pulse tells you they're not dead. But just like your heart rate, you want to be thoughtful about when and how you try to max it out. \n\nIn my last video I shared some Jellyfish data on token costs and PR output. Here's a chart that tells the broader story: pull request throughput and tokens per PR by token usage decile across ~7,500 engineers in Q1.\n\nThe PR throughput curve (purple) is encouraging: it climbs steadily from 0.77 PRs/week at the lowest token usage decile to 2.15 at the highest. More tokens = more output.\n\nBut look at the token cost curve (orange). Tokens per PR goes up EXPONENTIALLY. The median developer uses about 7M tokens per PR, versus 69M (!!) at the top decile. That's roughly 10x more tokens for about 2x the throughput. \n\nTokens are like rocket fuel, and just like a rocket, going faster requires exponentially more of it.\n\nThe practical implication is that when it comes to tokenmaxxing, there's a sweet spot. You'll get way more bang for your buck by getting everyone in your org into the middle of the adoption curve (D4 through D6) than by pushing a small group into the stratosphere. Broad, moderate adoption beats narrow, extreme usage.\n\nWhat about the promise of massive productivity gains from fleets of autonomous agents? Those can absolutely be unlocked, but they require serious investments in agent infrastructure, sandboxed environments, and context engineering, and most companies in 2026 are still in the early stages of addressing these challenges. \n\nUntil those are overcome, there's still an \"agentic barrier\" \u2013 a speed of light you can't get past, no matter how many tokens you burn.","hook":"There's been a lot of talk lately about \"tokenmaxxing\" \u2013 the idea that the right metric for AI transformation success is simply using as many tokens as possible. I get the...","link":"no"},"urn:li:ugcPost:7451038761100087296":{"th":"MEASURE","typ":"document","ftyp":"document","desc":"","label":"2025 7 AI KPIs v1 - AI impact question hook (gated)","vid":false,"fmt":"document","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7451038891542761472":{"th":"MEASURE","typ":"document","ftyp":"document","desc":"","label":"2025 7 AI KPIs v4 - ROI focus (gated)","vid":false,"fmt":"document","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7452465564339404800":{"th":"DX","typ":"company","ftyp":"video","desc":"Q2 2026 - Data Hub Video - v2 - \"drowning in dashboards\" hook (awareness)","label":"Data Hub Video - v2 - \"drowning in dashboards\" hook (awareness)","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7452465007302356993":{"th":"DX","typ":"company","ftyp":"video","desc":"Q2 2026 - Data Hub Video - v2 - \"drowning in dashboards\" hook (remarketing)","label":"Data Hub Video - v2 - \"drowning in dashboards\" hook (remarketing)","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7452465007302356993.jpg","link":"has"},"urn:li:ugcPost:7454546571595157504":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7454546571595157504.jpg","text":"Developers who invest in teaching their AI coding agents are shipping meaningfully more code.\n\nWe looked at Jellyfish data from 135,000 developers, and found that developers who created 6 or more custom context and skill files (e.g. Cursor rules, CLAUDE.md, Claude skills) are generating an additional 2.3 PRs per week (holding all other factors constant).\n                                                                                             \nIn this video, I break down where your agent's intelligence actually comes from, how fast these files are being adopted, and what investing in context and skills means for developer productivity.\n                                                                                        \nHow are you investing in customizing your AI coding tools?","hook":"Developers who invest in teaching their AI coding agents are shipping meaningfully more code. We looked at Jellyfish data from 135,000 developers, and found that developers who...","link":"no"},"urn:li:share:7455320606197223424":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7455320606197223424.jpg","text":"New data just dropped on our Jellyfish AI Engineering Trends page! \n\nA few highlights from this month's set:\n\nAUTONOMOUS AGENT ACTIVITY\n\nThe exponential growth of autonomous agent adoption continues: the 90th percentile of companies is now at 21% autonomous PRs, up from 14% at the end of February (and 3% a year ago). \n\nThe median company, however, is at 2.6%. The leaders aren't just adopting agents \u2013\u00a0they're pulling further away from the pack each month.\n\nTOKEN CONSUMPTION\n\nWe added a new metric tracking weekly tokens per Claude Code user, and it mirrors the autonomous agent story: power usage is growing rapidly and dominating consumption. The 90th percentile user is burning 225M tokens per week, about 3x what they were using 6 months ago, and about 7x the median.\n\nThis connects directly to the whole \"tokenmaxxing\" conversation. Token spend is racing ahead of output, with the top cohort spending 10x more tokens than the median (to achieve about 2x the throughput). \n\nTHROUGHPUT GAINS\n\nIn terms of impact, the productivity story remains consistent. Companies in our highest adoption tier are running at +77% pull request throughput this month vs. low adopters, with the next tier at +46%. In the neighborhood of 2x at the top continues to be typical, and we're still seeing meaningful gains even at moderate adoption levels.\n\nSome things to watch over the next month: (1) as token consumption keeps climbing, do throughput gains keep pace or does cost start running away from ROI, and (2) how do the newest model releases (Opus 4.7, GPT-5.5) fare in the wild in terms of actual token economics?\n\nCheck out the full set of benchmarks for more exciting insights!","hook":"New data just dropped on our Jellyfish AI Engineering Trends page! A few highlights from this month's set:","link":"no"},"urn:li:ugcPost:7457580374198579200":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 SEMR | v3 - peer comparison","vid":false,"fmt":"document","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7457580453315670016":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 SEMR | v4 - stats refresh","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7457580453315670016.jpg","link":"has"},"urn:li:ugcPost:7457579960744960000":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 SEMR | v1 - stats highlight","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7457580453315670016.jpg","link":"has"},"urn:li:ugcPost:7457580153146167296":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 SEMR | v2 - just released","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7457580453315670016.jpg","link":"has"},"urn:li:share:7458153361448562688":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Arcolano \u00b7 10x tokens","label":"Arcolano, 10x tokens","vid":false,"fmt":"share","author":"Arcolano","pv":null,"text":"Had another great conversation this week with Alistair Barr at Business Insider, this time about the tokenmaxxing phenomenon and what Jellyfish data has to say about the limits of raw AI consumption.\n\nhttps://lnkd.in/eruX9rHH \n\nTop Claude Code users are consuming about 10x the tokens of the median developer, but only producing about 2x the output. Tokens are like rocket fuel: incredibly powerful, but you need increasing amounts to go incrementally faster.\n\nThere's a broader shift happening across the industry right now. We're moving past \"adopt AI at any cost\" to \"adopt AI, but show the receipts.\" Companies are willing to spend here, but increasingly need to show they're spending responsibly and having an impact.\n\nEvery engineering leader knows that the real job isn't just proving what's possible \u2013\u00a0it's building and scaling an entire machine. When it comes to AI usage, you'll get way more leverage by getting everyone into the middle of the adoption curve than by pushing a small group into the stratosphere.","hook":"Had another great conversation this week with Alistair Barr at Business Insider, this time about the tokenmaxxing phenomenon and what Jellyfish data has to say about the limits...","link":"has"},"urn:li:ugcPost:7458132387231596544":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7459673787718881280":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7458237462042062848":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7458150774934679552":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7455272533945364480":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q2 2026: AI Engineering Trends (Mar)","label":"AI Engineering Trends (Mar)","vid":false,"fmt":"document","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7459607071353655296":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7458583085471760385":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"text":"Jellyfish just released its seventh annual State of Engineering Management report and it\u2019s clear that the conversation around AI in engineering is moving fast! Comparing to last year\u2019s results when AI tool adoption and experimentation were the themes, this year\u2019s study clearly shows strong maturation of the space.\n\nWith the more capable models that dropped at the end of 2025, and a year more of experience in the industry around effective workflows and practices, we clearly see a change. 64% of engineering leaders say AI has increased developer productivity by at least 25%, and teams with high AI adoption are reporting stronger efficiency and higher satisfaction across engineering orgs.\n\nAnd with this maturation, many organizations are taking measurement more seriously. After all, without careful measurement, how can you goal and track progress? But for many, measurement is still a work in progress. While 84% of respondents say engineering productivity is now a top management concern, less than half are actively measuring AI adoption and impact.\n\nPerhaps the most surprising result from the study was a very positive growth outlook, strongly correlated with AI adoption. 80% of respondents with high AI adoption report a positive growth outlook, while that number soars to 90+% for those with very high adoption. This is a very positive indicator at a time when the software industry is clearly seeing great change and uncertainty.\n\nExplore and download the full report here: https://lnkd.in/ei2jruB5 ","hook":"Jellyfish just released its seventh annual State of Engineering Management report and it\u2019s clear that the conversation around AI in engineering is moving fast! Comparing to...","link":"has"},"urn:li:ugcPost:7458501136682209281":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7457946228123717632":{"th":"OTHER","typ":"company","ftyp":"image","desc":"Q2 2026 - Gartner MQ v1","label":"Gartner MQ v1","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"id:1294517924":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad","vid":false,"fmt":"image","author":"","pv":null,"link":"has"},"id:1294718174":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad","vid":false,"fmt":"image","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7460367021730320385":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7460733606890754048":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7460686834768125952":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"id:1295418274":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad","vid":false,"fmt":"image","author":"","pv":null,"link":"has"},"id:1296607124":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad","vid":false,"fmt":"image","author":"","pv":null,"link":"has"},"id:1296794254":{"th":"OTHER","typ":"image","ftyp":"image","desc":"","label":"Unnamed ad" ftyp":"spotlight","desc":"Aircover - Spotlight - AI Impact - Maximize AI ROI (token)","label":"Maximize AI ROI with Jellyfish","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"urn:li:ugcPost:7467560320585207808":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7467560320585207808.jpg","text":"My conversation with Simon Maple on the AI Native Dev Podcast is out today!\n\nWe dug into all the exciting things my team and I at Jellyfish have been learning from our incredible data set: what AI productivity actually looks like in the wild, what's working (and what's not) as teams move toward more autonomous agentic coding workflows, and how engineering leaders are starting to make the ROI case for token spend to their orgs.\n\nTrailer here, full episode links in the comments!\n\nBig thanks to Simon and the AI Native Dev team for having me on \u2013 what a great conversation!","hook":"My conversation with Simon Maple on the AI Native Dev Podcast is out today! We dug into all the exciting things my team and I at Jellyfish have been learning from our...","link":"no"},"urn:li:ugcPost:7467945130273087488":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7467945130273087488.jpg","text":"In this recently released \u2728 GLOW episode, Avaya VP of Engineering Ruby Agarwal explains why successful enterprise AI depends on trust, governance, observability, and operational discipline \u2013 not just impressive demos.\n\nWatch the 15 minute episode here: https://jellyfish.co/glow\n\n#GLOW26 #AIFirst #AIEngineering","hook":"In this recently released \u2728 GLOW episode, Avaya VP of Engineering Ruby Agarwal explains why successful enterprise AI depends on trust, governance, observability, and...
