  const ranked=rows.filter(r=>r.cpl!==null).sort((a,b)=>b.cpl-a.cpl);
  const rest=rows.filter(r=>r.cpl===null).sort((a,b)=>b.spend-a.spend);
  const max=Math.max(...ranked.map(r=>r.cpl),0)||1;
  const row=r=>{
    const pct=r.cpl===null?0:Math.max(4,100*r.cpl/max);
    const val=r.cpl===null?`n/a · ${usd(r.spend)} spend · 0 LP clicks`:`${cpl(r.spend,r.lp)} · ${usd(r.spend)} spend · ${num(r.lp)} LP clicks`;
    const on=r.cpl!==null&&pct>42;
    return `<div class="bar-row" title="${esc(r.label)}: ${esc(val)}">
      <div class="bar-lab">${esc(r.label)}<div class="sub">${usd(r.spend)} spend · ${num(r.lp)} LP</div></div>
      <div class="bar-track"><div class="bar-fill${r.cpl===null?' na':''}" style="width:${pct}%"></div><span class="bar-val${on?' on':''}">${val}</span></div>
    </div>`;
  };
  return `<div class="sh"><h2>Cost per LP click by theme</h2><span class="sc">${esc(D.periods[P].label.toLowerCase())}</span></div>
    ${rows.length?`<div class="chart">${ranked.map(row).join('')}${rest.map(row).join('')}</div>`:'<div class="empty">No delivery in this filter.</div>'}
    <div class="note">Bar length is cost per LP click. Themes with spend but no landing page clicks show as n/a and sit at the bottom.</div>`;
}
function metricCells(r,W){
  const ch=r.link==='no'?{txt:'n/a'}:cplChg(r);
  const lpctrTxt=r.link==='no'?'n/a (no link)':pct2(r.lp,r.impr);
  return `<td class="n">${usd(r.spend)}</td>
      <td class="n">${num(r.impr)}</td>
      <td class="n">${num(r.clicks||0)}</td>
      <td class="n">${pct2(r.clicks||0,r.impr)}</td>
      <td class="n">${dwellf(r.dwell)}</td>
      <td class="n">${lpCell(r)}</td>
      <td class="n">${W?hl(W,r,'cpl',cplCell(r)):cplCell(r)}</td>
      <td class="n">${W?hl(W,r,'lpctr',lpctrTxt):lpctrTxt}</td>
      <td class="n">${ch.txt}</td>`;
}
function adRows(list,sorter,W){
  return list.slice().sort(sorter).map(r=>{
    return `<tr>
      <td>${pv(r.key,r.label,r.vid)}</td>
      <td class="aname" onclick="lbOpen('${esc(r.key)}')"><span class="vlab">${esc(r.label)}</span>${marks(r.cs)}${linkPill(r)}</td>
      ${metricCells(r,W)}
    </tr>`;
  }).join('');
}
function adsTable(ads){
  const T={spend:ads.reduce((s,r)=>s+r.spend,0),impr:ads.reduce((s,r)=>s+r.impr,0),lp:ads.reduce((s,r)=>s+r.lp,0),q:{spend:ads.reduce((s,r)=>s+(r.q?r.q.spend:0),0),lp:ads.reduce((s,r)=>s+(r.q?r.q.lp:0),0)}};
  const sorter=(a,b)=>cmpv(AV[SORT.c](a),AV[SORT.c](b))*SORT.d;
  let body='';
  if(GROUP==='none'){
    body=adRows(ads,sorter,rankSet(ads));
  }else{
    const bucket={};
    ads.forEach(r=>{
      let k=r.th, lab='Theme: '+((D.TH[r.th]||{}).n||r.th);
      if(GROUP==='type'){k=r.typ;lab='Ad type: '+(TYLAB[r.typ]||r.typ)}
      if(GROUP==='seg'){k=segsOf(r.cs);lab='Segment: '+(k==='both'?'Cold and warm':(k==='warm'?'Warm (Remarketing)':'Cold'))}
      (bucket[k]=bucket[k]||{k,lab,rows:[]}).rows.push(r);
    });
    const groups=Object.values(bucket).map(g=>{
      const spend=g.rows.reduce((s,r)=>s+r.spend,0), impr=g.rows.reduce((s,r)=>s+r.impr,0), lp=g.rows.reduce((s,r)=>s+r.lp,0);
      const clicks=g.rows.reduce((s,r)=>s+r.clicks,0);
      const qspend=g.rows.reduce((s,r)=>s+(r.q?r.q.spend:0),0), qlp=g.rows.reduce((s,r)=>s+(r.q?r.q.lp:0),0);
      const qclicks=g.rows.reduce((s,r)=>s+(r.q?r.q.clicks:0),0), qimpr=g.rows.reduce((s,r)=>s+(r.q?r.q.impr:0),0);
      return {...g,spend,impr,lp,clicks,dwell:wDwell(g.rows),q:{spend:qspend,lp:qlp,clicks:qclicks,impr:qimpr,dwell:wDwell(g.rows,1)}};
    });
    const TYPE_ORDER={image:0,tla:1,video:2,document:3,spotlight:4};
    const SEG_ORDER={cold:0,warm:1,both:2};
    if(GROUP==='type') groups.sort((a,b)=>(TYPE_ORDER[a.k]??9)-(TYPE_ORDER[b.k]??9));
    else if(GROUP==='seg') groups.sort((a,b)=>(SEG_ORDER[a.k]??9)-(SEG_ORDER[b.k]??9));
    else groups.sort(sorter);
    body=groups.map(g=>{
      return `<tr class="grp"><td></td><td>${esc(g.lab)}<div class="vdesc">${g.rows.length} ${g.rows.length===1?'ad':'ads'}</div></td>
        ${metricCells(g)}</tr>`
        +adRows(g.rows,sorter,rankSet(g.rows));
    }).join('');
  }
  T.clicks=ads.reduce((s,r)=>s+r.clicks,0);
  T.dwell=wDwell(ads);
  T.q.clicks=ads.reduce((s,r)=>s+(r.q?r.q.clicks:0),0);
  T.q.impr=ads.reduce((s,r)=>s+(r.q?r.q.impr:0),0);
  T.q.dwell=wDwell(ads,1);
  const totCh=cplChg(T);
  const gbtns=GROUPS.map(([k,l])=>`<button class="${k===GROUP?'on':''}" onclick="setGroup('${k}')">${l}</button>`).join('');
  return `<div class="sh"><h2>Ads</h2><span class="sc">${esc(D.periods[P].label.toLowerCase())}</span>
    <div class="groupby"><span class="lab">Group by</span><div class="seg">${gbtns}</div></div></div>
    <div class="legend" style="margin:0 0 12px">
      <span>${ico('image')} Image</span><span>${ico('tla')} Thought Leader</span><span>${ico('video')} Video</span>
      <span>${ico('document')} Document</span><span>${ico('spotlight')} Spotlight</span>
      <span><span class="dot cold"></span> Cold</span><span><span class="dot warm"></span> Warm</span>
    </div>
    ${ads.length?`<div class="tw"><table><thead><tr><th>Preview</th><th class="s" onclick="srt('label')">Ad${SORT.c==='label'?(SORT.d>0?' &#9650;':' &#9660;'):''}</th>${sh('spend','Spend')}${sh('impr','Impr.')}${sh('clicks','Clicks')}${sh('ctr','CTR')}${sh('dwell','Dwell time')}${sh('lp','LP clicks')}${sh('cpl','Cost/LP')}${sh('lpctr','LP CTR')}${sh('chg','vs prior')}</tr></thead>
      <tbody>${body}<tr class="tot"><td></td><td>Total</td>${metricCells(T)}</tr></tbody></table></div>
      <div class="note">Click a column header to sort. Click a preview or ad name for the creative, ad sets, and prior-period detail. "vs prior" is the change in cost per LP click versus the previous equal-length window. Lower is better. Clicks and CTR use LinkedIn clicks (not landing page clicks). Dwell time is LinkedIn averageDwellTime, in seconds. Ads with no dwell in the window show n/a. Ads with no link in the post show n/a (no link) for LP clicks, cost per LP click, and LP CTR.</div>
      <div class="note"><span class="gv">Green</span> = the 3 best and <span class="bv">red</span> = the 3 worst Cost per LP click and LP CTR, ranked within each group when Group by is on, or across the filtered list when it is None. Cost per LP is lower-is-better; LP CTR is higher-is-better. Ads with no link, no landing page clicks, or Spotlight ads (unless only Spotlight is selected) are left out of the ranking. On short lists, red is only applied to rows that are not already green.</div>`:'<div class="empty">No delivery in this filter.</div>'}`;
}
function videoTable(ads){
  const vids=ads.filter(r=>r.vid);
  const T=vids.reduce((t,r)=>({spend:t.spend+r.spend,impr:t.impr+r.impr,views:t.views+r.views,v75:t.v75+r.v75,comp:t.comp+r.comp}),{spend:0,impr:0,views:0,v75:0,comp:0});
  const sorter=(a,b)=>cmpv(AV[VSORT.c](a),AV[VSORT.c](b))*VSORT.d;
  const rows=vids.slice().sort(sorter).map(r=>`<tr>
      <td>${pv(r.key,r.label,1)}</td>
      <td class="aname" onclick="lbOpen('${esc(r.key)}')"><span class="vlab">${esc(r.label)}</span>${marks(r.cs)}</td>
      <td class="n">${usd(r.spend)}</td><td class="n">${num(r.impr)}</td><td class="n">${num(r.views)}</td>
      <td class="n">${pct0(r.views,r.impr)}</td><td class="n">${cpv(r.spend,r.views)}</td>
      <td class="n">${num(r.v75)}</td><td class="n">${num(r.comp)}</td><td class="n">${pct0(r.comp,r.impr)}</td>
    </tr>`).join('');
  return `<div class="sh"><h2>Video</h2><span class="sc">${esc(D.periods[P].label.toLowerCase())}</span></div>
    <div class="note" style="margin:0 0 12px">Video runs in both cold and warm ad sets. Completions (97%) is LinkedIn videoCompletions: watches to 97-100% of the video. There is no separate 97% field. Completion rate = completions / impressions. View rate = views / impressions. CPV = spend / views.</div>
    ${vids.length?`<div class="tw"><table><thead><tr><th>Preview</th><th class="s" onclick="vsrt('label')">Ad${VSORT.c==='label'?(VSORT.d>0?' &#9650;':' &#9660;'):''}</th>${sh('spend','Spend','v')}${sh('impr','Impr.','v')}${sh('views','Views','v')}${sh('vrate','View rate','v')}${sh('cpv','CPV','v')}${sh('v75','Views at 75%','v')}${sh('comp','Completions (97%)','v')}${sh('crate','Completion rate','v')}</tr></thead>
      <tbody>${rows}<tr class="tot"><td></td><td>Total</td><td class="n">${usd(T.spend)}</td><td class="n">${num(T.impr)}</td><td class="n">${num(T.views)}</td><td class="n">${pct0(T.views,T.impr)}</td><td class="n">${cpv(T.spend,T.views)}</td><td class="n">${num(T.v75)}</td><td class="n">${num(T.comp)}</td><td class="n">${pct0(T.comp,T.impr)}</td></tr></tbody></table></div>`:'<div class="empty">No video delivery in this filter.</div>'}`;
}
function render(){
  normalize();
  const p=D.periods[P];
  const cs=scopeC();
  const ads=byKey(cs);
  window._ADS=ads;
  window._VIDS=ads.filter(r=>r.vid);
  const PLAB={l7:'Last 7 days',mtd:'Month to date',l30:'Last 30',l60:'Last 60',l90:'Last 90'};
  $('pills').innerHTML=ORDER.map(k=>`<button class="${k===P?'on':''}" onclick="setP('${k}')">${PLAB[k]}</button>`).join('');
  $('segs').innerHTML=[['All','All'],['cold','Cold'],['warm','Warm (Remarketing)']].map(([k,l])=>`<button class="${k===SEG?'on':''}" onclick="setG('${k}')">${l}</button>`).join('');
  const sets=adSets();
  const opts=['<option value="all">All ad sets</option>'].concat(sets.map(s=>{
    const prefix=SEG==='All'?(s.seg==='warm'?'Warm · ':'Cold · '):'';
    return `<option value="${esc(s.id)}"${s.id===CAMP?' selected':''}>${esc(prefix+s.name)} · ${usd(s.spend)}</option>`;
  }));
  $('camps').innerHTML=`<select class="camp-sel" id="camp" aria-label="Ad set" onchange="setCamp(this.value)">${opts.join('')}</select>`;
  const fmtBtn=(k,l)=>{
    const on=FORMAT===k;
    const ok=k==='all'||formatHas(k);
    return `<button class="${on?'on':''}${ok?'':' na'}" ${ok?'':'disabled'} onclick="setFormat('${k}')">${l}</button>`;
  };
  $('types').innerHTML=fmtBtn('all','All')+fmtBtn('image','Image')+fmtBtn('tla','Thought Leader')+fmtBtn('video','Video')+fmtBtn('document','Document')+fmtBtn('spotlight','Spotlight');
  const show=showLink();
  $('step-link').style.display=show?'':'none';
  if(show){
    $('links').innerHTML=[['all','All'],['has','Has link'],['no','No link']].map(([k,l])=>`<button class="${k===LINK?'on':''}" onclick="setLink('${k}')">${l}</button>`).join('');
  }else{
    $('links').innerHTML='';
  }
  $('active').textContent=activePath();
  $('range').textContent=`${sd(p.start)} to ${fmtD(p.end)} vs ${sd(p.prior.start)} to ${fmtD(p.prior.end)}`;
  $('summary').innerHTML=summary(cs);
  $('wl').innerHTML=wl(ads);
  $('chart').innerHTML=chart(ads);
  $('ads').innerHTML=adsTable(ads);
  $('video').innerHTML=videoTable(ads);
}
$('nlive').textContent=D.meta.live_camps;
$('thru').textContent=fmtD(D.meta.through);
$('asof').textContent=D.meta.asof;
$('foot').innerHTML=`
<li>LinkedIn Ads account 506678050 (Jellyfish). Creative-level analytics from the API, with campaign- and account-level totals used as a check. Live = the ad is Active in an Active ad set. Paused ads still count for the days they ran.</li>
<li>Timeframes: last 7 days, month to date, last 30 days, last 60 days, and last 90 days, each compared with the previous equal-length window (month to date uses the same days last month).</li>
<li>Cold vs warm: an ad set is warm if its name includes remarketing, retargeting, website retargeting, or customers, or if its include targeting uses LinkedIn dynamicSegments (website, lead form, company page, or engager retargeting). Everything else is cold, including ABM list and job-title prospecting. The Spotlight ad set is named "Remarketing and Cold" but includes those retargeting segments, so it is counted as warm. Spend on that ad set cannot be split between the two audiences.</li>
<li>Filters are cascading: first choose a segment (All, Cold, or Warm (remarketing)), then an ad set that had delivery in that segment and timeframe, then a single ad format. The has-link filter only appears when the format is All or Thought Leader. Every section follows these filters. Image = company single image or article ads, plus event ads. Thought Leader = member-authored posts, whether static or video. Video = company-produced videos only. Document = gated document ads. Spotlight = Spotlight (company profile) ads.</li>

<li>"vs prior" in the ads table is the change in cost per LP click versus the previous equal-length window. Lower is better. Cost/LP = spend / landing page clicks. LP CTR = LP clicks / impressions, shown to two decimals. Clicks is LinkedIn's clicks field (not landing page clicks). CTR = clicks / impressions, shown to two decimals. Dwell time is LinkedIn averageDwellTime, shown in seconds. When one row rolls up more than one creative, dwell is the impression-weighted average. Creatives with no dwell value in a window show n/a; that is not treated as zero.</li>
<li>Video views follow LinkedIn's definition (2 or more continuous seconds, at least 50% on screen). Views at 75% is videoThirdQuartileCompletions. Completions (97%) is videoCompletions, which LinkedIn defines as watches to 97-100% of the video. There is no separate 97% metric. Completion rate = completions / impressions. CPV uses cents because it is often under $1.</li>

render();
</script>
