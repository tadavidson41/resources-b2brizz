ue (dark)","label":"Proving value","vid":false,"fmt":"share","author":"","pv":"previews/share-7471316220974182400.jpg","link":"has"},"urn:li:share:7471316755710341120":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Tying tokens to outcomes (dark)","label":"Tying tokens to outcomes","vid":false,"fmt":"share","author":"","pv":"previews/share-7471316924816142336.jpg","link":"has"},"urn:li:share:7471316924816142336":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Tying tokens to outcomes, tokenmaxxing hook (dark)","label":"Tying tokens to outcomes, tokenmaxxing hook","vid":false,"fmt":"share","author":"","pv":"previews/share-7471316924816142336.jpg","link":"has"},"urn:li:share:7471314732466114560":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Rising spend","label":"Rising spend","vid":false,"fmt":"share","author":"","pv":"previews/share-7471314732466114560.jpg","link":"has"},"urn:li:share:7471314950498635777":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Rising spend (dark)","label":"Rising spend","vid":false,"fmt":"share","author":"","pv":"previews/share-7471314950498635777.jpg","link":"has"},"urn:li:share:7471315850143281152":{"th":"MEASURE","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Proving value","label":"Proving value","vid":false,"fmt":"share","author":"","pv":"previews/share-7471315850143281152.jpg","link":"has"},"urn:li:share:7471316543528886272":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Tying tokens to outcomes","label":"Tying tokens to outcomes","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7472372246557384704":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7472636960470351872":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7472313223787032576":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7472313223787032576.jpg","text":"Chris Evans, co-founder and Field CTO at incident.io explores what happens when AI dramatically accelerates software creation \u2014 and why that creates an entirely new reliability challenge. \n\nIn this 13-minute \u2728 GLOW episode, he unpacks:\n- why the balance between building and operating software is breaking down\n- why traditional approaches to incident management struggle in an AI-driven world\n- why reliability is quickly becoming a competitive advantage. \n\nWatch it now: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIFirst #AIEngineering","hook":"Chris Evans, co-founder and Field CTO at incident.io explores what happens when AI dramatically accelerates software creation \u2014 and why that creates an entirely new reliability...","link":"has"},"urn:li:ugcPost:7470900177474629632":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7470900177474629632.jpg","text":"\ud83e\udd14 Can AI ever be \u201ctrusted\u201d without humans in the loop, or is that a fantasy, especially for regulated industries?\n\nWe asked these industry leaders for their reactions:\n- Nazrul Islam (Founder & CEO at CloudAEye)\n- Sylvia Bargellini HCD, CX, UX (Founder at Lini LLC)\n- London Monty, MBA, PMP, CSM (CPO at Auriv.io)\n- Alice Z. (Founder at Sliq)\n- Phil Austin (Engineering Leadership Advisor at Jellyfish)\n\nWatch now and tune in for part 2 next week!\n\n#AIEngineering #SoftwareDevelopment","hook":"\ud83e\udd14 Can AI ever be \u201ctrusted\u201d without humans in the loop, or is that a fantasy, especially for regulated industries? We asked these industry leaders for their reactions:","link":"no"},"urn:li:share:7468681303735873536":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7472670643243859968":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7472670643243859968.jpg","text":"At Jellyfish, our focus is simple: be your partner through your agentic transformation. \ud83e\udd1d\n\nHead of Product Krishna Kannan shares how we accomplish this through a roadmap centered on four areas:\n\n1\ufe0f\u20e3 End-to-end visibility: See how work moves across AI-assisted software delivery, including usage, flow, and bottlenecks.\n\n2\ufe0f\u20e3 AI cost and efficiency: Connect token usage to actual engineering work, compare models, and understand where spend is creating value.\n\n3\ufe0f\u20e3 Broader builder coverage: Extend visibility beyond engineers to PM, design, and other technical teams using AI to build software.\n\n4\ufe0f\u20e3 Flexible access: Bring Jellyfish data into the environments where teams already work through headless and MCP-based experiences.\n\nLearn about existing key product components and ones coming soon: https://lnkd.in/ekKV8_ux","hook":"At Jellyfish, our focus is simple: be your partner through your agentic transformation. \ud83e\udd1d Head of Product Krishna Kannan shares how we accomplish this through a roadmap...","link":"has"},"urn:li:ugcPost:7474843248906297344":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7473363090747760640":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7475252920230359041":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7475206545044119554":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7475206545044119554.jpg","text":"LastPass CTO Jason Rasmussen leads an engineering organization of roughly 200 people. Structured to allow engineers to take ideas from inception all the way to the customer, LastPass requires deep visibility into what it actually takes to ship software on time...and Jason needed to replace the \"divining rod\" with data.\n\nNow, LastPass leverages Jellyfish to:\n- manage unplanned work\n- benchmark their progress\n- measure the impact of their AI transformation\n- ship 40% faster\n\nHere's the story of how Jason and his team turned AI hype into hard data: https://lnkd.in/edrWecty\n\n#CaseStudy #CustomerStory #AIROI","hook":"LastPass CTO Jason Rasmussen leads an engineering organization of roughly 200 people. Structured to allow engineers to take ideas from inception all the way to the customer,...","link":"has"},"urn:li:ugcPost:7475585933560614912":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7475585933560614912.jpg","text":"OpenHands CEO Robert Brennan considers that \"...there's a really interesting open question here about what is the end state here? How much can we automate as these models get better and better, and as we get better and better at leveraging them?\"\n\nFind out more about Robert's forward-looking view of how AI stands to reshape the software development lifecycle, moving engineering teams from manual workflows toward highly automated, agent-driven development operations when you watch his \u2728 GLOW episode: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIFirst #AIEngineering","hook":"OpenHands CEO Robert Brennan considers that \"...there's a really interesting open question here about what is the end state here? How much can we automate as these models get...","link":"has"},"urn:li:ugcPost:7475258196681646081":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7476263001797517312":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7476263001797517312.jpg","text":"\"This is really nice because a developer doesn't need to context switch and actively think, 'Oh, I'm going to go and do this thing with this agent now.' The agent is just doing the work automatically the a way a co-worker would, right? They're just picking up tasks off of your plate before you even have to think about it. And so that just frees up a lot of context in the developer's brain. And you can imagine reacting to events coming out GitHub, GitLab, Bitbucket,...Incident.io, PagerDuty. There's all sorts of cool stuff you can do when you've got agents automatically reacting to what's going on inside your environment.\"\n\nWatch OpenHands CEO Robert Brennan's full comments here: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIFirst #AIEngineering","hook":"\"This is really nice because a developer doesn't need to context switch and actively think, 'Oh, I'm going to go and do this thing with this agent now.' The agent is just doing...","link":"has"},"urn:li:ugcPost:7477375346707922945":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7477731509261500416":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7477833011804286977":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q2 2026 - AI Impact - Lastpass testimonial/case study (Blue) - short quote","label":"AI Impact - Lastpass testimonial/case study - short quote","vid":false,"fmt":"share","author":"","pv":"previews/share-7477833011804286977.jpg","link":"has"},"urn:li:share:7477856546144677888":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q2 2026 - AI Impact - Lastpass testimonial/case study (Blue) - long quote","label":"AI Impact - Lastpass testimonial/case study - long quote","vid":false,"fmt":"share","author":"","pv":"previews/share-7477833657932652545.jpg","link":"has"},"urn:li:share:7477833657932652545":{"th":"PROOF","typ":"company","ftyp":"image","desc":"Q2 2026 - AI Impact - Lastpass testimonial/case study (Blue) - long quote","label":"AI Impact - Lastpass testimonial/case study - long quote","vid":false,"fmt":"share","author":"","pv":"previews/share-7477833657932652545.jpg","link":"has"},"urn:li:share:7363204157618458624":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Adam Ferrari \u00b7 measure productivity","label":"Adam Ferrari, measure productivity","vid":false,"fmt":"share","author":"Adam Ferrari","pv":"previews/share-7363204157618458624.jpg","text":"\u201cI want to improve my ability to measure engineering productivity, but my data is a mess!\u201d Sound familiar?\n\nIf you\u2019re in this situation, you\u2019re not alone. The processes for managing and tracking work in most engineering teams are far from perfect, which can make calculating metrics difficult or even impossible.\n\nAs we re-imagine the SDLC with AI, tracking the impacts on productivity with metrics has never been more important.\n\nBut the situation is not hopeless! You can achieve what I call \u201corganizational observability\u201d with a set of practical and approachable steps.\n\nLink to my full writeup on the idea of organizational observability in the comments.","hook":"\u201cI want to improve my ability to measure engineering productivity, but my data is a mess!\u201d Sound familiar? If you\u2019re in this situation, you\u2019re not alone. The processes for...","link":"no"},"urn:li:ugcPost:7480268687606808576":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7480268687606808576.jpg","text":"Google Cloud DORA Lead Nathen Harvey shares how \"when you improve the agentic experience, you're probably also improving the developer experience...making sure that the policies that you have to follow are accessible to those agents through the platform also makes them accessible to other developers...You see, with AI, anyone can be a builder. Now let's take those applications and ship them to production. Why not? Oh, wait, why not? There's probably lots of reasons why not.\"\n\nLearn how Nathen is thinking about platform engineering and building with AI in this \u2728 GLOW episode: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIFirst #AIEngineering","hook":"Google Cloud DORA Lead Nathen Harvey shares how \"when you improve the agentic experience, you're probably also improving the developer experience...making sure that the...","link":"has"},"urn:li:ugcPost:7478088526576726016":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7478088526576726016.jpg","text":"\"What\u2019s the uncomfortable truth about AI budgets that engineering leaders don\u2019t want to say out loud?\" \ud83e\udd2b\n\nFind out the hot takes from:\n- Carlos Fernandez Musoles (CEO at Kalavai)\n- London Monty, MBA, PMP, CSM (CPO at @Aurivio)\n- Swanand Rao (CEO at Next Moca)\n- Sandhya Subramani (Sr. Developer Advocate, GenAI at Amazon Web Services (AWS))\n- Ekechi Nwokah (CEO at Infino AI)\n- Alice Z. (Founder at Sliq)\n- Nazrul Islam (Founder & CEO at CloudAEye)\n- Sylvia Bargellini HCD, CX, UX (Founder at Lini LLC)\n\nThen benchmark against your peers when you explore the 2026 State of Engineering Management Report: https://lnkd.in/gYAFBtmP\n\n#HotTakes #AIEngineering #SEMR #StateOfEngineeringManagement","hook":"\"What\u2019s the uncomfortable truth about AI budgets that engineering leaders don\u2019t want to say out loud?\" \ud83e\udd2b Find out the hot takes from:","link":"has"},"urn:li:ugcPost:7480626457338269696":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7480992456478535680":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":null,"link":"has"},"urn:li:share:7481021603900702720":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7425647636445048832":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7485105507754569728":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 State of AI | v1 - research-led","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7485105883023224832.jpg","link":"has"},"urn:li:ugcPost:7485105883023224832":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 State of AI | v3 - cost/return","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7485105883023224832.jpg","link":"has"},"urn:li:ugcPost:7485105790505189376":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"","label":"2026 State of AI | v2 - peer comparison","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7485105883023224832.jpg","link":"has"},"urn:li:share:7485401005229006848":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Andrew Lau \u00b7 Tariq / SFO","label":"Andrew Lau, Tariq / SFO","vid":false,"fmt":"share","author":"Andrew Lau","pv":"previews/share-7485401005229006848.jpg","text":"When Tariq S. and I ran into each other at SFO, we realized we were seeing the same shift from two different angles.\n\nAI coding is working.  The harder problem now is everything that comes after code generation\u00a0\u2013\u00a0verification, software quality, security, and engineering accountability.   \n\nAs CEO of Sonar, Tariq has one of the best vantage points in the industry. Sonar analyzes more than 750 billion lines of code every day across 25,000 organizations, giving him a front-row seat to how AI is changing software development.\n\nOne of the biggest takeaways for me was this:  the challenge is clearly no longer whether AI can write software \u2013\u00a0it's whether teams can adapt fast enough to  keep up.\n\nThe teams that are getting it right are surrounding it with the right guardrails:\n\n\u2013\u00a0Better context for agents.\n\u2013\u00a0Verification built into the development workflow.\n\u2013\u00a0Healthier codebases that improve both software quality and future AI performance.\n\nWe're also asking the wrong questions as an industry. We've spent the past year focused on adoption and token consumption. Those are useful inputs, but they're not the outcome.\n\nThe outcome is holistic engineering productivity \u2013\u00a0shipping more value while improving quality, security, and confidence along the way.\n\nWatch the full conversation, link in comments.","hook":"When Tariq S. and I ran into each other at SFO, we realized we were seeing the same shift from two different angles. AI coding is working.  The harder problem now is everything...","link":"no"},"urn:li:share:7491240491531915264":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7491240491531915264.jpg","text":"Agent Skills support is standard in coding agents. But using Skills isn't standard practice \u2014 42% of developers have never invoked one. They're powerful, though: routine use is worth 27% more merged PRs.\n\nWe looked at 786,000 Cursor developer-weeks across roughly 340 companies from the Jellyfish platform, comparing each engineer's agentic-coding weeks with Skills against their own weeks without, controlling for their AI activity.\n\nDABBLING DOESN'T DELIVER\n\nFewer than 10 invocations in a week produced no measurable change in merged PRs, and that's the ceiling for a third of developers. Add the 42% who never invoke one, and three in four devs have never had a week where Skills moved PR throughput. That's a massive capability overhang.\n\nRETURNS REQUIRE REPS\n\nBetween 10 and 30 invocations a week is worth about 1.1 (8%) more merged PRs per developer per month \u2014 real but modest, and 13% of developers peak here.\n\nAt 30+ weekly Skill invocations, the impact more than triples to 3.5 more merged PRs per developer per month. A 27% improvement over baseline, the equivalent of an extra 3 months worth of PRs a year. Unfortunately only 1 in 8 developers ever reach this level, and just a third of them (1 in 24 of all devs) hold that rate for a month or more.\n\nIn the high-impact range (30+ uses per week), Skills aren't something you remember to try. They're intentionally woven through the work: some invoked deliberately, some picked up by the agent automatically as designed, some cascading out of other Skills. Getting there means building up a set of Skills worth reaching for and adapting your workflows so they actually get used.\n\nAre your agents using Skills regularly? Help your peers, drop a comment with ones you're routinely leveraging \ud83d\udc47","hook":"Agent Skills support is standard in coding agents. But using Skills isn't standard practice \u2014 42% of developers have never invoked one. They're powerful, though: routine use is...","link":"no"},"urn:li:share:7487521620287307776":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:ugcPost:7486108267908116480":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7486108267908116480.jpg","text":"What's one AI-era engineering belief you think most leaders have completely wrong? \ud83e\udd14\n\nWe asked these folks and got their hot takes:\n- Garrett Moedl (Head of Product Marketing at Adopt AI)\n- Latha Rao (Director of Product Management at Intel)\n- St\u00e9phan D. (CEO at AODocs)\n- Prathusha Prakash (Engineering Manager at TikTok)\n- Aaron Sua (Sr Director of Platform Engineering at American Red Cross)\n\n#AIEngineering #HotTakes","hook":"What's one AI-era engineering belief you think most leaders have completely wrong? \ud83e\udd14 We asked these folks and got their hot takes:","link":"no"},"urn:li:share:7488235754414845954":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7488235754414845954.jpg","text":"AI engineering in 2026 is all about two things: autonomy and trust.\n\nI've been talking for a while about the \"agentic barrier\": the wall I observe orgs running into as they struggle to unlock these two things in their agentic workflows. The newest monthly cut of Jellyfish AI Engineering Trends is out, and the agentic barrier continues to separate companies that are accelerating from those that lag.\n\nAmong many other fascinating insights, we see continuing exponential growth of code shipped with autonomous agentic workflows. The p90 orgs are almost at 50% of their PRs, while the median org is at 16%.\n\nIf you've got big rocks standing between you and greater coding agent autonomy, get out there and move them!\n\nMore details here:\nhttps://lnkd.in/eQbh8Ss5","hook":"AI engineering in 2026 is all about two things: autonomy and trust. I've been talking for a while about the \"agentic barrier\": the wall I observe orgs running into as they...","link":"has"},"urn:li:share:7486116202398920704":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7486116202398920704.jpg","text":"A few weeks ago I wrote about the \"token curve\" from my AI Engineer World's Fair talk. I wanted to share an updated version of the chart, now with over 1 million developer-weeks of data from the Jellyfish platform.\n\nTokenmaxxing may have come and gone, but one thing that persists is that token spend is a reasonable proxy metric for how teams actually work. It's actually quite difficult to burn 100M+ tokens a week just doing fancy autocomplete in your IDE. \n\nHigh levels of token consumption are only reachable with autonomous agents (and at the top end, by orchestrating many of them in parallel). Different spend levels aren't just bigger numbers; they represent categorically different ways of working.\n\nIn that light, the token curve tells a clear story of the two headwinds every engineering org is fighting right now:\n\nTHE AGENTIC BARRIER\n\nRoughly 70% of the developer-weeks we track sit below the barrier, stuck in interactive \"botsitting\" workflows. Why are they stuck? Because human attention doesn't scale, and real autonomy takes serious investment in infrastructure, permissions, and trust. Without scalable autonomy, 80% of the time developers are effectively limited to 1\u20132 agents. \n\nDIMINISHING RETURNS\n\nIf you break past the barrier, then gravity kicks in. We find that the top 10% of token spenders burn roughly 10x the tokens of the median developer to ship about 2x the output. The diminishing returns come from many directions: more optionality and parallelism, higher review and integration costs, and simply more unshipped work. (We find that agent-authored PRs die unmerged at 2x the rate of human ones.)\n\nThe good news? The token curve isn't some immutable law of physics. Rather, it's a snapshot of an industry where nobody fully knows how to do this yet, and that means individual orgs can sometimes beat the odds, and eventually the entire curve can be bent.\n\nMuch more detail in my full AI Engineer talk \u2013\u00a0I'll share the recording here as soon as it's online!","hook":"A few weeks ago I wrote about the \"token curve\" from my AI Engineer World's Fair talk. I wanted to share an updated version of the chart, now with over 1 million...","link":"no"},"urn:li:ugcPost:7488304471584800770":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7488304471584800770.jpg","text":"\"I don't think it's just the Silicon Valley startups. We see some very large companies that are trying to move faster and more aggressively on this front. But even inside of those companies, there's the early adopters and then there's the others.\n\nAnd it really does get down to, yes, you have to have a couple of engineers who are really leaning into this, all of that. There's a little bit of a structure question of, you know, big teams move slower in agentic coding than smaller teams do things like this. So I do think there's some things here that are real.\"\n\nHear Sonar CEO Tariq Shaukat's full take on AI code quality, verification, technical debt, software maintainability, token consumption, and the future of engineering leadership in this \u2728 GLOW episode: https://lnkd.in/eCAHe9ve\n\n#GLOW26 #AIFirst #AIEngineering #AIEra","hook":"\"I don't think it's just the Silicon Valley startups. We see some very large companies that are trying to move faster and more aggressively on this front. But even inside of...","link":"has"},"urn:li:share:7488228689328050176":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7488228689328050176.jpg","text":"\ud83d\uddd3\ufe0f Don't miss this live research briefing...and your chance to ask lead researchers Tomas Pardi\u00f1as and Ben Kotrc questions on:\n\n- Why AI spending is growing faster than expected (and what to do about it)\n\n- How context, workflows, and codebase design outperform simply buying more AI\n\n- What engineering leaders should prioritize during the second half of 2026\n\nRegister for this August 5 briefing here: https://lnkd.in/e8FiEDut\n\n#StateOfAI #ResearchBriefing #AIResearch","hook":"\ud83d\uddd3\ufe0f Don't miss this live research briefing...and your chance to ask lead researchers Tomas Pardi\u00f1as and Ben Kotrc questions on: - Why AI spending is growing faster than expected...","link":"has"},"urn:li:share:7488584648516845568":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7488584648516845568.jpg","text":"AI-authored code is now the majority at nearly a third of companies.\n\n\ud83d\udcc8 Data from the July AI Engineering Trends Report shows that:\n- 31.5% of companies have >50% of code AI-generated (up from 30.7%)\n- the P90 company is at 74% AI-authored code\n\nDive into the report and benchmark your R&D org against the data here: https://lnkd.in/gFAyfhw2\n\n#AIEngineeringTrends #AIResearch #AIEngineering","hook":"AI-authored code is now the majority at nearly a third of companies. \ud83d\udcc8 Data from the July AI Engineering Trends Report shows that:","link":"has"},"urn:li:share:7490062750354743296":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"urn:li:share:7475182246539345922":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7475182246539345922.jpg","text":"\ud83d\udcda The story of H1 '26? Exploding spend and diverging returns.\n\nThis newly released State of AI report from Jellyfish Research tells that story, highlighting a major shift in how AI is used in software development:\n\n1\ufe0f\u20e3 The cost shock. Spend has gone from a rounding error to a real constraint, rising 16x across the board with a tail that now rivals a junior engineer\u2019s salary.\n\n2\ufe0f\u20e3 The economics of tokens. What AI actually costs, why effective cost keeps rising even when sticker prices hold still, and where more tokens stop buying more output.\n\n3\ufe0f\u20e3 The harness advantage. What the best teams invest in instead of raw spend: context, harnesses, and agent-friendly codebases.\n\nExplore all the findings from the State of AI report here: https://lnkd.in/euq-wtNw\n\n#StateOfAI #JellyfishResearch","hook":"\ud83d\udcda The story of H1 '26? Exploding spend and diverging returns. This newly released State of AI report from Jellyfish Research tells that story, highlighting a major shift in how...","link":"has"},"urn:li:share:7490104468806713344":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7490104468806713344.jpg","text":"Autonomous agent activity gap keeps broadening.\n\n\ud83d\udcc8 Data from the July AI Engineering Trends Report shows that:\n\n- The median company now has 16% of PRs with agent involvement (up from 13%)\n\n- P90 companies are at 48% (up from 42%)\n\nDive into the report and benchmark your R&D org against the data here: https://lnkd.in/geGvmh7k\n\n#AIEngineeringTrends #AIResearch #AIEngineering","hook":"Autonomous agent activity gap keeps broadening. \ud83d\udcc8 Data from the July AI Engineering Trends Report shows that:","link":"has"},"urn:li:share:7485033996830162944":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7485033996830162944.jpg","text":"\ud83d\udd0e Get an exclusive look at new data from the first half of 2026 as Jellyfish Research explore why some engineering organizations are turning exploding AI spend into measurable business outcomes while others are simply burning through tokens.\n\nIn this live research briefing on August 5, Tomas Pardi\u00f1as (Sr Product Researcher) and Benjamin Kotrc (Research Director) explore:\n- Why AI spending is growing faster than expected (and what to do about it)\n- Understanding effective AI costs and token economics\n- How context, workflows, and codebase design outperform simply buying more AI\n- What engineering leaders should prioritize during the second half of 2026\n\nRegister today: https://lnkd.in/e8FiEDut\n\n#StateOfAI #AIEngineering #AITrends","hook":"\ud83d\udd0e Get an exclusive look at new data from the first half of 2026 as Jellyfish Research explore why some engineering organizations are turning exploding AI spend into measurable...","link":"has"},"urn:li:ugcPost:7490548582538838017":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q3 2026: AI Engineering Trends (Jul) v1","label":"AI Engineering Trends (Jul) v1","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7490548582538838017.jpg","link":"has"},"urn:li:ugcPost:7490551553641299968":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q3 2026: AI Engineering Trends (Jul) v2","label":"AI Engineering Trends (Jul) v2","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7490548582538838017.jpg","link":"has"},"urn:li:share:7320483632794529792":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"text":"Hey engineering leaders - wanna impress your peers and leaders? Get strategic about what areas you and your teams are investing in and improving to meet the current moment? Lots of ideas here, built for a variety of team and company stages and needs: https://lnkd.in/eNFKD9_y ","hook":"Hey engineering leaders - wanna impress your peers and leaders? Get strategic about what areas you and your teams are investing in and improving to meet the current moment?...","link":"has"},"urn:li:ugcPost:7493667946695778307":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7493667946695778307.jpg","text":"This week, Thomas Squeo (CTO Americas at Thoughtworks) shares that \"when we think about kind of the move from subscription-based pricing to token-based pricing, that kind of changed the mechanics of how organizations, especially as they kind of came due with their new renewals. Everybody, many companies did a one-year contract, and then what happened was when that contract came up for renewal, all of a sudden it was like, 'Hey, you know, we're going to budget. We're going to budget based on some arbitrary number or essentially set of value.' I think what we're seeing with a lot of conversations that are happening out there is it's not so much a question of, 'Is AI useful?'\n\nBecause as a stochastic tooling mechanism to be able to drive outcome, code is an ideal candidate for any kind of constitutional AI. That's one of the reasons why Anthropic is so successful, OpenAI, Gemini. This is an area that is kind of purpose-built for being able to understand that. And when you start to see kind of that measure, I think the experiment, whatever hypothesis is being driven, as soon as it's starting to demonstrate, you're starting to now kind of give the ability to kind of filter to what model you would like to be able to see it work on.\n\nIf you think about what the teams at Anthropic are doing is that they have a spectrum of models for being able to solve problems. You start to look at the cost curve associated with it. Older models have a lower cost curve versus like Fable and Methos and things like that. And you start to see kind of like that stratification ends up something that if an organization does single source on a vendor, they could still execute a multi-model strategy based on what's happening.\"\n\nCatch all of his insights in his \u2728 GLOW episode here: https://lnkd.in/eCAHe9ve\n\n#GLOW26 #AIEngineering","hook":"This week, Thomas Squeo (CTO Americas at Thoughtworks) shares that \"when we think about kind of the move from subscription-based pricing to token-based pricing, that kind of...","link":"has"},"urn:li:ugcPost:7490406446489112576":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7490406446489112576.jpg","text":"\"First of all, tools don't fix broken systems. So treating a tool rollout doesn't change behaviors. So a lot of organizations will kind of buy seats or licenses and declare victory. So, hey, we went out and we bought Claude or Cursor or ChatGPT, whatever the case may be. And all of our folks are AI enabled. That's just not the case.\n\nAnd that hasn't been the case since DevOps came about when people went and bought Jenkins or GitLab or GitHub. It's not the case with cloud when people move to AWS or Azure or GCP. And it's not the case now. So it takes us as humans a while to learn those sorts of things, but that's mistake number one.\"\n\nFind out what David Collins (VP Client Solutions at Liatrio) sees as mistake number two is in AI rollouts and how to fix it in this \u2728 GLOW episode: https://lnkd.in/eCAHe9ve\n\n#GLOW26 #AIFirst #AIEngineering","hook":"\"First of all, tools don't fix broken systems. So treating a tool rollout doesn't change behaviors. So a lot of organizations will kind of buy seats or licenses and declare...","link":"has"},"urn:li:ugcPost:7493329206878269440":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7493329206878269440.jpg","text":"\"There is diminishing returns...the curve is leveling off. And the top 10% of token spenders are spending 10 times as many tokens as the median, but they're only getting two times the output of the median...so why might that be?\"\n\nBenjamin Kotrc (Research Director at Jellyfish) unpacks these findings from the State of AI report and more with Tomas Pardi\u00f1as (Sr. Product Researcher, AI at Jellyfish). Watch the full video here: https://lnkd.in/ej3G5ssY\n\n#StateofAI #AIEngineering #TokenSpend","hook":"\"There is diminishing returns...the curve is leveling off. And the top 10% of token spenders are spending 10 times as many tokens as the median, but they're only getting two...","link":"has"},"urn:li:ugcPost:7493300529507405824":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7493300529507405824.jpg","text":"How do you get a leadership team to actually articulate the problem instead of just \"go faster\"? \ud83e\udd14\n\nDavid Collins (VP Client Solutions at Liatrio) shares that his \"biggest recommendation would be to force specificity. So...faster at what? Better at what? More efficient at what? And measured how?\n\nSo start from the business outcome, work backward to the engineering metric instead of just jumping to 'hey, we had a SEV-1 issue' or 'we had something that a feature flag could have solved for, let's go get a new contract with a tool to go solve for that.' Let's actually do a root cause analysis of what that is and how that plays into our entire system, and how we deploy, and how we get PRDs put in all the way through the PDLC again. And then work backward to the actual thing we should be solving for.\"\n\nGet the rest of Dave's answer when you watch his GLOW episode: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIEngineering","hook":"How do you get a leadership team to actually articulate the problem instead of just \"go faster\"? \ud83e\udd14 David Collins (VP Client Solutions at Liatrio) shares that his \"biggest...","link":"has"},"urn:li:ugcPost:7490791240389701632":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7490791240389701632.jpg","text":"\"Today, I have one customer who told me they have over 2 million issues in their backlog. And the problem historically has been 'you can't get to it.' So you do exactly what you were talking about earlier. Like you triage and you say 'these are the critical ones. Let's do this and we're going to live with a whole bunch of stuff.' And you don't need to do that anymore.\n\nAgents can actually, particularly if they're well informed with context and they're focused in the right way, they can actually help you burn through your backlog quickly. So that's in our mind, 'guide, verify, and solve.' And that makes the whole agentic performance...I'm making up 10X...but 10X better, right? As a figure of speech, like massively better, higher pass rates, lower token consumption, and lower risk.\"\n\nGet more insights from Sonar CEO Tariq Shaukat in this \u2728 GLOW episode: https://lnkd.in/eCAHe9ve\n\n#GLOW26 #AIFirst #AIEra","hook":"\"Today, I have one customer who told me they have over 2 million issues in their backlog. And the problem historically has been 'you can't get to it.' So you do exactly what...","link":"has"},"urn:li:ugcPost:7490041292555640832":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7490041292555640832.jpg","text":"Last week, Jellyfish CEO Andrew Lau sat down with Matt Crane and Will Lehmann on their podcast, Code & Cobblestones. They talked about what Jellyfish data actually shows about how hundreds of engineering teams are using AI right now, and why the hard part was never the models\n\nA few things they covered:\n- Why cost, not capability, is the ceiling on AI coding right now\n- Why every engineer is becoming a manager of agents\n- Why the robots are commodity and the software is the moat\n- What building in Boston does better, and where it still trails SF\n- Why \"robots trolling Reddit\" is not customer development\n\nWatch the full C&C episode here: https://lnkd.in/eE6FicDW","hook":"Last week, Jellyfish CEO Andrew Lau sat down with Matt Crane and Will Lehmann on their podcast, Code & Cobblestones. They talked about what Jellyfish data actually shows about...","link":"has"},"urn:li:ugcPost:7495473039409848320":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7495473039409848320.jpg","text":"Jellyfish Head of Product Krishna Kannan explains how \"...this AI transformation moment we're in is really unlike anything we've seen in decades. And that unlike the Agile or Cloud or DevOps movements, this one is really a company strategy transition. And that companies are betting their futures on an AI transformation. And that just puts incredible pressure on engineering teams. And that's what's hard.\"\n\nWhat do the teams navigating this moment well have in common?\n\nWatch his full \u2728 GLOW episode to find out: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIEngineering","hook":"Jellyfish Head of Product Krishna Kannan explains how \"...this AI transformation moment we're in is really unlike anything we've seen in decades. And that unlike the Agile or...","link":"has"},"urn:li:ugcPost:7495843760187052032":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7495843760187052032.jpg","text":"Liatrio's VP of Client Solutions David Collins explains some of the misconceptions around AI ROI: \"Because you can't improve what you can't see, there's no baseline. There's no story. Organizations, enterprises, mid-market - it doesn't really matter the size of the company - aren't doing a lot of that rigor. That rigor doesn't exist.\n\nAnd that needs to start happening now because they're soon going to see - as we saw in the cloud kind of movement and maybe even more so here - large, large bills for token usage that are not equating to value. And they're going to - and I'm already seeing it in some of our clients right now - where it's saying, 'Hey, we're spending $30M a year on tokens, $50M a year on tokens, whatever the dollar amount. And what are we getting from it?' And it's because it was a race to enable and say, 'Hell yeah, we turned on these tools for our developers. Why aren't we getting the value out of it? We're spending a lot.' And also looking at AI as a cost saver.\n\nI don't look at it that way. I look at it as a way to improve your business that will ultimately help reduce costs in certain areas, but you'll end up spending a bunch of tokens too. So I think there's some misconceptions, but regardless of those misconceptions, measurement matters. And adoption claims without data are just everyone feeling good about themselves.\"\n\nWatch his full GLOW episode here: https://lnkd.in/ewaTRFXu\n\n#GLOW26 #AIEngineering #AIROI #AITokens","hook":"Liatrio's VP of Client Solutions David Collins explains some of the misconceptions around AI ROI: \"Because you can't improve what you can't see, there's no baseline. There's no...","link":"has"},"urn:li:ugcPost:7496201655328116736":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7496201655328116736.jpg","text":"Krishna Kannan (Jellyfish Head of Product) share how \"this might mean going from code assistants last year to agents now to planning a fully autonomous future. And so they're going into that future without really knowing what they're going to get or how they're going to measure it, but it's less bad than doing nothing.\"\n\nWatch his full \u2728 GLOW episode on why AI is the first engineering shift the whole company is betting on \u2013 and how to measure it here: https://lnkd.in/eCAHe9ve\n\n#GLOW26 #AIEngineering","hook":"Krishna Kannan (Jellyfish Head of Product) share how \"this might mean going from code assistants last year to agents now to planning a fully autonomous future. And so they're...","link":"has"},"urn:li:ugcPost:7498161532380422144":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q3 2026: AI Engineering Trends (Aug) v1","label":"AI Engineering Trends (Aug) v1","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7498161532380422144.jpg","link":"has"},"urn:li:share:7495529934560350208":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7495529934560350208.jpg","text":"As AI changes how software developers work, one ongoing debate is about how it affects developers at different points in their career progression. Does AI accelerate junior devs, supplementing knowledge gaps and \"leveling the playing field\"? Or maybe it's a bigger advantage to experienced developers, allowing folks with deep expertise to further multiply their impact?\n\nI've been continuing to dig into the \"token curve\" results I've been sharing lately concerning the relationship between token spend and productivity. One of the most interesting cuts is when you slice the data by developer seniority. \n\nBelow is a subset of the token curve data from Jellyfish, segmented by developers in junior roles versus those in senior/staff+ roles. \n\nMORE TOKENS DON'T HELP JUNIOR DEVS CATCH UP. In terms of merged pull requests, junior devs start off behind, and then the gap widens as spend increases, roughly tripling (from around +0.4 PRs/week to +1.3 PRs/week) when comparing the lowest levels of spend to the highest.\n\nEVERYONE FACES DIMINISHING RETURNS. The curve flattens out for both segments, and the headwinds start to kick in around the same place (100\u2013200M tokens/dev/week). Experience doesn't offer much to avoid the \"tyranny of the token curve\". The scaling challenges of agent orchestration can't be overcome by just having better individual engineering judgment.\n\nSeems like building better software factories is something we're all going to have to figure out together!","hook":"As AI changes how software developers work, one ongoing debate is about how it affects developers at different points in their career progression. Does AI accelerate junior...","link":"no"},"urn:li:share:7498096587034787840":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"text":"I\u2019m so proud to share that Jellyfish has once again been named a Leader in G2's Software Development Analytics Tools grid, marking our 17th consecutive quarter in a row. Jellyfish was also listed as a Top 50 Development Product for 2026.\n\nThis recognition isn\u2019t just about badges or reports, it\u2019s about the impact we\u2019re making for our customers.\n\nAccording to G2 reviews:\n98% gave Jellyfish a 4 or 5-star rating\n93% believe Jellyfish is moving in the right direction\n90% said they would recommend Jellyfish\n93% are satisfied with Jellyfish support\n\n\nThese numbers matter to us because they represent real customer outcomes: clearer visibility into engineering work, stronger alignment with business priorities, and more empowered teams.\n\nAs SVP of Customer Success, I get a front row seat to these stories every day. They\u2019re a reminder of why we do what we do and why our commitment to customer partnership and value delivery will never stop.\n\nTo all of our customers: thank you for your trust and feedback, and challenging us to always get better!\n\n\nLearn more here: https://lnkd.in/gXDjemUV","hook":"I\u2019m so proud to share that Jellyfish has once again been named a Leader in G2's Software Development Analytics Tools grid, marking our 17th consecutive quarter in a row....","link":"has"},"urn:li:share:7498144764790263808":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7498144764790263808.jpg","text":"My team and I just published our newest cut of Jellyfish AI Engineering Trends. There's so much new stuff, to be honest we may have gone a little overboard: model usage by harness, open weight models, AI-only code review, and per-developer AI spend. It's our biggest update since we started this monthly report back in January! \ud83d\udcaa\n\n(Also the data set has gotten huge \u2013 276K developers and almost 100M PRs!!)\n\nThe rapid growth of AI spend for software development has been particularly wild, we're now seeing around $200/week of spend for the top 10% of developers. \n\nThe sticker shock is causing increasing numbers of folks to explore open models as an alternative; we've seen 2x growth in open model usage over the last 6 weeks. \n\nNevertheless, open models are still only ~2% of usage, as they still present some real challenges vs. the alternatives in terms of infra, security concerns, and general quality of life. Switching over can be a tall order (and possibly a bit of a wild goose chase) given how fast models, harnesses, and the SDLC as a whole are evolving.\n\nCheck out the full report here!\nhttps://lnkd.in/eQbh8Ss5 ","hook":"My team and I just published our newest cut of Jellyfish AI Engineering Trends. There's so much new stuff, to be honest we may have gone a little overboard: model usage by...","link":"has"},"urn:li:ugcPost:7498162633112621056":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q3 2026: AI Engineering Trends (Aug) v2","label":"AI Engineering Trends (Aug) v2","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7498161532380422144.jpg","link":"has"},"urn:li:share:7498753677759868928":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7498753677759868928.jpg","text":"Wow, what a year 2026 is for open models! NVIDIA reportedly spending $13B for Hugging Face (a major hub of the open-weight AI ecosystem) is huge. Also you might have caught that story about AT&T cutting its AI coding costs by more than half by routing to open models. As the kids would say, \"frontier models are cooked\", right?\n\nWell, open models may be a big deal for production use cases, but AI coding tools and agents are a different story.\n\nEarlier this week I shared the newest cut of Jellyfish AI Engineering Trends data and insights. We've seen open model usage 2x over the past 6 weeks, but absolute share is still quite small: less than 2% of companies and less than 1% of developers.\n\nThat gap isn't folks being behind the curve; rather, it's the difference between optimizing stable workflows and products versus the cost of exploration and innovation. NVIDIA is betting on the stable side of that split, and it's where a company like AT&T (with well-defined workflows and the resources to optimize development at their scale) can bank real savings.\n\nDevelopment is a different world. The workflow itself is still a fast-moving target: model share within coding tools is swinging 10+ points in a single month, and harnesses are increasingly coupled to model behaviors, making arbitrary model swaps harder over time, not easier. For most orgs, pushing devs onto open models today is a premature optimization trap: you spend your scarcest resource (attention) optimizing a workflow that is changing wildly.\n\nSo, frontier models aren't \"cooked\" yet \u2013 worth watching the curve though! Explosive exponential growth can be sneaky, maybe this is just the beginning. ","hook":"Wow, what a year 2026 is for open models! NVIDIA reportedly spending $13B for Hugging Face (a major hub of the open-weight AI ecosystem) is huge. Also you might have caught...","link":"no"},"urn:li:share:7503847544519573504":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7503847544519573504.jpg","text":"Are you at an organization where adoption of AI tools has ramped up dramatically this year, and does it feel like all the necessary governance structures (e.g. platform support, process guidance, safety and security guardrails) are lagging?\n\nYou're not alone! This is pretty common in 2026, and I'm seeing it again and again in the data. Below is one example, from ~1,400 developers across 30 companies who all responded to the same standardized panel of AI questions in the Jellyfish DevEx platform.\n\nOverall, 88% of respondents agreed that \"AI coding tools have helped me with my work\", while only 62% agreed that \"we effectively manage the risks of AI-generated code\". That's a sizable gap, and it points the same direction for EVERY company in the sample. \n\nWe've all felt huge pressure to move fast with adoption, and (by developers' own account) that part has worked. Getting to a place where we feel good about all the other things needed to do reliable, high-quality software engineering... well, there's still a lot of work to do there.","hook":"Are you at an organization where adoption of AI tools has ramped up dramatically this year, and does it feel like all the necessary governance structures (e.g. platform...","link":"no"},"spotlight:1560128244":{"th":"MEASURE","typ":"spotlight","ftyp":"spotlight","desc":"Ad6","label":"Your board wants AI proof","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"spotlight:1560178514":{"th":"TOKEN","typ":"spotlight","ftyp":"spotlight","desc":"Ad2","label":"Is your AI spend paying off?","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"spotlight:1563207784":{"th":"MEASURE","typ":"spotlight","ftyp":"spotlight","desc":"Ad5","label":"Measure AI across the SDLC","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"spotlight:1563218404":{"th":"OTHER","typ":"spotlight","ftyp":"spotlight","desc":"Ad3","label":"AI Impact Week starts Oct 6th. 9am PT","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"spotlight:1563268604":{"th":"MEASURE","typ":"spotlight","ftyp":"spotlight","desc":"Ad4","label":"Stop guessing if AI works. Live virtual event","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"spotlight:1563298584":{"th":"MEASURE","typ":"spotlight","ftyp":"spotlight","desc":"Ad1","label":"How to prove AI is actually working | Free Webinar","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"urn:li:share:7506471778442096640":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"text":"Join us, October 6\u20138, as we unveil the new Jellyfish platform and capabilities for the AI-DLC era during our\u00a0AI Impact Week!\n\nJellyfish has been the leader in engineering analytics for almost a decade. But in the last two years, everything has changed. The SLDC and supporting tools have been upended. Software engineering roles are quickly transforming. And the rate of change shows no sign of slowing.\n\nMost engineering leaders are familiar with Jellyfish and our long term drive to make software engineering a more data driven discipline. But over the past year we\u2019ve been busy reimagining Jellyfish for the AI era.\n\nBuilding on our strong foundations in SDLC analytics, we\u2019ve created a new Jellyfish platform to help you understand your AI-DLC. Is it working and driving impact? If so, how does your practice compare to leading orgs? Is your use of AI cost effective and driving good ROI? And how can you advance your AI development practice, both to attain the maximum benefit possible with today\u2019s tools and workflows, but also to keep up with the fast moving space of new tools and approaches?\n\nJoin us for 3 days to learn how to see, measure, and prove AI\u2019s impact on how software gets built:\n- Day 1: Keynotes featuring Jellyfish co-founders Andrew Lau, Philip Braden, and David Gourley\n- Day 2: A live look at products we\u2019re launching\n- Day 3: Unveiling deeper integrations to give customers a complete picture of AI impact\n\nRegister for this virtual event here: https://lnkd.in/gEmy3W39","hook":"Join us, October 6\u20138, as we unveil the new Jellyfish platform and capabilities for the AI-DLC era during our\u00a0AI Impact Week! Jellyfish has been the leader in engineering...","link":"has"},"urn:li:ugcPost:7507603597249978368":{"th":"OTHER","typ":"event","ftyp":"image","desc":"","label":"AI Impact Week Ad 1","vid":false,"fmt":"event","author":"","pv":"previews/ugc-7507603597249978368.jpg","link":"has"},"urn:li:ugcPost:7510698086625804290":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q3 2026: AI Engineering Trends (Sept) v1","label":"AI Engineering Trends (Sept) v1","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7510698086625804290.jpg","link":"has"},"urn:li:ugcPost:7510698217781698560":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q3 2026: AI Engineering Trends (Sept.) v2","label":"AI Engineering Trends (Sept.) v2","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7510698086625804290.jpg","link":"has"},"urn:li:share:7511439794988724224":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":"previews/share-7511439794988724224.jpg","text":"Had a great time on Tuesday recording our content for Jellyfish AI Impact Week!\n\nJulie Neumann led a spirited discussion with David Gourley and I. We're two of the most plain-speaking folks here at JF, hopefully they don't edit out all our \ud83c\udf36\ufe0f takes in post \ud83d\ude09\n\nBe sure to register, and tune in next week!","hook":"Had a great time on Tuesday recording our content for Jellyfish AI Impact Week! Julie Neumann led a spirited discussion with David Gourley and I. We're two of the most...","link":"no"},"urn:li:ugcPost:7511799522327523328":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7511799522327523328.jpg","text":"Next week is the biggest launch in Jellyfish history \ud83e\udebc \u00a0\n\nAI Impact Week, running Oct. 6-8, is built around the question every engineering leader I talk to is wrestling with: we're spending the tokens, we're pushing our teams, but is any of it paying off?\n\nJellyfish has spent a decade measuring how software gets built. We have the most comprehensive engineering dataset in the industry, spanning 100M PRs and 150T tokens from over 275k engineers and 1,300 companies. That means we can see what AI is actually changing - and what it isn't.\u00a0\n\nOn Day 1, Im moderating a panel with our co-founder David Gourley and Head of AI & Research Nicholas Arcolano, Ph.D. on the latest trends from our AI research. We continue to see that more code isn't the same as more impact. Developers are creating code faster, but not shipping more features. And teams with average AI adoption have actually slipped below low adopters on PR throughput since May. The bottleneck has moved to planning, review, governance, and how teams are structured.\n\nYou also won't want to miss a very special keynote from legends Nathen Harvey (DORA) and Laura Tacho (AWS), insights from our CEO Andrew Lau, customer conversations, and more. Day 2 is live demos of what we've built for the agent era, while Day 3 features partners like Linear, AWS, and IBM.\n\nAll virtual, starting Oct. 6 at 9 am PT/noon ET, available on demand as soon as the sessions wrap. See you there! https://lnkd.in/gSvEH4Kz","hook":"Next week is the biggest launch in Jellyfish history \ud83e\udebc AI Impact Week, running Oct. 6-8, is built around the question every engineering leader I talk to is wrestling with:...","link":"has"},"urn:li:ugcPost:7517237269716631553":{"th":"TOKEN","typ":"document","ftyp":"document","desc":"","label":"Tokenomics 2027","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7517237269716631553.jpg","link":"has"},"urn:li:share:7520937222158725120":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"","label":"Tokenomics Ad 1","vid":false,"fmt":"share","author":"","pv":"previews/share-7520937222158725120.jpg","link":"has"},"urn:li:share:7520937336503939072":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"","label":"Tokenomics Ad 5","vid":false,"fmt":"share","author":"","pv":"previews/share-7520937336503939072.jpg","link":"has"},"urn:li:share:7520937318879473667":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"","label":"Tokenomics Ad 3","vid":false,"fmt":"share","author":"","pv":"previews/share-7520937318879473667.jpg","link":"has"},"urn:li:share:7520937327628812288":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"","label":"Tokenomics Ad 4","vid":false,"fmt":"share","author":"","pv":"previews/share-7520937327628812288.jpg","link":"has"},"urn:li:share:7520937309907681281":{"th":"TOKEN","typ":"company","ftyp":"image","desc":"","label":"Tokenomics Ad 2","vid":false,"fmt":"share","author":"","pv":"previews/share-7520937309907681281.jpg","link":"has"},"urn:li:ugcPost:7521284441751588865":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q4 2026: AI Engineering Trends (Oct) v1","label":"AI Engineering Trends (Oct) v1","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7521284441751588865.jpg","link":"has"},"urn:li:ugcPost:7521284994582073346":{"th":"RESEARCH","typ":"document","ftyp":"document","desc":"Q4 2026: AI Engineering Trends (Oct.) v2","label":"AI Engineering Trends (Oct.) v2","vid":false,"fmt":"document","author":"","pv":"previews/ugc-7521284441751588865.jpg","link":"has"},"urn:li:ugcPost:7521205501641252864":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":true,"fmt":"ugc","author":"","pv":"previews/ugc-7521205501641252864.jpg","text":"The shift in autonomous coding this year has been massive. From April to September, the share of developers coding with full auto-approval went from 4% to 34% in the Jellyfish data.\n\nUnfortunately, all that autonomy isn't helping as much downstream, because code is piling up at review and merge. Here's a new \"Drawn from the Data\" video about why so many folks are hitting a wall getting agent-written code out the door.\n\nWant to learn more? Come join me at Tessl's AI Native DevCon in NYC next week, Nov 2\u20134!","hook":"The shift in autonomous coding this year has been massive. From April to September, the share of developers coding with full auto-approval went from 4% to 34% in the Jellyfish...","link":"no"},"urn:li:share:7443359364201115648":{"th":"MEASURE","typ":"company","ftyp":"image","desc":"Q2 2026 BOFU: AI Impact - Theme: Predictive DevAI Insights","label":"Predictive DevAI Insights","vid":false,"fmt":"share","author":"","pv":"previews/share-7443359364201115648.jpg","link":"has"},"urn:li:share:7355631954303590400":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"text":"For the first time in decades, software engineering roles are being fundamentally questioned.  AI isn\u2019t replacing engineers. But it\u2019s reshaping how we work, what we value, and what skills matter most.\n\nChanges I'm sure we\u2019re all seeing:\n\n- PMs acting more like architects\n- Engineers spending more time editing prompts than writing code\n- Prompt chains that look suspiciously like specs\n- Teams shifting from net-new hiring to net-new AI spend\n\nThere\u2019s fear, sure. I\u2019ve been in this industry since the 90s. I get it. But you can\u2019t stop the future. You can only prepare for it. Lean into it.\n\nSo if I were just starting out today, I\u2019d still tell students to study software engineering. But I\u2019d also tell them:\n\n- Learn by doing\n- Learn by using the tools.  All of them.\n- Learn how to prompt\n- Learn how to manage agents\n- Learn to contextualize your output and your systems\n\nThe work isn\u2019t going away. But how that work is defined and achieved is evolving. \n","hook":"For the first time in decades, software engineering roles are being fundamentally questioned.  AI isn\u2019t replacing engineers. But it\u2019s reshaping how we work, what we value, and...","link":"no"},"urn:li:share:7287873928721534976":{"th":"TLA","typ":"tla","ftyp":"tla","desc":"Member post. The API did not return the copy.","label":"Thought Leader ad","vid":false,"fmt":"share","author":"","pv":null,"link":"has"},"spotlight:926747144":{"th":"MEASURE","typ":"spotlight","ftyp":"spotlight","desc":"Aircover - Spotlight - AI Impact - impact - v9","label":"Measure Real Impact of AI on Productivity","vid":false,"fmt":"spotlight","author":"","pv":"previews/spotlight-1139860704.jpg","link":"has"},"spotlight:926826554":{"th":"DX","typ":"spotlight","ftyp":"spotlight","desc":"Aircover - Spotlight - EMP - Trust v3","label":"Improve Dev Productivity at %COMPANYNAME%","vid":false,"fmt":"spotlight","author":"","pv":null,"link":"has"}},"TH":{"TLA":{"n":"Thought Leader ads","d":"Member-sponsored posts. The LinkedIn API often returns 403 on the post text, so some of these are labeled by author and a known topic rather than the live hook."},"TOKEN":{"n":"AI ROI and token costs","d":"Token spend, token ROI, tying tokens to outcomes, rising spend, and Tokenomics."},"MEASURE":{"n":"AI coding impact measurement","d":"Proving value, KPIs, predictive insights, DevAI observability, and AI-integrated engineering ROI."},"COPILOT":{"n":"Copilot or Cursor usage","d":"Company ads about Copilot, Cursor, or coding agents. Thought Leader posts on those topics stay in the Thought Leader ads theme."},"DX":{"n":"DX and productivity","d":"DevEx, bottlenecks, productivity, Jellyfish Assistant, and Data Hub videos or ads."},"PROOF":{"n":"Social proof","d":"Customer testimonials and case studies (Lastpass, Box, TaskRabbit, Hootsuite, Quantexa, and others)."},"RESEARCH":{"n":"Research and reports","d":"Gated document ads: State of AI, SEMR, and AI Engineering Trends."},"STRATEGY":{"n":"AI strategy","d":"AI strategy, transformation, pilots, and tool comparison, when those are not already a test     const el=list.filter(r=>rankable(r)&&AV[k](r)!==null);
    const {b,w}=pillN(el.length);
    const vs=el.map(r=>AV[k](r));
    const best=vs.slice().sort((a,c)=>(c-a)*dir).slice(0,b);
    const worst=vs.slice().sort((a,c)=>(a-c)*dir).filter(v=>!best.includes(v)).slice(0,w);

  });

  const i=w.best.indexOf(v);
  if(i>=0){w.best.splice(i,1,NaN);return `<span class="gv">${txt}</span>`}

  const high=pool.filter(r=>r.lp>=1).sort((a,b)=> (b.spend/b.lp)-(a.spend/a.lp));
