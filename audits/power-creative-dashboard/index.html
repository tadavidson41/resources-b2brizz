function stPill(cs){const [n,lv]=stat(cs);if(!n)return '<span class="pill p-n">n/a</span>';const s=lv==0?'Paused':lv==n?'Live':'Mixed';return `<span class="pill ${s=='Live'?'p-g':s=='Mixed'?'p-p':'p-n'}">${s}</span><div class="vdesc">${num(lv)} of ${num(n)} ads live</div>`}
function fatPill(f){if(!f||f.st=='none')return '<span class="pill p-n">Not checked</span>';
 if(f.st=='flag')return `<span class="pill p-a">Fatigue flagged</span><div class="vdesc">CTR ${f.ctr1.toFixed(2)}% to ${f.ctr2.toFixed(2)}%</div>`;
 if(f.st=='ok')return `<span class="pill p-g">Not flagged</span><div class="vdesc">CTR ${f.ctr1.toFixed(2)}% to ${f.ctr2.toFixed(2)}%</div>`;
 if(f.st=='new')return `<span class="pill p-n">Not checked</span><div class="vdesc">Too new (first delivery ${sd(f.first)})</div>`;
 return `<span class="pill p-n">Not checked</span><div class="vdesc">Under 1,000 impr. in a window</div>`}
function chg(a,b,dir){if(!(b>0))return '<span>no prior data</span>';const r=(a-b)/b*100;if(Math.abs(r)<0.05)return '<span>flat vs prior</span>';const up=r>0;const good=dir=='low'?!up:dir=='high'?up:null;
 return `<span class="${good===null?'':good?'good':'bad'}">${up?'&#8593;':'&#8595;'} ${Math.abs(r).toFixed(1)}%</span> vs prior`}
function kpis(sk){const cs=scopeC(sk);const t=tot(cs),q=tot(cs,'prior');
 const K=[['Spend',usd(t.spend),chg(t.spend,q.spend),usd(q.spend)],['Impressions',num(t.impr),chg(t.impr,q.impr),num(q.impr)],['LP clicks',num(t.lp),chg(t.lp,q.lp,'high'),num(q.lp)],
 ['Cost/LP',cpl(t.spend,t.lp),t.lp>0&&q.lp>0?chg(t.spend/t.lp,q.spend/q.lp,'low'):'<span>n/a</span>',cpl(q.spend,q.lp)],['LP CTR',pct(t.lp,t.impr),t.impr>0&&q.impr>0?chg(t.lp/t.impr,q.lp/q.impr,'high'):'<span>n/a</span>',pct(q.lp,q.impr)],
 ['Clicks',num(t.clicks),chg(t.clicks,q.clicks,'high'),num(q.clicks)],['CTR',pct(t.clicks,t.impr),t.impr>0&&q.impr>0?chg(t.clicks/t.impr,q.clicks/q.impr,'high'):'<span>n/a</span>',pct(q.clicks,q.impr)]];
 return `<div class="kpis">${K.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="c">${k[2]}</div><div class="pr">Prior: ${k[3]}</div></div>`).join('')}</div>`}
const AV={label:r=>r.label,spend:r=>r.spend,impr:r=>r.impr,lp:r=>r.lp,cpl:r=>r.lp>0?r.spend/r.lp:null,lpctr:r=>r.impr>0?r.lp/r.impr:null,clicks:r=>r.clicks,ctr:r=>r.impr>0?r.clicks/r.impr:null};
function cmpv(a,b){if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;return typeof a=='string'?a.localeCompare(b):a-b}
function srt(tid,c){const s=SORT[tid];SORT[tid]=(s&&s.c==c)?{c,d:-s.d}:{c,d:(c=='label'||c=='cpl')?1:-1};render()}
function tog(tid,k){OPEN[tid]=OPEN[tid]||new Set();const o=OPEN[tid];o.has(k)?o.delete(k):o.add(k);render()}
function togAll(tid,keys){OPEN[tid]=OPEN[tid]||new Set();const o=OPEN[tid];const all=keys.every(k=>o.has(k));keys.forEach(k=>all?o.delete(k):o.add(k));render()}
function pvImg(name,big){const m=D.NM[name];if(!m||!m.pv)return '<div class="nopv">No preview</div>';return `<img class="thumb" loading="lazy" src="${m.pv}" alt="${esc(name)} preview" onclick="event.stopPropagation();lbOpen(this.src,'${esc(name).replace(/'/g,'&#39;')}')">`}
// one table: theme rows, expandable to ad names
function themeTable(tid,sk){const p=D.periods[P];const cs=scopeC(sk);const F=D.FAT[sk]||{t:{},n:{}};
 const byT={};cs.forEach(c=>{(byT[c.th]=byT[c.th]||[]).push(c)});
 const rows=[];Object.entries(byT).forEach(([th,arr])=>{const t=tot(arr);if(!(t.impr>0||t.spend>0))return;
  const byN={};arr.forEach(c=>{(byN[c.name]=byN[c.name]||[]).push(c)});
  const kids=Object.entries(byN).map(([n,a])=>({label:pretty(n).t,name:n,cs:a,...tot(a)})).filter(r=>r.impr>0||r.spend>0);
  rows.push({key:th,label:D.TH[th].n,desc:D.TH[th].d,cs:arr,kids,...t})});
 const s=SORT[tid]||{c:'spend',d:-1};const sorter=(a,b)=>cmpv(AV[s.c](a),AV[s.c](b))*s.d;rows.sort(sorter);rows.forEach(r=>r.kids.sort(sorter));
 const T=tot(cs);const minS=0.05*T.spend;const elig=rows.filter(r=>r.spend>=minS&&r.impr>0);
 const cpls=elig.filter(r=>r.lp>0).map(r=>r.spend/r.lp).sort((a,b)=>a-b);const ctrs=elig.map(r=>r.lp/r.impr).sort((a,b)=>b-a);
 const cl=(r,v,arr,t)=>{if(v===null||!(r.spend>=minS))return t;if(arr.slice(0,3).includes(v))return `<span class="gv" title="Among the 3 best themes in this table (themes with 5%+ of spend)">${t}</span>`;if(arr.length>5&&arr.slice(-3).includes(v))return `<span class="rv" title="Among the 3 worst themes in this table (themes with 5%+ of spend)">${t}</span>`;return t};
 const o=OPEN[tid]||new Set();
 const met=(r,top)=>{const c=r.impr>0?r.lp/r.impr:null,cc=r.lp>0?r.spend/r.lp:null;return `<td class="n bl">${usd(r.spend)}</td><td class="n">${num(r.impr)}</td><td class="n">${num(r.lp)}</td><td class="n">${top?cl(r,cc,cpls,cpl(r.spend,r.lp)):cpl(r.spend,r.lp)}</td><td class="n">${top?cl(r,c,ctrs,pct(r.lp,r.impr)):pct(r.lp,r.impr)}</td><td class="n">${num(r.clicks)}</td><td class="n">${pct(r.clicks,r.impr)}</td>`};
 const body=rows.map(r=>{const op=o.has(r.key);const topN=r.kids.slice().sort((a,b)=>b.spend-a.spend).find(k=>D.NM[k.name]&&D.NM[k.name].pv);
  const h=`<tr class="th${op?' open':''}" onclick="tog('${tid}','${r.key}')" tabindex="0" onkeydown="if(event.key=='Enter')tog('${tid}','${r.key}')"><td>${topN?pvImg(topN.name):'<div class="nopv">No preview</div>'}</td><td class="lab"><span class="vlab">${esc(r.label)}</span><div class="vdesc">${esc(r.desc)}</div><div class="vdesc"><b>${r.kids.length}</b> ad ${r.kids.length==1?'concept':'concepts'}, click to ${op?'collapse':'expand'}${topN?'. Preview: top spender':''}</div></td>${met(r,1)}<td class="bl">${stPill(r.cs)}</td><td class="bl">${fatPill(F.t[r.key])}</td></tr>`;
  const k=op?r.kids.map(x=>{const pr=pretty(x.name);return `<tr class="kid"><td>${pvImg(x.name)}</td><td><span class="vlab">${esc(pr.t)}</span>${pr.v?`<span class="tag">${esc(pr.v)}</span>`:''}<div class="vdesc">${esc(D.NM[x.name].desc)}</div><div class="rawn">${esc(x.name)}</div></td>${met(x,0)}<td class="bl">${stPill(x.cs)}</td><td class="bl">${fatPill(F.n[x.name])}</td></tr>`}).join(''):'';
  return h+k}).join('');
 const sh=(c,n)=>`<th class="s n" onclick="srt('${tid}','${c}')">${n}${s.c==c?(s.d>0?' &#9650;':' &#9660;'):''}</th>`;
 if(!rows.length)return `<div class="empty">No delivery in ${esc(p.label.toLowerCase())} for this scope.</div>`;
 const keys=rows.map(r=>r.key);
 return `<div class="tbar"><span class="vdesc" style="max-width:none">Click a theme row to see the ads inside it. Click a preview to enlarge.</span><span class="sp"></span><button class="btn2" onclick='togAll("${tid}",${JSON.stringify(keys)})'>Expand or collapse all</button><button class="btn2" onclick="csv('${tid}')">Export CSV</button></div>
 <div class="tw"><table id="${tid}"><thead><tr><th class="grp" colspan="2" style="border-left:0">Creative</th><th class="grp" colspan="7">Performance, ${esc(p.label)} (${rngT(p.start,p.end)})</th><th class="grp">Current delivery</th><th class="grp">Fatigue</th></tr>
 <tr><th>Preview</th><th class="s" onclick="srt('${tid}','label')">Theme / ad${s.c=='label'?(s.d>0?' &#9650;':' &#9660;'):''}</th>${sh('spend','Spend')}${sh('impr','Impr.')}${sh('lp','LP clicks')}${sh('cpl','Cost/LP')}${sh('lpctr','LP CTR')}${sh('clicks','Clicks')}${sh('ctr','CTR')}<th class="bl">Status now</th><th class="bl">Fixed 14-day windows</th></tr></thead>
 <tbody>${body}<tr class="tot"><td></td><td>Total</td>${met({...T},0)}<td class="bl">${stPill(cs)}</td><td class="bl">${fatPill(F.tot)}</td></tr></tbody></table></div>
 <div class="legend"><span class="gv">Green check</span><span>= among the 3 lowest Cost/LP or highest LP CTR themes.</span><span class="rv">Red !</span><span>= among the 3 worst. Only themes with 5%+ of the table's spend are flagged.</span></div>`}
// summary table for industries / sub-industries
function sumTable(kind){const p=D.periods[P];const list=kind=='i'?INDS.map(x=>[x,x]):SUBS.map(([s,i])=>[s,i]);
 const all=tot(D.C);const rows=list.map(([k,i])=>{const cs=scopeC(kind+':'+k);const t=tot(cs);const tiers=[...new Set(cs.map(c=>CM[c.camp].tier))];return {k,i,cs,tiers,...t}});
 const sel=kind=='i'?SELI:SELS;
 return `<div class="tw"><table><thead><tr><th>${kind=='i'?'Industry':'Sub-industry'}</th><th class="n">Spend</th><th class="n">Share of spend</th><th class="n">Impr.</th><th class="n">LP clicks</th><th class="n">Cost/LP</th><th class="n">LP CTR</th><th class="n">Clicks</th><th class="n">CTR</th><th class="bl">Live ads now</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="clk${r.k==sel?' sel':''}" onclick="${kind=='i'?'SELI':'SELS'}='${r.k.replace(/'/g,"\\'")}';render(true)"><td><span class="vlab">${esc(kind=='i'?r.k:SUBL(r.k))}</span>${kind=='s'&&r.i!='Retargeting'?`<span class="tag">${esc(r.i)}</span>`:''}${r.tiers.map(t=>`<span class="tag ${t=='Enterprise'?'ent':t=='Growth'?'grw':'rt'}">${esc(t)}</span>`).join('')}</td><td class="n">${usd(r.spend)}</td><td class="n">${all.spend>0?(100*r.spend/all.spend).toFixed(1)+'%':'n/a'}</td><td class="n">${num(r.impr)}</td><td class="n">${num(r.lp)}</td><td class="n">${cpl(r.spend,r.lp)}</td><td class="n">${pct(r.lp,r.impr)}</td><td class="n">${num(r.clicks)}</td><td class="n">${pct(r.clicks,r.impr)}</td><td class="bl">${stPill(r.cs)}</td></tr>`).join('')}
 <tr class="tot"><td>Total, all live ad sets</td><td class="n">${usd(all.spend)}</td><td class="n">100%</td><td class="n">${num(all.impr)}</td><td class="n">${num(all.lp)}</td><td class="n">${cpl(all.spend,all.lp)}</td><td class="n">${pct(all.lp,all.impr)}</td><td class="n">${num(all.clicks)}</td><td class="n">${pct(all.clicks,all.impr)}</td><td class="bl">${stPill(D.C)}</td></tr></tbody></table></div>`}
function csv(tid){const t=$(tid);if(!t)return;const rows=[...t.querySelectorAll('tr')].filter(tr=>!tr.querySelector('th.grp')).map(tr=>[...tr.children].slice(1).map(c=>{const k=c.cloneNode(true);k.querySelectorAll('img,.vdesc,.rawn').forEach(x=>x.remove());return k.textContent.replace(/[\u25B2\u25BC\u25B8\u25BE\u2713]/g,'').replace(/\s+/g,' ').trim()}));
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const b=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='power-digital-creatives-'+tid+'-'+P+'.csv';document.body.appendChild(a);a.click();a.remove()}
function render(keep){const y=window.scrollY;const p=D.periods[P];
 $('pills').innerHTML=ORDER.map(k=>`<button class="${k==P?'on':''}" aria-pressed="${k==P}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');
 $('range').textContent=rngT(p.start,p.end);$('vs').textContent='Compared with '+(P=='mtd'?'the same days of last month':'the previous equal-length period')+': '+rngT(p.prior.start,p.prior.end);
 $('themes').innerHTML=`<div class="sh"><span class="num">SECTION 1</span><h2>Creative performance by theme</h2><div class="desc">All ${D.meta.live_camps} live ad sets combined. Each theme row adds up every ad in that concept; open a row to see each ad. Performance follows the reporting period. Status and fatigue use their own dates, shown in the column groups.</div></div>
 ${kpis('all')}
 <div class="notice"><span class="nb">Scope:</span><span>Live = ad set Active and serving (${D.meta.live_camps} ad sets: 11 sub-industry ad sets plus 1 retargeting). Ad sets in campaign groups on hold are left out, so totals are lower than the full account. Paused ads inside live ad sets are included for the days they ran. Four Growth ad sets (Beauty, Food &amp; Bev, Supplements, Fashion) and the retargeting ad set first delivered Nov 5, 2026, so they have no prior-period data, and earlier Growth delivery that ran in ad sets that are no longer live is not counted.</span></div>
 ${themeTable('tt-all','all')}`;
 $('industry').innerHTML=`<div class="sh"><span class="num">SECTION 2</span><h2>By industry</h2><div class="desc">Click an industry row to see its themes and ads below.</div></div>${sumTable('i')}
 <div class="sub-h"><div><h3>${esc(SELI)}: creative by theme</h3><div class="desc">${esc(SELI)} ad sets only, ${esc(p.label.toLowerCase())}.</div></div><div class="seg sm">${INDS.map(k=>`<button class="${k==SELI?'on':''}" onclick="SELI='${k}';render(true)">${k}</button>`).join('')}</div></div>
 ${kpis('i:'+SELI)}${themeTable('tt-ind','i:'+SELI)}`;
 $('subindustry').innerHTML=`<div class="sh"><span class="num">SECTION 3</span><h2>By sub-industry</h2><div class="desc">Enterprise and Growth ad sets for the same sub-industry are combined. Click a sub-industry row to see its themes and ads below.</div></div>${sumTable('s')}
 <div class="sub-h"><div><h3>${esc(SUBL(SELS))}: creative by theme</h3><div class="desc">${esc(SUBL(SELS))} ad sets only, ${esc(p.label.toLowerCase())}.</div></div><div class="seg sm">${SUBS.map(([k])=>`<button class="${k==SELS?'on':''}" onclick="SELS='${k.replace(/'/g,"\\'")}';render(true)">${esc(k=='All industries'?'Retargeting':k.split(' / ')[0].replace('Electronics','Lifestyle').replace('Apparel','Fashion').replace('SaaS','B2B SaaS'))}</button>`).join('')}</div></div>
 ${kpis('s:'+SELS)}${themeTable('tt-sub','s:'+SELS)}`;
 fatigue();
 if(keep)window.scrollTo(0,y)}
function fatigue(){const F=D.FAT.all;const w=D.meta.fwin;const T=Object.entries(F.t).map(([k,v])=>({label:D.TH[k].n,...v})).filter(r=>r.i2>0);const N=Object.entries(F.n).map(([k,v])=>({label:k,...v})).filter(r=>r.i2>0);
 const chk=[...T,...N].filter(r=>r.st=='ok'||r.st=='flag');const fl=[...T,...N].filter(r=>r.st=='flag');
 const row=r=>`<tr><td><span class="vlab">${esc(r.label)}</span></td><td>${fatPill(r)}</td><td class="n">${r.first?fmtD(r.first):'n/a'}</td><td class="n">${r.ctr1!=null?r.ctr1.toFixed(2)+'%':pct(r.c1,r.i1)}</td><td class="n">${r.ctr2!=null?r.ctr2.toFixed(2)+'%':pct(r.c2,r.i2)}</td><td class="n">${r.drop!=null?`<span class="${r.drop>=30?'rv':r.drop<0?'gv':''}">${r.drop>=0?'-':'+'}${Math.abs(r.drop).toFixed(1)}%</span>`:'n/a'}</td><td class="n">${num(r.i1||0)}</td><td class="n">${num(r.i2||0)}</td></tr>`;
 const order=a=>a.sort((x,y)=>{const o={flag:0,ok:1,low:2,new:3,none:4};return (o[x.st]-o[y.st])||((y.drop||0)-(x.drop||0))||((y.i2||0)-(x.i2||0))});
 const head=`<thead><tr><th>Theme / ad</th><th>Fatigue status</th><th class="n">First delivery</th><th class="n">CTR, first 14 days</th><th class="n">CTR, last 14 days</th><th class="n">CTR change</th><th class="n">Impr., first 14 days</th><th class="n">Impr., last 14 days</th></tr></thead>`;
 $('fatigue').innerHTML=`<div class="sh"><span class="num">SECTION 4</span><h2>Creative fatigue</h2><div class="desc">Fixed 14-day windows that do not follow the reporting period. Only themes and ads with impressions in the last 14 days are listed.</div></div>
 <div class="notice"><span class="nb">Method:</span><span>Compares CTR (clicks / impressions) in the last 14 days (${rngT(w[0],w[1])}) with each theme's or ad's first 14 days of delivery in the live ad sets. Flagged when CTR dropped 30% or more. Checked only when there are 1,000+ impressions in both windows. Anything that first delivered after ${fmtD(D.meta.elig)} has no full first window yet and is not checked.</span></div>
 <div class="stats"><div><b>${num(chk.length)}</b>themes and ads checked</div><div><b>${num(fl.length)}</b>flagged</div><div><b>${num(N.filter(r=>r.st=='low').length)}</b>ads under 1,000 impr. in a window</div><div><b>${num(N.filter(r=>r.st=='new').length)}</b>ads too new</div></div>
 <h3 style="margin:6px 0 8px">Themes, all live ad sets</h3><div class="tw"><table>${head}<tbody>${order(T).map(row).join('')}</tbody></table></div>
 <h3 style="margin:22px 0 8px">Ads with enough volume to check</h3>${N.filter(r=>r.st=='ok'||r.st=='flag').length?`<div class="tw"><table>${head}<tbody>${order(N.filter(r=>r.st=='ok'||r.st=='flag')).map(row).join('')}</tbody></table></div>`:'<div class="empty">No single ad has 1,000+ impressions in both windows.</div>'}`}
$('nlive').textContent=D.meta.live_camps+' ad sets';$('thru').textContent=fmtD(D.meta.through);$('asof').textContent=D.meta.asof;
$('foot').innerHTML=`<ul>
<li><b>Source:</b> LinkedIn Marketing API, ad account 509859857, creative-level daily analytics pulled Nov 9, 2026. Totals reconcile to campaign-level totals for the ${D.meta.live_camps} live ad sets in every period.</li>
<li><b>Live ad sets:</b> status Active and serving now. 11 sub-industry ad sets (Enterprise and Growth tiers) plus 1 retargeting ad set. Ad sets in campaign groups on hold are not included.</li>
<li><b>Theme:</b> taken from the concept code at the start of each ad name (OMEGA, WWTRA, WWTWA, STATS, SP, BULLETS, RT and so on). Ads without a code are grouped by headline (Stop discounting, Custom roadmap). Theme descriptions come from the copy on the live images.</li>
<li><b>Unnamed post:</b> 7 ads with no name in Campaign Manager. The API returns "forbidden" for the post, so there is no preview or copy. Most likely a post from another page or a member (thought leader ad).</li>
<li><b>LP clicks:</b> LinkedIn landing page clicks. <b>Cost/LP</b> = spend / LP clicks. <b>LP CTR</b> = LP clicks / impressions. <b>Clicks</b> = LinkedIn clicks (the Campaign Manager Clicks column). <b>CTR</b> = clicks / impressions. n/a means the divisor is 0.</li>
<li><b>Status now:</b> Live = the ad is Active and serving. Mixed = some ads in the row are live. Checked ${esc(D.meta.asof)}.</li>
<li><b>Periods:</b> Last 7 days, Last 30 days and Last 60 days end on the last full day (Nov 8, 2026) and compare with the previous equal-length period. Month to date compares with the same days of last month.</li>
<li><b>Preview:</b> the ad image for each ad. Theme rows show the top spending ad in the period.</li></ul>`;
render();
</script></body></html>
