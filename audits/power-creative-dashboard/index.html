const usd=v=>'$'+Math.round(v).toLocaleString('en-US');const num=v=>Math.round(v).toLocaleString('en-US');
const pct=(a,b)=>b>0?(100*a/b).toFixed(2)+'%':'n/a';const cpl=(s,l)=>l>0?usd(s/l):'n/a';
const fmtD=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const sd=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TCODE={FDBV:'Food & Bev',BEAU:'Beauty',SUPP:'Supplements','SUPP-HHYG-BABY-PET':'Supplements',FSH:'Fashion',LIF:'Lifestyle',B2B:'B2B',CPG:'CPG'};
function pretty(n){if(n=='Unnamed post')return {t:n,v:''};let s=n.replace(/_?V\d+S\d+C\d+H\d+$/,'').replace(/C\d+H\d+$/,'');let v='';
 const m=s.match(/_(FDBV|BEAU|SUPP-HHYG-BABY-PET|SUPP|FSH|LIF|B2B|CPG)$/)||s.match(/-(LIF|FDBV|BEAU|B2B)$/);if(m){v=TCODE[m[1]];s=s.slice(0,m.index)}
 s=s.replace(/^(OMEGA|WWTRA|WWTWA|STATS|SP|BULLETS|MEMES|WUWOU|TSTM)_/,'').replace(/^RT-/,'').replace(/[-_]+/g,' ').replace(/\s+V\d+$/,'').trim();return {t:s,v}}
const TAGC={'Beauty':['#FFBAFB','#2B2A29'],'Food & Bev':['#FFCFA3','#2B2A29'],'Supplements':['#CDF8FF','#2B2A29'],'CPG':['#E8E6E1','#2B2A29'],'Fashion':['#D5D2FF','#2B2A29'],'Lifestyle':['#E3FF43','#2B2A29'],'B2B':['#7756FF','#FFFFFF'],'Retargeting':['#2B2A29','#FFFFFF']};
const SUBT={'Beauty':'Beauty','Food & Bev':'Food & Bev','Supplements / Hygiene / Baby / Pet':'Supplements','Apparel / Jewelry & Accessories':'Fashion','Electronics / Fitness / Sporting / Outdoor / Home':'Lifestyle','SaaS / Mid-market B2B':'B2B','All industries':'Retargeting'};
function tagH(v){if(!v)return '';const c=TAGC[v]||['#efefef','#2B2A29'];return `<span class="tag" data-tag="${esc(v)}" style="background:${c[0]};color:${c[1]}">${esc(v)}</span>`}
function segB(cs){return [...new Set(cs.map(c=>c.tier))].filter(t=>t!='Retargeting').sort().map(t=>`<span class="tag sgb">${t=='Enterprise'?'ENT':'GRW'}</span>`).join('')}
function tagFor(name,cs){const v=pretty(name).v;if(v)return v;const s=[...new Set(cs.map(c=>c.sub))];return s.length==1?SUBT[s[0]]:''}
const dotH=v=>TAGC[v]?`<span class="dot" style="background:${TAGC[v][0]}"></span>`:'';
const CM=D.CM;D.C.forEach(c=>{c.ind=CM[c.camp].ind;c.sub=CM[c.camp].sub;c.tier=CM[c.camp].tier});
const INDS=['All','CPG','Fashion','Lifestyle','B2B','Retargeting'];
const SUBS={CPG:[['Beauty','Beauty'],['Food & Bev','Food & Bev'],['Supplements / Hygiene / Baby / Pet','Supplements / Hygiene / Baby / Pet']]};
function scopeKey(){const k=IND=='All'?'all':(SUB!='All'?'s:'+SUB:'i:'+IND);return SEG=='All'?k:SEG+'|'+k}
function scopeLabel(){const b=IND=='All'?'All live ad sets':IND+(SUB!='All'?' / '+SUB:'');return SEG=='All'?b:SEG+', '+b}
const SEGT={ENT:'Enterprise',GRW:'Growth'};
function scopeC(){return D.C.filter(c=>(SEG=='All'||c.tier==SEGT[SEG])&&(IND=='All'||(c.ind==IND&&(SUB=='All'||c.sub==SUB))))}
function save(){try{sessionStorage.setItem('pdcr2',JSON.stringify({P,IND,SUB,SEG}))}catch(e){}}
function setP(k){P=k;save();render()}
function setI(k){IND=k;SUB='All';save();render()}
function setS(k){SUB=k;save();render()}
function setG(k){SEG=k;if(SEG!='All'&&IND=='Retargeting'){IND='All';SUB='All'}save();render()}
function lbOpen(src,cap){$('lbi').src=src;$('lbc').textContent=cap;$('lb').style.display='flex'}
function lbClose(){$('lb').style.display='none'}
document.addEventListener('keydown',e=>{if(e.key=='Escape')lbClose()});
const Z=()=>({spend:0,impr:0,lp:0,clicks:0,dws:0,dwi:0});
function tot(cs,prior){const p=D.periods[P];const src=prior?p.pv:p.v;const t=Z();cs.forEach(c=>{const v=src[c.id];if(v){t.spend+=v[0];t.impr+=v[1];t.lp+=v[2];t.clicks+=v[3];const d=!prior&&p.dw[c.id];if(d!=null&&d!==false&&v[1]>0){t.dws+=d*v[1];t.dwi+=v[1]}}});t.dwell=t.dwi>0?t.dws/t.dwi:null;return t}
function stPill(cs){const n=cs.length,lv=cs.filter(c=>c.live).length;if(!n)return '';const s=lv==0?'Paused':lv==n?'Live':'Mixed';return `<span class="pill ${s=='Live'?'p-g':s=='Mixed'?'p-p':'p-n'}">${s}</span>${s=='Mixed'?`<div class="vdesc">${lv} of ${n} live</div>`:''}`}
function kcard(l,v,cur,pri,lowBetter,fmt){let c='<span>-</span> no prior data';
 if(cur!==null&&pri!==null&&pri>0){const r=(cur-pri)/pri*100;const better=lowBetter?r<0:r>0;c=Math.abs(r)<0.05?`<span>flat</span> vs ${fmt(pri)} prior`:`<span class="${better?'up':'dn'}">${r>0?'&#8593;':'&#8595;'} ${Math.abs(r).toFixed(1)}%</span> vs ${fmt(pri)} prior`}
 return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${c}</div></div>`}
function kpis(cs){const t=tot(cs),q=tot(cs,1);const r=(a,b)=>b>0?a/b:null;const f2=v=>(100*v).toFixed(2)+'%';
 return `<div class="kpis">${kcard('CTR',pct(t.clicks,t.impr),r(t.clicks,t.impr),r(q.clicks,q.impr),0,f2)}${kcard('LP CTR',pct(t.lp,t.impr),r(t.lp,t.impr),r(q.lp,q.impr),0,f2)}${kcard('Cost per LP click',cpl(t.spend,t.lp),r(t.spend,t.lp),r(q.spend,q.lp),1,usd)}</div>`}
const AV={label:r=>r.label,spend:r=>r.spend,impr:r=>r.impr,lp:r=>r.lp,cpl:r=>r.lp>0?r.spend/r.lp:null,lpctr:r=>r.impr>0?r.lp/r.impr:null,clicks:r=>r.clicks,ctr:r=>r.impr>0?r.clicks/r.impr:null,dwell:r=>r.dwell};
const dwf=v=>v==null?'-':v.toFixed(1)+'s';
function winners(list){if(!list.length)return {};const avg=list.reduce((a,r)=>a+r.spend,0)/list.length;const el=list.filter(r=>r.spend>=avg&&r.impr>0);const W={};
 [['cpl',1],['lpctr',-1],['ctr',-1],['dwell',-1]].forEach(([k,d])=>{const vs=el.map(r=>AV[k](r)).filter(v=>v!==null&&v>0).sort((a,b)=>(a-b)*d);W[k]={vals:vs.slice(0,3),el:new Set(el)}});return W}
function hl(W,r,k,txt){const w=W[k];if(!w||!w.el.has(r))return txt;const v=AV[k](r);if(v===null)return txt;const i=w.vals.indexOf(v);if(i<0)return txt;w.vals.splice(i,1,NaN);return `<span class="gv">${txt}</span>`}
function cmpv(a,b){if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;return typeof a=='string'?a.localeCompare(b):a-b}
let SORT={c:'spend',d:-1};const OPEN=new Set();
function srt(c){SORT=(SORT.c==c)?{c,d:-SORT.d}:{c,d:(c=='label'||c=='cpl')?1:-1};render()}
function tog(k){OPEN.has(k)?OPEN.delete(k):OPEN.add(k);render()}
function pv(name){const m=D.NM[name];if(!m||!m.pv)return '<div class="nopv">No preview</div>';return `<img class="thumb" loading="lazy" src="${m.pv}" alt="" onclick="event.stopPropagation();lbOpen(this.src,'${esc(name).replace(/'/g,'&#39;')}')">`}
function vsAvg(k,v,a){if(v===null||v===undefined||a===null||!(a>0))return '';const r=(v-a)/a*100;if(Math.abs(r)<5)return '<div class="va at">at avg</div>';const better=k=='cpl'?r<0:r>0;return `<div class="va ${better?'bt':'wr'}">${r>0?'+':'-'}${Math.abs(r).toFixed(0)}% vs avg</div>`}
function table(cs){const p=D.periods[P];const AD=SUB!='All';const T=tot(cs);
 const A={cpl:T.lp>0?T.spend/T.lp:null,lpctr:T.impr>0?T.lp/T.impr:null,ctr:T.impr>0?T.clicks/T.impr:null,dwell:T.dwell};
 const sorter=(a,b)=>cmpv(AV[SORT.c](a),AV[SORT.c](b))*SORT.d;
 const byName=arr=>{const byN={};arr.forEach(c=>{(byN[c.name]=byN[c.name]||[]).push(c)});return Object.entries(byN).map(([n,a])=>({label:pretty(n).t,name:n,cs:a,th:a[0].th,...tot(a)})).filter(r=>r.impr>0||r.spend>0)};
 let rows=[];
 if(AD){rows=byName(cs)}else{const byT={};cs.forEach(c=>{(byT[c.th]=byT[c.th]||[]).push(c)});
  Object.entries(byT).forEach(([th,arr])=>{const t=tot(arr);if(!(t.impr>0||t.spend>0))return;rows.push({key:th,label:D.TH[th].n,cs:arr,kids:byName(arr),...t})})}
 if(!cs.length)return `<div class="empty">No ${SEG=='ENT'?'Enterprise':'Growth'} ad sets in ${esc(IND)}${SUB!='All'?' / '+esc(SUB):''}.</div>`;if(!rows.length)return `<div class="empty">No delivery in this period.</div>`;
 rows.sort(sorter);if(!AD)rows.forEach(r=>r.kids.sort(sorter));const WT=winners(rows);
 const cell=(W,r,k,txt,ok)=>{const v=AV[k](r);const shown=W?hl(W,r,k,txt):txt;return `<td class="n">${shown}${ok?vsAvg(k,v,A[k]):''}</td>`};
 const met=(r,W,cmp)=>{const hasI=r.impr>0;return `<td class="n">${usd(r.spend)}</td><td class="n">${num(r.impr)}</td><td class="n">${num(r.lp)}</td>${cell(W,r,'cpl',r.lp>0?usd(r.spend/r.lp):'-',cmp&&r.lp>0)}${cell(W,r,'lpctr',pct(r.lp,r.impr),cmp&&hasI)}<td class="n">${num(r.clicks)}</td>${cell(W,r,'ctr',pct(r.clicks,r.impr),cmp&&hasI)}${cell(W,r,'dwell',dwf(r.dwell),cmp&&r.dwell!=null)}`};
 const thTag=th=>`<span class="tag ttag">${esc(D.TH[th].n)}</span>`;
 const adRow=(x,W,cls)=>{const q=pretty(x.name);return `<tr class="${cls}"><td>${pv(x.name)}</td><td><span class="vlab">${esc(q.t)}</span>${tagH(tagFor(x.name,x.cs))}${segB(x.cs)}${AD?'<br>'+thTag(x.th):''}<div class="vdesc">${esc(D.NM[x.name].desc)}</div></td>${met(x,W,AD)}<td>${stPill(x.cs)}</td></tr>`};
 const body=AD?rows.map(x=>adRow(x,WT,'ad')).join(''):rows.map(r=>{const op=OPEN.has(r.key);const top=r.kids.slice().sort((a,b)=>b.spend-a.spend).find(k=>D.NM[k.name]&&D.NM[k.name].pv);
  return `<tr class="th${op?' open':''}" onclick="tog('${r.key}')"><td>${top?pv(top.name):'<div class="nopv">No preview</div>'}</td><td><span class="vlab">${esc(r.label)}</span><div class="vdesc">${r.kids.length} ${r.kids.length==1?'ad':'ads'}</div></td>${met(r,WT,0)}<td>${stPill(r.cs)}</td></tr>`+
  (op?(()=>{const WK=winners(r.kids);return r.kids.map(x=>adRow(x,WK,'kid')).join('')})():'')}).join('');
 const avgRow=`<tr class="avg"><td></td><td><span class="vlab">Average</span><div class="vdesc">This view, weighted</div></td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n">${A.cpl!=null?usd(A.cpl):'-'}</td><td class="n">${A.lpctr!=null?(100*A.lpctr).toFixed(2)+'%':'-'}</td><td class="n"></td><td class="n">${A.ctr!=null?(100*A.ctr).toFixed(2)+'%':'-'}</td><td class="n">${dwf(A.dwell)}</td><td></td></tr>`;
 const sh=(c,n)=>`<th class="s n" onclick="srt('${c}')">${n}${SORT.c==c?(SORT.d>0?' &#9650;':' &#9660;'):''}</th>`;
 return `<div class="tw"><table id="tt" data-mode="${AD?'ad':'theme'}"><thead><tr><th>Preview</th><th class="s" onclick="srt('label')">${AD?'Ad':'Theme / ad'}</th>${sh('spend','Spend')}${sh('impr','Impr.')}${sh('lp','LP clicks')}${sh('cpl','Cost/LP')}${sh('lpctr','LP CTR')}${sh('clicks','Clicks')}${sh('ctr','CTR')}${sh('dwell','Dwell time')}<th>Status now</th></tr></thead>
 <tbody>${AD?avgRow:''}${body}<tr class="tot"><td></td><td>Total</td>${met(T,null,0)}<td>${stPill(cs)}</td></tr></tbody></table></div>
 <div class="note">${AD?'':'Click a theme to see its ads. '}<span class="gv">Green</span> = top 3, among rows at or above average spend.${AD?' "vs avg" compares each ad with the Average row.':''} Dwell time = LinkedIn average dwell time, impression-weighted.</div>`}
function fatigue(){const F=D.FAT[scopeKey()]||{n:{}};const w=D.meta.fwin;
 const rs=Object.entries(F.n).filter(([n,v])=>v.drop!=null&&v.drop>=20).map(([n,v])=>({n,...v})).sort((a,b)=>b.drop-a.drop);
 $('fatigue').innerHTML=`<div class="sh"><h2>Creative fatigue</h2><span class="sc">${esc(scopeLabel())}</span></div>
 <div class="note" style="margin:0 0 12px">CTR in the last 14 days (${sd(w[0])} to ${fmtD(w[1])}) vs each ad's first 14 days. Flagged at a 30%+ drop, watch at 20 to 30%. Needs 1,000+ impressions in both windows. Fixed windows, not tied to the period.</div>
 ${rs.length?`<div class="tw"><table><thead><tr><th>Preview</th><th>Ad</th><th>Status</th><th class="n">CTR, first 14 days</th><th class="n">CTR, last 14 days</th><th class="n">Change</th><th class="n">Impr., first 14 days</th><th class="n">Impr., last 14 days</th></tr></thead><tbody>${rs.map(r=>{const q=pretty(r.n);return `<tr><td>${pv(r.n)}</td><td><span class="vlab">${esc(q.t)}</span>${tagH(tagFor(r.n,D.C.filter(c=>c.name==r.n)))}<div class="vdesc">First delivery ${fmtD(r.first)}</div></td><td>${r.drop>=30?'<span class="pill p-a">Flagged</span>':'<span class="pill p-n">Watch</span>'}</td><td class="n">${r.ctr1.toFixed(2)}%</td><td class="n">${r.ctr2.toFixed(2)}%</td><td class="n"><span class="dn">&#8595; ${r.drop.toFixed(1)}%</span></td><td class="n">${num(r.i1)}</td><td class="n">${num(r.i2)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No ads flagged or near the threshold for this filter.</div>'}`}
function render(){const p=D.periods[P];const cs=scopeC();
 $('pills').innerHTML=ORDER.map(k=>`<button class="${k==P?'on':''}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');
 $('range').textContent=`${sd(p.start)} to ${fmtD(p.end)} vs ${sd(p.prior.start)} to ${fmtD(p.prior.end)}`;
 $('segs').innerHTML=[['All','All'],['ENT','ENT'],['GRW','GRW']].map(([k,l])=>`<button class="${k==SEG?'on':''}" onclick="setG('${k}')" title="${k=='All'?'Enterprise, Growth and Retargeting':SEGT[k]+' ad sets only'}">${l}</button>`).join('');
 $('inds').innerHTML=INDS.filter(k=>!(SEG!='All'&&k=='Retargeting')).map(k=>`<button class="${k==IND?'on':''}" onclick="setI('${k}')">${dotH(k)}${k}</button>`).join('');
 const sl=SUBS[IND];$('subs').style.display=sl?'':'none';
 $('subs').innerHTML=sl?[['All','All '+IND]].concat(sl).map(([k,l])=>`<button class="${k==SUB?'on':''}" onclick="setS('${k}')">${k=='All'?'':dotH(SUBT[k])}${esc(l.split(' / ')[0])}</button>`).join(''):'';
 $('themes').innerHTML=`<div class="sh"><h2>${SUB!='All'?'Creative Performance by Ad':'Creative performance by theme'}</h2><span class="sc">${esc(scopeLabel())}, ${esc(p.label.toLowerCase())}</span></div>${kpis(cs)}${table(cs)}`;
 fatigue()}
$('nlive').textContent=D.meta.live_camps;$('thru').textContent=fmtD(D.meta.through);$('asof').textContent=D.meta.asof;
$('foot').innerHTML=`<li>LinkedIn Ads account 509859857, creative-level data. Live = ad set Active and serving (11 sub-industry ad sets plus retargeting). Paused ads in live ad sets count for the days they ran.</li>
<li>Theme = concept code at the start of the ad name (OMEGA, WWTRA, WWTWA, STATS, SP, BULLETS, RT). Ads without a code are grouped by headline.</li>
<li>Cost/LP = spend / landing page clicks. LP CTR = LP clicks / impressions. CTR = clicks / impressions. Prior = previous equal-length period (month to date: same days last month).</li>
<li>Four Growth ad sets and retargeting first delivered Nov 5, 2026, so they have no prior data.</li>`;
render();
</script></body></html>
