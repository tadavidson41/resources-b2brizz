 const MET={lp:['lp',v=>v==null?'n/a':num(v),MC.lp,'Rolling LP clicks'],ctr:['ctr',v=>v==null?'n/a':(100*v).toFixed(2)+'%',MC.ctr,'Rolling LP CTR'],cpl:['cpl',v=>v==null?'n/a':usd(v),MC.cpl,'Rolling Cost/LP'],spend:['spend',v=>v==null?'n/a':usd(v),MC.spend,'Rolling Spend']};
 const dd=pack.d.map(r=>({0:r[0],lp:r[1],ctr:r[2],cpl:r[3]==null?null:r[3],spend:r[4]==null?null:r[4]}));
 MTIPS={};MTIPN=0;
 const byD={};(pack.m||[]).forEach(([d,items])=>{(byD[d]=byD[d]||{d,ads:[],ms:[]}).ads.push(...items)});(pack.ms||[]).forEach(([d,items])=>{(byD[d]=byD[d]||{d,ads:[],ms:[]}).ms.push(...items)});
 const MARKS=Object.keys(byD).sort().map(d=>byD[d]);
 const one=(m,H,o)=>`<div style="font-size:12px;font-weight:600;color:var(--ink);margin:4px 0 0 4px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${m[2]};margin-right:6px"></i>${m[3]}</div>`+tpanel(dd,m[0],m[1],m[2],H,{name:m[3],marks:MARKS,...o});
 const vis=DSEL.length?DSEL.slice():['lp'];
 const multi=vis.length>1;
 const inner=!dd.length?`<div class="empty">No delivery in the last 60 days for this filter.</div>`:(multi?allPanel(dd,320,vis):one(MET[vis[0]]||MET.lp,300,{xl:1}));
 const tip='Single-metric views mark creative changes and milestones in the current filter. An ad is marked new on its first day with delivery, and marked paused on its last day with delivery only if the ad is now paused or removed, or its ad set is no longer live. A new ad set is marked on its first day with delivery, and an ad set is marked paused or ended on its last day with delivery if it is no longer live. A new campaign (campaign group) would be marked if one launched in this window; none did. Objective and daily budget change history is not available from the LinkedIn API, so those are not marked. Click one or more metric pills to plot them together (or All for every metric). Two or more metrics share one chart, each indexed to 100 at the start of the window; hover for actual values. Rolling Spend is spend in the last 7 days. Rolling metrics use a 7-day window. The chart always shows the last 60 days and follows the segment and industry filters, not the period pills.';
 const pills=[['lp','Rolling LP clicks'],['ctr','Rolling LP CTR'],['cpl','Rolling Cost/LP'],['spend','Rolling Spend'],['all','All']].map(([k,l])=>{const on=k==='all'?vis.length===MET_KEYS.length:vis.includes(k);return `<button class="${on?'on':''}" onclick="setD('${k}')">${l}</button>`;}).join('');
 const metLeg=vis.map(k=>`<span><i style="background:${MET[k][2]}"></i>${MET[k][3]}</span>`).join('');
 const markLeg=multi?'':`<span><i style="background:#2E6B45;border-radius:50%"></i>New ads launched</span><span><i style="background:#b8261b;border-radius:50%"></i>Ads paused</span><span><i style="background:#7756FF;border-radius:50%"></i>Milestone</span><span>Hover a marker for what changed</span>`;
 const idxNote=multi?'<span>Each line is indexed to 100 at the start of the window. Hover for actual values.</span>':'';
 const rollNote='<span>Rolling metrics use a 7-day window.</span>';
 return `<div class="daily" id="daily"><div class="ch"><div><h2>Daily performance ${info(tip)}</h2><div class="desc">${sd(ch.start)} to ${fmtD(ch.end)} (last 60 days). Follows the segment and industry filters, not the period pills.</div></div><div class="seg sm" id="dmode">${pills}</div></div><div class="chart" id="trend">${inner}</div><div class="legend">${metLeg}${markLeg}${idxNote}${rollNote}</div></div>`}
function fatSeries(name){const days=((D.CHART.s||{}).all||{d:[]}).d.map(r=>r[0]);const arr=(D.ROLL||{})[name]||[];return days.map((d,i)=>({0:d,ctr:arr[i]==null?null:arr[i]}))}
function fatChart(name){const dd=fatSeries(name);const ch=D.CHART||{};const has=dd.some(r=>r.ctr!=null);
 if(!has)return `<div class="empty">No 7-day rolling CTR window in the last 60 days for this ad.</div>`;

 return `<div class="note" style="margin:0 0 8px">7-day rolling CTR (clicks / impressions), ${sd(ch.start)} to ${fmtD(ch.end)}. Gaps are days before a 7-day window exists, or with no impressions in that window. Click the row again to collapse.</div>`+tpanel(dd,'ctr',fmt,MC.ctr,200,{name:'7-day rolling CTR',xl:1})}

 $('inds').innerHTML=INDS.filter(k=>!(SEG!='All'&&k=='Retargeting')).map(k=>`<button class="${k==IND?'on':''}" onclick="setI('${k}')">${dotH(k)}${k}</button>`).join('');

 $('subs').innerHTML=sl?[['All','All '+IND]].concat(sl).map(([k,l])=>`<button class="${k==SUB?'on':''}" onclick="setS('${k}')">${k=='All'?'':dotH(SUBT[k])}${esc(l.split(' / ')[0])}</button>`).join(''):'';
 $('themes').innerHTML=`<div class="sh"><h2>${(SUB!='All'||IND=='Retargeting')?'Creative Performance by Ad':'Creative performance by theme'}</h2><span class="sc">${esc(scopeLabel())}, ${esc(p.label.toLowerCase())}</span></div>${kpis(cs)}${dailyChart()}${table(cs)}`;
 $('adsets').innerHTML=adsets();
 fatigue();
 syncNav();}
$('nlive').textContent=D.meta.live_camps;$('nhist').textContent=D.meta.hist_camps;$('thru').textContent=fmtD(D.meta.through);$('asof').textContent=D.meta.asof;
$('foot').innerHTML=`<li>LinkedIn Ads account 509859857, creative-level data. The tables include ads from live ad sets and from paused or completed ad sets that delivered in the selected period. Live = the ad is Active and serving in a live ad set. Status now reflects the ad's current status, not whether it ran in the period.</li>
<li>The Ad sets table lists currently live ad sets (campaign status Active and runnable) in the current segment and industry filter, plus paused or completed ad sets that had delivery in the selected period. Status is the ad set's current status: Active or Paused. Live ads = creatives that are Active, approved, and serving. Ads in review are not counted as live and appear in the hover, for example "2 in review." Spend and Cost/LP follow the selected period. On live ad sets, a red pill flags fewer than 3 live ads and an amber pill flags more than 6. The table is sorted with Active first, then Paused, each by spend descending.</li>
<li>Theme = concept code at the start of the ad name (OMEGA, WWTRA, WWTWA, STATS, SP, BULLETS, RT). Ads without a code are grouped by headline. The Retargeting view and sub-industry views list each ad on its own row.</li>
<li>Cost/LP = spend / landing page clicks. LP CTR = LP clicks / impressions. CTR = clicks / impressions. Prior = previous equal-length period (month to date: same days last month). Retargeting prior periods include the earlier retargeting ad set (01.28.26) and any older retargeting ads that delivered then.</li>
<li>The Daily performance chart always covers the last 60 days ending ${fmtD(D.meta.through)}, and uses six days before that so the first chart day has a full 7-day window. It follows the segment and industry filters, not the period pills. Rolling metrics use a 7-day window: Rolling LP clicks = LP clicks in the last 7 days, Rolling LP CTR = LP clicks in the last 7 days / impressions in the last 7 days, Rolling Cost/LP = spend in the last 7 days / LP clicks in the last 7 days, in whole dollars, and Rolling Spend = spend in the last 7 days, in whole dollars. Click one or more metric pills to plot them together, or All for every metric. Two or more metrics share one chart, each indexed to 100 at the start of the window; hover for actual values. There are no change or milestone markers when more than one metric is selected. On single-metric views, a compact marker is the ad's or ad set's first day with delivery for a launch, or last day with delivery for a pause (only if the ad is now paused or removed, or the ad set is no longer live). LinkedIn does not provide the exact pause time or objective/budget change history, so those are not invented. Nearby dates are merged when needed so labels never overlap. Hover a marker for the names of what changed.</li>`;
