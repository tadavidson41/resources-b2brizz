function markTipHtml(days){const d0=days[0].d,d1=days[days.length-1].d,multi=d0!==d1;const head=multi?rangeText(d0,d1):fmtD(d0);const buckets={camp:[],adset:[],adsetp:[],ads:[],adsp:[]};const add=(k,name,d)=>{const s=name+(multi?' ('+sd(d)+')':'');if(s&&!buckets[k].includes(s))buckets[k].push(s)};days.forEach(e=>{(e.ms||[]).forEach(it=>{if(it.t==='new_campaign')add('camp',it.short||it.name,e.d);else if(it.t==='new_adset')add('adset',it.short||it.name,e.d);else if(it.t==='adset_paused')add('adsetp',it.short||it.name,e.d)}); (e.ads||[]).forEach(it=>{const nm=pretty(it.n).t||it.n;if(it.a==='launched')add('ads',nm,e.d);else add('adsp',nm,e.d)})});const labs=[['camp','New campaigns'],['adset','New ad sets'],['adsetp','Ad sets paused'],['ads','New ads'],['adsp','Ads paused']];let h=`<div class="mh">${esc(head)}</div>`;labs.forEach(([k,l])=>{if(buckets[k].length)h+=`<div class="ml"><b>${l}:</b> ${esc(buckets[k].join(', '))}</div>`});return h}
function markKind(days){if(days.some(e=>(e.ms||[]).length))return 'ms';const hasN=days.some(e=>(e.ads||[]).some(it=>it.a==='launched'));const hasP=days.some(e=>(e.ads||[]).some(it=>it.a!=='launched'));return hasN&&hasP?'both':hasP?'paused':'new'}
function layoutMarks(events,L,R,W){events=events.slice().sort((a,b)=>a.d.localeCompare(b.d));if(!events.length)return [];
 const make=days=>{days=days.slice().sort((a,b)=>a.d.localeCompare(b.d));const d0=days[0].d,d1=days[days.length-1].d;const label=d0===d1?sd(d0):rangeText(d0,d1);const kind=markKind(days);const nd=kind==='both'?2:1;const w=Math.ceil(12+nd*9+String(label).length*6.4+10);const mid=days.reduce((s,e)=>s+e.x0,0)/days.length;let bx=mid-w/2;if(bx<L)bx=L;if(bx+w>W-R)bx=W-R-w;return {days,kind,label,w,mid,bx,x0s:days.map(e=>e.x0),html:markTipHtml(days)}};
 let raw=[];events.forEach(e=>{const last=raw[raw.length-1];if(last&&daysApart(last[last.length-1].d,e.d)<=3)last.push(e);else raw.push([e])});
 let groups=raw.map(make);
 let guard=0;while(guard++<24){let hit=-1;for(let i=0;i<groups.length-1;i++){if(!(groups[i].bx+groups[i].w+6<=groups[i+1].bx)&&daysApart(groups[i].days[groups[i].days.length-1].d,groups[i+1].days[0].d)<=3){hit=i;break}}if(hit<0)break;groups=groups.slice(0,hit).concat([make(groups[hit].days.concat(groups[hit+1].days))],groups.slice(hit+2))}
 for(let i=1;i<groups.length;i++){const minBx=groups[i-1].bx+groups[i-1].w+6;if(groups[i].bx<minBx){groups[i].bx=minBx;if(groups[i].bx+groups[i].w>W-R){groups[i].bx=W-R-groups[i].w;for(let j=i;j>=1;j--){if(groups[j-1].bx+groups[j-1].w+6<=groups[j].bx)break;groups[j-1].bx=Math.max(L,groups[j].bx-groups[j-1].w-6)}}}}
 return groups}
function tpanel(d,key,fmt,col,H,o){const W=1180,L=64,R=20,T=o.marks?42:14,B=o.xl?30:10;const n=d.length;const vals=d.map(r=>r[key]);const S=nice(1.1*Math.max(.0001,...vals.filter(v=>v!=null)));
 const bw=(W-L-R)/n;const x=i=>L+bw*i+bw/2;const y=v=>T+(H-T-B)*(1-v/S);let g='';
 for(let k=0;k<=4;k++){const yy=T+(H-T-B)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#ECECEC"/>`+TX(L-8,yy+4,fmt(S*(1-k/4)),{a:'end'})}
 const tip=(r)=>`${fmtD(r[0])}: ${o.name} ${r[key]==null?'n/a':fmt(r[key])}`;
 const pts=d.map((r,i)=>r[key]==null?null:[x(i),y(r[key])]).filter(Boolean);
 let line='';
 if(pts.length){const segs=[];let cur=[];pts.forEach((p,i)=>{cur.push(p);const nxt=pts[i+1];const broken=nxt&&Math.abs(nxt[0]-p[0])>bw*1.6;if(!nxt||broken){segs.push(cur);cur=[]}});
  line=segs.map(s=>s.length===1?'':`<polyline fill="none" stroke="${col}" stroke-width="2.2" stroke-dasharray="6 4" points="${s.map(p=>p.join(',')).join(' ')}"/>`).join('')}
 const body=line+d.map((r,i)=>r[key]==null?'':`<circle cx="${x(i)}" cy="${y(r[key])}" r="3" fill="${col}"><title>${esc(tip(r))}</title></circle>`).join('');
 let mk='';
 if(o.marks&&o.marks.length){const idx=s=>d.findIndex(r=>r[0]==s);const ev=[];o.marks.forEach(e=>{const i=idx(e.d);if(i<0)return;ev.push({...e,x0:x(i)})});
  const placed=layoutMarks(ev,L,R,W);const ly=18;
  placed.forEach(p=>{const st=MST[p.kind];const id=tipId(p.html);const evs=`onmouseenter="showMtip(event,'${id}')" onmouseleave="hideMtip()"`;
   mk+=`<g ${evs} style="cursor:pointer">`;
   (p.x0s||[]).forEach(x0=>{mk+=`<line x1="${x0}" x2="${x0}" y1="${ly+7}" y2="${H-B}" stroke="${st.line}" stroke-width="${p.kind==='ms'?1.6:1}" ${st.dash?`stroke-dasharray="${st.dash}"`:''} opacity=".7"/>`});
   mk+=`<rect x="${p.bx}" y="${ly-9}" width="${p.w}" height="16" rx="8" fill="${st.fill}" stroke="${st.stroke}"/>`;
   let dx=p.bx+8;st.dots.forEach(c=>{mk+=`<circle cx="${dx}" cy="${ly}" r="3.2" fill="${c}"/>`;dx+=9});
   mk+=`<text x="${dx+2}" y="${ly+3.5}" font-size="10" font-weight="700" fill="${st.ink}">${esc(p.label)}</text></g>`})}
 const step=Math.ceil(n/12);const lab=o.xl?d.map((r,i)=>i%step==0||i==n-1?TX(x(i),H-B+18,sd(r[0]),{a:'middle'}):'').join(''):'';
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.name)} by day">${g}${mk}${body}${lab}</svg>`}
function firstBase(d,key){for(let i=0;i<d.length;i++){const v=d[i][key];if(v!=null&&v>0)return v}return null}
function niceRange(lo,hi){if(!(hi>lo)){lo-=10;hi+=10}const step=nice((hi-lo)/4)||1;const y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;return {y0,y1,step}}
function allPanel(d,H){const W=1180,L=64,R=20,T=18,B=30;const n=d.length;const keys=['clk','ctr','cpc'];const base={};keys.forEach(k=>base[k]=firstBase(d,k));
 const idxOf=(r,k)=>r[k]==null||!base[k]?null:100*r[k]/base[k];
 const ys=d.flatMap(r=>keys.map(k=>idxOf(r,k)).filter(v=>v!=null));
 const lo=ys.length?Math.min(...ys):80,hi=ys.length?Math.max(...ys):120;const pad=(hi-lo)*0.12||10;let {y0,y1}=niceRange(Math.max(0,lo-pad),hi+pad);y0=Math.max(0,y0);
 const bw=(W-L-R)/n;const x=i=>L+bw*i+bw/2;const y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
 let g='';const ticks=4;for(let k=0;k<=ticks;k++){const v=y0+(y1-y0)*k/ticks,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#ECECEC"/>`+TX(L-8,yy+4,String(Math.round(v)),{a:'end'})}
 if(y0<100&&100<y1)g+=`<line x1="${L}" x2="${W-R}" y1="${y(100)}" y2="${y(100)}" stroke="#BDBDBD" stroke-dasharray="3 4"/>`+TX(L-8,y(100)+4,'100',{a:'end',c:'#6B6B6B'});
 g+=TX(L,12,'Index',{fs:10,c:'#8A8A8A'});
 const fmt={clk:v=>num(v),ctr:v=>(100*v).toFixed(2)+'%',cpc:v=>usd(v)};
 const names={clk:'Rolling clicks',ctr:'Rolling CTR',cpc:'Rolling CPC'};
 let body='';
 keys.forEach(k=>{const pts=d.map((r,i)=>{const v=idxOf(r,k);return v==null?null:[x(i),y(v)]});
  const segs=[];let cur=[];pts.forEach((p,i)=>{if(!p){if(cur.length){segs.push(cur);cur=[]}return}cur.push(p);const nxt=pts[i+1];if(!nxt||(nxt&&Math.abs(nxt[0]-p[0])>bw*1.6)){segs.push(cur);cur=[]}});
  body+=segs.map(s=>s.length===1?'':`<polyline fill="none" stroke="${MC[k]}" stroke-width="2.2" points="${s.map(p=>p.join(',')).join(' ')}"/>`).join('');
  body+=d.map((r,i)=>{const v=idxOf(r,k);return v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${MC[k]}"/>`}).join('')});
 MTIPS={};MTIPN=0;
 const hits=d.map((r,i)=>{const id=tipId(`<div class="mh">${esc(fmtD(r[0]))}</div>`+keys.map(k=>`<div class="ml"><i style="background:${MC[k]}"></i><b>${names[k]}:</b> ${r[k]==null?'n/a':fmt[k](r[k])}</div>`).join(''));return `<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" style="cursor:crosshair" onmouseenter="showMtip(event,'${id}')" onmouseleave="hideMtip()"/>`}).join('');
 const step=Math.ceil(n/12);const lab=d.map((r,i)=>i%step==0||i==n-1?TX(x(i),H-B+18,sd(r[0]),{a:'middle'}):'').join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Rolling clicks, CTR, and CPC, indexed to 100">${g}${body}${lab}${hits}</svg>`}
function chartPack(cs){const days=D.CDAYS;const n=days.length;const byd=days.map(()=>[0,0,0,0]);
 cs.forEach(c=>{const a=D.DLY[c.id];if(!a)return;a.forEach((v,i)=>{for(let k=0;k<4;k++)byd[i][k]+=v[k]})});
 const d=[];for(let i=6;i<n;i++){let s=0,im=0,cl=0;for(let j=i-6;j<=i;j++){s+=byd[j][0];im+=byd[j][1];cl+=byd[j][3]}d.push({0:days[i],clk:cl,ctr:im>0?cl/im:null,cpc:cl>0?s/cl:null,_i:im})}
 const a0=D.meta.chart[0],b0=D.meta.chart[1];const by={};const add=(day,k,it)=>{(by[day]=by[day]||{d:day,ads:[],ms:[]})[k].push(it)};
 cs.forEach(c=>{const s=SETBY[c.camp];const nm=D.NM[c.name].t+' ('+(s?s.short:c.aud)+')';
  if(c.first&&a0<=c.first&&c.first<=b0)add(c.first,'ads',{n:nm,a:'launched',camp:c.camp,created:c.created,first:c.first});
  const stopped=!c.live;if(stopped&&c.last&&a0<=c.last&&c.last<=b0)add(c.last,'ads',{n:nm,a:c.st=='PAUSED'?'paused':'adset_paused',camp:c.camp,last:c.last})});
 const camps=new Set(cs.map(c=>c.camp));const gseen=new Set();
 (D.SETS||[]).filter(s=>camps.has(s.id)).forEach(s=>{
  if(s.gcreated&&a0<=s.gcreated&&s.gcreated<=b0&&!gseen.has(s.gid)){gseen.add(s.gid);add(s.gcreated,'ms',{t:'new_campaign',short:D.GR[s.gid].name,name:D.GR[s.gid].name})}
  if(s.first&&a0<=s.first&&s.first<=b0)add(s.first,'ms',{t:'new_adset',short:s.short,name:s.name});
  if(!s.on&&s.last&&a0<=s.last&&s.last<=b0)add(s.last,'ms',{t:'adset_paused',short:s.short,name:s.name})});
 return {d,marks:Object.keys(by).sort().map(k=>by[k])}}
function dailyChart(cs){const pack=chartPack(cs);const dd=pack.d;
 const MET={clk:['clk',v=>v==null?'n/a':num(v),MC.clk,'Rolling clicks'],ctr:['ctr',v=>v==null?'n/a':(100*v).toFixed(2)+'%',MC.ctr,'Rolling CTR'],cpc:['cpc',v=>v==null?'n/a':usd(v),MC.cpc,'Rolling CPC']};
 MTIPS={};MTIPN=0;
 const one=(m,H,o)=>`<div style="font-size:12px;font-weight:600;color:var(--ink);margin:4px 0 0 4px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${m[2]};margin-right:6px"></i>${m[3]}</div>`+tpanel(dd,m[0],m[1],m[2],H,{name:m[3],marks:pack.marks,...o});
 const has=dd.some(r=>r._i>0);
 const inner=!has?`<div class="empty">No delivery in the last 60 days for this filter.</div>`:(DMODE==='all'?allPanel(dd,320):one(MET[DMODE]||MET.clk,300,{xl:1}));
 const tip='Single-metric views mark creative changes and milestones in the current filter. An ad is marked new on its first day with delivery, and marked paused on its last day with delivery only if the ad is no longer live. A new ad set is marked on its first day with delivery, and an ad set is marked paused or ended on its last day with delivery if it is no longer live. A new campaign group is marked on the day it was created. Objective and budget change history is not available from the LinkedIn API, so those are not marked. All three plots the three rolling metrics on one chart, each indexed to 100 at the start of the window; hover for actual values. Rolling metrics use a 7-day window. The chart always shows the last 60 days and follows the audience and format filters, not the period pills.';
 const pills=[['clk','Rolling clicks'],['ctr','Rolling CTR'],['cpc','Rolling CPC'],['all','All three']].map(([k,l])=>`<button class="${k==DMODE?'on':''}" onclick="setD('${k}')">${l}</button>`).join('');
 const vis=DMODE==='all'?['clk','ctr','cpc']:[DMODE];
 const metLeg=vis.map(k=>`<span><i style="background:${MET[k][2]}"></i>${MET[k][3]}</span>`).join('');
 const markLeg=DMODE==='all'?'':`<span><i style="background:#1d6b45;border-radius:50%"></i>New ads launched</span><span><i style="background:#b8261b;border-radius:50%"></i>Ads paused</span><span><i style="background:#336754;border-radius:50%"></i>Milestone</span><span>Hover a marker for what changed</span>`;
 const idxNote=DMODE==='all'?'<span>Each line is indexed to 100 at the start of the window. Hover for actual values.</span>':'';
 return `<div class="daily" id="daily"><div class="ch"><div><h2>Daily performance ${info(tip)}</h2><div class="desc">${sd(D.meta.chart[0])} to ${fmtD(D.meta.chart[1])} (last 60 days). Follows the audience and format filters, not the period pills.</div></div><div class="seg sm" id="dmode">${pills}</div></div><div class="chart" id="trend">${inner}</div><div class="legend">${metLeg}${markLeg}${idxNote}<span>Rolling metrics use a 7-day window.</span></div></div>`}
function fatChart(cid){const days=D.CDAYS.slice(6);const arr=D.ROLL[cid]||[];const dd=days.map((d,i)=>({0:d,ctr:arr[i]==null?null:arr[i]}));const has=dd.some(r=>r.ctr!=null);
 if(!has)return `<div class="empty">No 7-day rolling CTR window in the last 60 days for this ad.</div>`;
 const fmt=v=>v==null?'n/a':(100*v).toFixed(2)+'%';
 return `<div class="note" style="margin:0 0 8px">7-day rolling CTR (clicks / impressions), ${sd(D.meta.chart[0])} to ${fmtD(D.meta.chart[1])}. Gaps are days before a 7-day window exists, or with no impressions in that window. Click the row again to collapse.</div>`+tpanel(dd,'ctr',fmt,MC.ctr,200,{name:'7-day rolling CTR',xl:1})}
function render(){if(typeof hideMtip==='function')hideMtip();const p=D.periods[P];const cs=scopeC();
 $('pills').innerHTML=ORDER.map(k=>`<button class="${k==P?'on':''}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');
 $('range').textContent=`${sd(p.start)} to ${fmtD(p.end)} vs ${sd(p.prior.start)} to ${fmtD(p.prior.end)}`;
 $('auds').innerHTML=AUDS.map(k=>`<button class="${k==AUD?'on':''}" onclick="setA('${k}')">${dotH(k)}${k=='All Accounts'?'All Accounts (TLA)':k}</button>`).join('');
 $('fmts').innerHTML=FMTS.map(k=>`<button class="${k==FMT?'on':''}" onclick="setF('${k}')">${k}</button>`).join('');
 $('themes').innerHTML=`<div class="sh"><h2>${AUD!='All'?'Creative performance by ad':'Creative performance by concept'}</h2><span class="sc">${esc(scopeLabel())}, ${esc(p.label.toLowerCase())}</span></div>${kpis(cs)}${dailyChart(cs)}${table(cs)}`;
 $('adsets').innerHTML=adsets();
 fatigue()}
$('nlive').textContent=D.meta.live_camps;$('nhist').textContent=D.meta.hist_camps;$('thru').textContent=fmtD(D.meta.through);$('asof').textContent=D.meta.asof;
$('foot').innerHTML=`<li>LinkedIn Ads account 517356586 (Avarra, USD), creative-level data from the LinkedIn Ads API. First delivery in the account: ${fmtD(D.meta.first)}. The tables include ads from live ad sets and from paused or completed ad sets that delivered in the selected period. Live = the ad is Active and serving in a live ad set (ad set Active and runnable, campaign group Active). Status now reflects the ad's current status, not whether it ran in the period. Draft ads that never delivered are left out.</li>
<li>Concept = the ad name in Campaign Manager. The same concept usually runs in several ad sets (TAM, Enterprise, Medical Device, Cybersecurity); click a concept row to see each one. Picking an audience lists each ad on its own row. Thought Leader ads have no name in Campaign Manager and are labeled by author from the ad set name.</li>
<li>CTR = clicks / impressions. CPC = spend / clicks. CPM = spend / impressions x 1,000. Cost/LP = spend / landing page clicks. Engagements = LinkedIn total engagements. Video views = LinkedIn video views (2+ seconds), shown only when the view has video ads with views. Prior = previous equal-length period (month to date: same days last month). Spend, CPC, CPM, and Cost/LP are in whole dollars; CTR keeps two decimals; other percentages are whole numbers.</li>
<li>Conversions and lead form leads are not shown because the account recorded none in this period (no conversion tracking or lead gen forms on these ad sets). Preview images come from the ad source files; the video ad and the Thought Leader post have no preview because the API does not return an image for them.</li>
<li>The Daily performance chart always covers the last 60 days ending ${fmtD(D.meta.through)}, and uses six days before that so the first chart day has a full 7-day window. Rolling clicks = clicks in the last 7 days, Rolling CTR = clicks / impressions in the last 7 days, Rolling CPC = spend / clicks in the last 7 days. LinkedIn does not provide exact pause times or budget change history, so those are not invented.</li>
<li>Creative fatigue compares each ad's CTR in the last 14 days with its own first 14 days of delivery, in fixed windows that do not follow the period pills. Flagged = a drop of 30% or more, Watch = 20 to 30%, with 1,000+ impressions required in both windows.</li>`;
render();
