function exportReachSeries(rows){

  const dates=[];
  const add=end=>{if(end&&dates.indexOf(end)<0)dates.push(end)};
  rows.forEach(r=>{
    (r.trend||[]).forEach(p=>add(p&&p.end));
    (r.pct_points||[]).forEach(p=>{if(p&&(p.source==='export'||p.source==='baseline'))add(p.end)});
  });

  return dates.map(end=>{
    let rch=0,n=0,src=null;
    rows.forEach(row=>{
      let p=(row.trend||[]).find(x=>x.end===end);
      if(!p){
        p=(row.pct_points||[]).find(x=>x.end===end && (x.source==='export'||x.source==='baseline'));
      }

}

function reachChart(){

  let y1=Math.min(100, Math.ceil((maxV+6)/5)*5);

  const ticks=4;
  for(let k=0;k<=ticks;k++){
    const v=y0+(y1-y0)*k/ticks,yy=y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#ECECEC"/>`+TX(L-6,yy+4,Math.round(v)+'%',{a:'end'});

  });

  const minLab=narrow?14:16;

  const pctKept=placeReachLabels(pctItems, minLab);

  const pctLabs=bars.map(p=>{
    const bump=keptIdx[p.i]?0:(p.i%2===0?-10:10);

  }).join('');

    lab=bars.map(p=>`<text x="0" y="0" transform="translate(${p.cx.toFixed(1)},${H-B+10}) rotate(-90)" text-anchor="end" fill="#0D062B" font-size="10">${esc(p.short||p.axis||p.label)}</text>`).join('');
  }else{
    const axItems=bars.map(p=>({x:p.cx,label:p.axis||p.short||p.label,pri:p.partial||p.i===0||p.i===bars.length-1?90:40,i:p.i}));

      return TX(it.x,H-B+16,it.label,{a});
    }).join('');
  }
  window._REACHCHART={series:bars,W,L,R};
  const hit=bars.map((p,i)=>{
    const hw=Math.max(18, slot);
    return `<rect data-i="${i}" x="${(p.cx-hw/2).toFixed(1)}" y="${T-8}" width="${hw.toFixed(1)}" height="${H-T-B+8}" fill="transparent" style="cursor:crosshair"/>`;
  }).join('');
  return `<div class="chart reach-chart" id="reachTrend"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Account reach percent" onmousemove="reachChartMove(event)" onmouseleave="reachChartLeave()">${g}${rects}${pctLabs}${lab}${hit}</svg><div class="ltip" id="rtip"></div></div>`;
}
function reachChartMove(ev){

 const body=rows.map((r,i)=>`<tr><td class="al">${i+1}. ${esc(r.name)}</td><td class="n">${num(r.impr)}</td><td class="n">${num(r.clicks)}</td><td class="n">${num(r.lp)}</td><td class="n">${r.impr>0?(100*r.clicks/r.impr).toFixed(2)+'%':'-'}</td></tr>`).join('');
 return `<div class="lists lists-compact co-table" id="lists">${scope}<div class="note" style="margin:0 0 8px">Top ${rows.length} companies by paid impressions, ${sd(R.window[0])} to ${fmtD(R.window[1])}. Only companies with 3+ paid impressions count as reached.</div><div class="tw"><table><thead><tr><th class="al">Company</th><th class="n">Impressions</th><th class="n">Clicks</th><th class="n">Landing<br>page clicks</th><th class="n">CTR</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function render(){if(typeof hideMtip==='function')hideMtip();const p=D.periods[P];const rows=scoped();
 $('pills').innerHTML=ORDER.map(k=>`<button class="${k==P?'on':''}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');
 const pr=p.prior||{start:p.prior_start,end:p.prior_end};
 $('range').textContent=`${sd(p.start)} to ${fmtD(p.end)} vs ${sd(pr.start)} to ${fmtD(pr.end)}`;
 if(0)$('segs').innerHTML=[['All','All'],['ENT','ENT'],['GRW','GRW']].map(([k,l])=>`<button class="${k==SEG?'on':''}" onclick="setG('${k}')" title="${k=='All'?'Enterprise, Growth and Retargeting':SEGT[k]+' ad sets only'}">${l}</button>`).join('');
 $('inds').innerHTML=INDS.map((k,i)=>`<button class="${k==IND?'on':''}" onclick="setIx(${i})">${dotH(k)}${esc(k)}</button>`).join('');
 const sl=SUBS[IND];$('subs').style.display=sl?'':'none';
 $('subs').innerHTML=sl?[['All','All '+IND]].concat(sl).map(([k,l])=>`<button class="${k==SUB?'on':''}" onclick="setS('${k}')">${k=='All'?'':dotH(SUBT[k])}${esc(l.split(' / ')[0])}</button>`).join(''):'';
 const title=campView()?'Campaign group performance':'Ad set performance';
 $('main').innerHTML=`<div class="sh"><h2>${title}</h2><span class="sc">${esc(scopeLabel())}, ${esc(p.label.toLowerCase())}</span></div>${kpis(rows)}${dailyChart()}${topCompanies()}${table()}`;
 syncNav();
}
$('nlive').textContent=(D.meta&&D.meta.live_camps!=null)?D.meta.live_camps:'';
$('nhist').textContent=(D.meta&&D.meta.hist_camps!=null)?D.meta.hist_camps:'';
$('thru').textContent=fmtD((D.meta&&D.meta.through)||D.asof);
$('asof').textContent=(D.meta&&D.meta.asof)||D.asof_label;
$('foot').innerHTML=`<li>LinkedIn Ads account ${esc(D.account)} (Jellyfish), live LinkedIn Marketing API data through ${fmtD((D.meta&&D.meta.through)||D.asof)}, the last completed UTC day. The All view lists campaign groups. Choose a campaign group to see its ad sets. Tables include live ad sets and paused or completed ad sets that delivered in the selected period. Status is the ad set's current status: Active (ACTIVE and serving) or Paused.</li>
<li>Spend, budgets, Cost/LP, and CPM are whole dollars. Cost/LP = spend / landing page clicks. LP CTR = landing page clicks / impressions, shown to two decimals. Prior = previous equal-length period (month to date: same days last month). Period comparisons are whole percents. Dwell is the period average, shown to one decimal second. Audience size is current targeting from LinkedIn audienceCounts as of the pull, not a historical size for the period. Reach is approximate member reach for the selected period (not a sum of daily reach). Audience penetration = period reach / current audience size, as a whole percent. Campaign group rows do not show reach, audience size, or penetration because those are not de-duplicated across ad sets.</li>
<li>Companies reached counts unique companies (MEMBER_COMPANY) with 3+ paid impressions in the selected period, for the whole account or the selected campaign group. Company reach (90 days) uses the same 3+ paid impressions rule over the last 90 days, compared with the 90 days before that, and does not follow the period pills. Top companies reached lists the companies with the most paid impressions in the last 90 days, by company name.</li>
<li>The Daily performance chart always covers the last 60 days ending ${fmtD((D.meta&&D.meta.through)||D.asof)}, and uses six days before that so the first chart day has a full 7-day window. Rolling LP clicks = LP clicks in the last 7 days, Rolling LP CTR = LP clicks / impressions in the last 7 days, Rolling Cost/LP = spend / LP clicks in the last 7 days, and Rolling Spend = spend in the last 7 days. Two or more metrics share one chart, each indexed to 100 at the start of the window; hover for actual values. On single-metric views, a marker is an ad set's first day with delivery (launch), its last day with delivery if it is no longer live (pause), or a new campaign group. LinkedIn does not provide objective or daily budget change history, so those are not marked. It follows the campaign group filter, not the period pills.</li>
<li>Last business day spend is spend on ${D.last_biz_day_label}. Daily budget and objective are current ad set values at pull time.</li>`;
render();
