  }else{

 const W=window._LISTCHART.W||sr.width,L=window._LISTCHART.L||54,R=window._LISTCHART.R||12;
 const px=(ev.clientX-sr.left)/Math.max(1,sr.width)*W;
 let i=0,best=1e9;
 ends.forEach((e,k)=>{const xx=L+k*((W-L-R)/Math.max(1,ends.length-1));const d=Math.abs(px-xx);if(d<best){best=d;i=k}});
 const end=ends[i];
 const rows=series.map(s=>{const p=(s.points||[]).find(x=>x.end===end);return {label:s.label,v:p&&p.n!=null?p.n:null,color:s.color}}).filter(x=>x.v!=null);
 const sumFirst=rows.filter(x=>x.label&&x.label.indexOf('All lists')===0);
 const rest=rows.filter(x=>!(x.label&&x.label.indexOf('All lists')===0));
 const shown=sumFirst.concat(rest);
 tip.innerHTML=`<div class="mh">${esc(fmtD(end))}</div>`+shown.map(x=>`<div class="mr"><span>${esc(x.label)}</span><b>${num(x.v)}</b></div>`).join('');
 tip.style.display='block';
 const tw=tip.offsetWidth||200,th=tip.offsetHeight||80;
 let left=ev.clientX-r.left+12, top=ev.clientY-r.top+12;
 if(left+tw>r.width-8)left=Math.max(8,ev.clientX-r.left-tw-12);
 if(top+th>r.height-8)top=Math.max(8,ev.clientY-r.top-th-12);
 tip.style.left=left+'px';tip.style.top=top+'px';
}
function listChartLeave(){const tip=$('ltip');if(tip)tip.style.display='none'}

function vsBaseLine(vs){
 if(!vs||vs.from_pct==null||vs.to_pct==null)return '';
 const pts=vs.pts;
 const ptsH=pts===0?'0 pts':((pts>0?'+':'')+pts+' pts');
 const cls=pts>0?'up':(pts<0?'dn':'');
 return `<div class="lbase ${cls}">vs Oct 6 baseline: ${vs.from_pct}% to ${vs.to_pct}% (${ptsH})</div>`;
}
function pctChart(series, opts){
 opts=opts||{};
 const H=opts.H||180;
 const ends=[];
 series.forEach(s=>(s.points||[]).forEach(p=>{if(p&&p.end&&ends.indexOf(p.end)<0)ends.push(p.end)}));
 ends.sort();
 const valAt=(s,end)=>{const p=(s.points||[]).find(x=>x.end===end);return p&&p.pct!=null?p.pct:null};
 const vals=series.flatMap(s=>ends.map(e=>valAt(s,e))).filter(v=>v!=null);
 if(!ends.length||!vals.length)return '';
 const host=$('main')||document.body;
 const W=Math.max(220, Math.round(opts.W||((host&&host.clientWidth)||(window.innerWidth-48))));
 const L=36,R=8,T=12,B=28;
 const minV=Math.min(...vals), maxV=Math.max(...vals);
 let y0=Math.max(0, Math.floor((minV-12)/5)*5);
 let y1=Math.min(100, Math.ceil((maxV+12)/5)*5);
 if(y1-y0<20){y0=Math.max(0,y0-10);y1=Math.min(100,y1+10)}
 const y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0||1));
 const x=i=>L+i*((W-L-R)/Math.max(1,ends.length-1));
 const ticks=H<160?2:4;
 let g='';
 for(let k=0;k<=ticks;k++){
  const v=y0+(y1-y0)*k/ticks,yy=y(v);
  g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#ECECEC"/>`+TX(L-6,yy+4,Math.round(v)+'%',{a:'end'});
 }
 const lab=ends.map((e,i)=>TX(x(i),H-B+16,sd(e),{a:i===0?'start':i===ends.length-1?'end':'middle'})).join('');
 let body='';
 series.forEach(s=>{
  const pts=ends.map((e,i)=>{const v=valAt(s,e);return v==null?null:[x(i),y(v)]});
  const segs=[];let cur=[];
  pts.forEach(pt=>{if(!pt){if(cur.length){segs.push(cur);cur=[]}return}cur.push(pt)});
  if(cur.length)segs.push(cur);
  const sw=s.thick?2.6:1.8;
  segs.forEach(seg=>{const d=seg.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ');body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linejoin="round"/>`});
  pts.forEach(pt=>{if(pt) body+=`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="${s.thick?3.2:2.4}" fill="${s.color}"/>`});
 });
 const slot=(W-L-R)/Math.max(1,ends.length-1);
 const hit=ends.map((e,i)=>`<rect data-i="${i}" x="${(x(i)-slot/2).toFixed(1)}" y="${T}" width="${Math.max(slot,16).toFixed(1)}" height="${H-T-B}" fill="transparent"/>`).join('');
 window._PCTCHARTS=window._PCTCHARTS||{};
 const cid='c'+(window._PCTSEQ=(window._PCTSEQ||0)+1);
 window._PCTCHARTS[cid]={ends,series,W,L,R};
 return `<svg data-pct="${cid}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label||'Account reach percent')}" onmousemove="pctChartMove(event)" onmouseleave="pctChartLeave(event)">${g}${body}${lab}${hit}</svg>`;
}
function pctChartMove(ev){
 const svg=ev.currentTarget;const st=window._PCTCHARTS&&window._PCTCHARTS[svg.getAttribute('data-pct')];
 const box=svg.closest('.lchart')||svg.closest('.lpct')||svg;const tip=(box&&box.querySelector('.ltip'))||$('ptip')||$('ltip');
 if(!tip||!st)return;
 const {ends,series}=st;
 const sr=svg.getBoundingClientRect();const r=box.getBoundingClientRect();
 const W=st.W||sr.width,L=st.L||36,R=st.R||8;
 const px=(ev.clientX-sr.left)/Math.max(1,sr.width)*W;
 let i=0,best=1e9;
 ends.forEach((e,k)=>{const xx=L+k*((W-L-R)/Math.max(1,ends.length-1));const d=Math.abs(px-xx);if(d<best){best=d;i=k}});
 const end=ends[i];
 const rows=series.map(s=>{const p=(s.points||[]).find(x=>x.end===end);return {label:s.label,v:p&&p.pct!=null?p.pct:null,reached:p&&p.reached,n:p&&p.list_companies}}).filter(x=>x.v!=null);
 tip.innerHTML=`<div class="mh">${esc(fmtD(end))}</div>`+rows.map(x=>`<div class="mr"><span>${esc(x.label)}</span><b>${x.v}%${x.reached!=null&&x.n?` (${num(x.reached)} of ${num(x.n)})`:''}</b></div>`).join('');
 tip.style.display='block';
 const tw=tip.offsetWidth||200,th=tip.offsetHeight||80;
 let left=ev.clientX-r.left+12, top=ev.clientY-r.top+12;
 if(left+tw>r.width-8)left=Math.max(8,ev.clientX-r.left-tw-12);
 if(top+th>r.height-8)top=Math.max(8,ev.clientY-r.top-th-12);
 tip.style.left=left+'px';tip.style.top=top+'px';
}
function pctChartLeave(ev){const box=ev&&ev.currentTarget&&(ev.currentTarget.closest('.lchart')||ev.currentTarget.closest('.lpct'));const tip=(box&&box.querySelector('.ltip'))||$('ptip')||$('ltip');if(tip)tip.style.display='none'}
function listPctChart(lists, total){
 const listsS=lists.filter(r=>(r.pct_points||[]).length).map((r,i)=>({id:r.id,label:r.label||r.name||r.id,color:r.color||listColor(i),points:r.pct_points||[],thick:0}));
 const sumPts=(total&&total.pct_points)||[];
 const sumS=sumPts.length?[{id:'all-pct',label:'All lists',color:'#111111',points:sumPts,thick:1}]:[];
 const series=listsS.concat(sumS);
 if(!series.length)return '';
 const legend=series.map(s=>{
  const last=(s.points||[]).slice().reverse().find(p=>p&&p.pct!=null);
  return `<span><i style="background:${s.color}${s.thick?';height:3px;border-radius:1px':''}"></i>${esc(s.label)}${last?` · ${last.pct}%`:''}</span>`;
 }).join('');
 return `<div class="lchart lchart-pct"><div class="lchart-cap">Account reach %</div>${pctChart(series,{H:220,label:'Account reach percent'})}<div class="ltip" id="ptip"></div><div class="lleg">${legend}</div></div>`;
}
function pctSpark(points){
 if(!points||points.length<1)return '';
 const series=[{id:'one',label:'Account reach',color:'#336754',points:points,thick:1}];
 const first=points[0]&&points[0].end?sd(points[0].end):'';
 const last=points[points.length-1]&&points[points.length-1].end?sd(points[points.length-1].end):'';
 const iw=window.innerWidth||390;
 const cols=iw<=700?1:(iw<=1100?2:3);
 const host=$('main')||document.body;
 const avail=Math.round((host&&host.clientWidth)||iw)-28;
 const cardW=Math.max(220, Math.round(avail/cols - (cols>1?12:0) - 28));
 return `<div class="lpct"><div class="lpct-cap">Account reach %</div>${pctChart(series,{H:120,W:cardW,label:'Account reach percent'})}<div class="ltip"></div></div>`;
}
function combinedPctFromRows(ar){
 const dates=[];
 ar.forEach(r=>(r.pct_points||[]).forEach(p=>{if(p&&p.end&&dates.indexOf(p.end)<0)dates.push(p.end)}));
 dates.sort();
 const pct_points=dates.map(end=>{
  let rch=0,n=0,src=null;
  ar.forEach(row=>{
   const p=(row.pct_points||[]).find(x=>x.end===end);
   if(p&&p.reached!=null&&p.list_companies){rch+=p.reached;n+=p.list_companies;src=src||p.source}
  });
  return n?{end,source:src,pct:Math.round(100*rch/n),reached:rch,list_companies:n}:null;
 }).filter(Boolean);
 let baseline=null;
 const withB=ar.filter(r=>r.baseline&&r.baseline.list_companies);
 if(withB.length===ar.length&&ar.length){
  const rch=withB.reduce((s,x)=>s+x.baseline.reached,0);
  const n=withB.reduce((s,x)=>s+x.baseline.list_companies,0);
  baseline={end:withB[0].baseline.end,reached:rch,list_companies:n,pct:Math.round(100*rch/n)};
 }
 const latest=pct_points.filter(p=>p.source==='export').slice(-1)[0]||pct_points[pct_points.length-1];
 const vs=(baseline&&latest&&latest.pct!=null)?{from_pct:baseline.pct,to_pct:latest.pct,pts:latest.pct-baseline.pct,from_end:baseline.end,to_end:latest.end}:null;
 return {pct_points,baseline,vs_baseline:vs};
}

function isNarrow(){return window.innerWidth<=700}
function listShortLabel(r){
  const full=r.label||r.name||r.id||'';
  const ind=r.industry||'';
  const tier=r.tier==='Enterprise'?'ENT':(r.tier==='Growth'?'GRW':'');
  const subMap={'Beauty':'Beauty','Food & Bev':'Food & Bev','Supplements / Hygiene / Baby / Pet':'Supp','Apparel / Jewelry & Accessories':'','Electronics / Fitness / Sporting / Outdoor / Home':'','SaaS / Mid-market B2B':''};
  const sub=r.sub||'';
  const ss=Object.prototype.hasOwnProperty.call(subMap,sub)?subMap[sub]:(sub?String(sub).split(' / ')[0]:'');
  const peers=(accountLists()||[]).filter(x=>x.industry===r.industry&&x.tier===r.tier);
  const needSub=!!(ss&&peers.length>1);
  const parts=[ind,tier].filter(Boolean);
  if(needSub)parts.push(ss);
  return parts.length?parts.join(' '):full;
}
function listCoverage(){
 const rows=accountLists();
 const scope=`<div class="sh"><h2>Account lists</h2><span class="sc">${esc(scopeLabel())}</span></div>`;
 const empty=reachEmptyMessage();
 if(!rows.length){
  if(!empty)return '';
  return `<div class="lists lists-compact" id="lists">${scope}<div class="empty">${esc(empty)}</div></div>`;
 }
 const body=rows.map(r=>{
  const vs=r.vs_baseline;
  const pts=vs&&vs.pts!=null?vs.pts:null;
  const ptsH=pts==null?'–':(pts===0?'0 pts':((pts>0?'+':'')+pts+' pts'));
  const cls=pts>0?'up':(pts<0?'dn':'');
  const reach=r.pct!=null?`${r.pct}%${r.n!=null&&r.list_companies?`<div class="vdesc">${num(r.n)} of ${num(r.list_companies)}</div>`:''}`:'–';
  const full=r.label||r.name||r.id||'';
  const label=isNarrow()?listShortLabel(r):full;
  return `<tr><td class="al" title="${esc(full)}">${esc(label)}</td><td class="n">${reach}</td><td class="n">${pts==null?'–':`<span class="${cls}">${ptsH}</span>`}</td></tr>`;
 }).join('');
 return `<div class="lists lists-compact" id="lists">${scope}<div class="tw"><table><thead><tr><th class="al">List</th><th class="n">Account reach</th><th class="n">vs Oct 6</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

 $('pills').innerHTML=ORDER.map(k=>`<button class="${k==P?'on':''}" onclick="setP('${k}')">${D.periods[k].label}</button>`).join('');
 const pr=p.prior||{start:p.prior_start,end:p.prior_end};
 $('range').textContent=`${sd(p.start)} to ${fmtD(p.end)} vs ${sd(pr.start)} to ${fmtD(pr.end)}`;
 $('segs').innerHTML=[['All','All'],['ENT','ENT'],['TAM','TAM']].map(([k,l])=>`<button class="${k==SEG?'on':''}" onclick="setG('${k}')" title="${k=='All'?'All ad sets, including industry and thought leader ad sets that are not split by segment':SEGT[k]+' ad sets only'}">${l}</button>`).join('');
 $('inds').innerHTML=indsFor(SEG).map(k=>`<button class="${k==IND?'on':''}" onclick="setI('${k}')">${dotH(k)}${k}</button>`).join('');
 const sl=SUBS[IND];$('subs').style.display=sl?'':'none';
 $('subs').innerHTML=sl?[['All','All '+IND]].concat(sl).map(([k,l])=>`<button class="${k==SUB?'on':''}" onclick="setS('${k}')">${k=='All'?'':dotH(SUBT[k])}${esc(l.split(' / ')[0])}</button>`).join(''):'';
 const title=campView()?'Campaign performance':'Ad set performance';
 $('main').innerHTML=`<div class="sh"><h2>${title}</h2><span class="sc">${esc(scopeLabel())}, ${esc(p.label.toLowerCase())}</span></div>${kpis(rows)}${dailyChart()}${table()}`;
 syncNav();
}
$('nlive').textContent=(D.meta&&D.meta.live_camps!=null)?D.meta.live_camps:'';
$('nhist').textContent=(D.meta&&D.meta.hist_camps!=null)?D.meta.hist_camps:'';
$('thru').textContent=fmtD((D.meta&&D.meta.through)||D.asof);
$('asof').textContent=(D.meta&&D.meta.asof)||D.asof_label;
$('foot').innerHTML=`<li>LinkedIn Ads account 517356586 (Avarra, USD). The All view lists campaigns (campaign groups). Choose ENT, TAM, or an industry to see ad set rows. ENT and TAM are the Enterprise Accounts and TAM Accounts ad sets in the LinkedIn Ads 2026 campaign. Industry is Cross-industry for those ad sets, and Cybersecurity, Medical Device, or Thought Leaders for the vertical and thought leader campaigns, which are not split by segment. Tables include live ad sets and paused or completed ad sets that delivered in the selected period. Status is the ad set's current status: Active (ACTIVE and serving) or Paused.</li>
<li>Cost/LP = spend / landing page clicks, in whole dollars. LP CTR = landing page clicks / impressions, shown to two decimals. Prior = previous equal-length period (month to date: same days last month). Period comparisons are whole percents. Dwell is the period average, shown to one decimal second. Audience size is current targeting from LinkedIn audienceCounts as of ${D.aud_pulled}, not a historical size for the period. Reach is approximate member reach for the selected period (not a sum of daily reach). Audience penetration = period reach / current audience size, as a whole percent. Campaign-level reach, audience size, and penetration are not shown because those metrics are not de-duplicated across ad sets.</li>
<li>Companies reached counts unique companies with impressions in the period (MEMBER_COMPANY, all-period granularity), pulled separately for every segment and industry filter and every period, so filtered counts are true unique counts.</li>

<li>The Daily performance chart always covers the last 60 days ending ${fmtD((D.meta&&D.meta.through)||D.asof)}, and uses six days before that so the first chart day has a full 7-day window. Rolling metrics use a 7-day window: Rolling LP clicks = LP clicks in the last 7 days, Rolling LP CTR = LP clicks in the last 7 days / impressions in the last 7 days, Rolling Cost/LP = spend in the last 7 days / LP clicks in the last 7 days, in whole dollars, and Rolling Spend = spend in the last 7 days, in whole dollars. Click one or more metric pills to plot them together, or All for every metric. Two or more metrics share one chart, each indexed to 100 at the start of the window; hover for actual values. There are no change or milestone markers when more than one metric is selected. On single-metric views, a compact marker is an ad set's first day with delivery for a launch, or last day with delivery for a pause (only if the ad set is no longer live), or a new campaign (campaign group) if one launched in the window. LinkedIn does not provide objective or daily budget change history, so those are not marked. Nearby dates are merged when needed so labels never overlap. Hover a marker for the names of what changed.</li>
<li>Last business day spend is spend on ${D.last_biz_day_label}. Daily budget and objective are current campaign-entity values at pull time. LinkedIn reports in UTC days; data runs through the last completed UTC day and never includes today.</li>`;
render();

window.addEventListener('resize',()=>{clearTimeout(_listRz);_listRz=setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y);},180)});
