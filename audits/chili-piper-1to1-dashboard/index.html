<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chili Piper | 1-to-1 ABM Performance</title><meta name="robots" content="noindex">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f7f5f0;--card:#fff;--bd:#e8e4db;--bd2:#f0ede6;--ink:#141a33;--mut:#5f6478;--mut2:#8b90a3;--or:#ff5721;--pu:#5b3fd6;--pu2:#f0ecfd;--pu3:#d9d0fa;--gr:#137a3a;--grb:#e6f4ea;--am:#9a5b00;--amb:#fff3dc;--amI:#f0a000;--rd:#b8261b;--rdb:#fdebe9}
*{box-sizing:border-box}html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--pu)}button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.hd{background:var(--card);border-bottom:1px solid var(--bd)}
.hd .wrap{display:flex;align-items:center;gap:18px;padding-top:14px;padding-bottom:0;flex-wrap:wrap}
.hd img{height:32px;display:block}
.hd .tt{flex:1;min-width:260px}
.hd h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.hd .dm{color:var(--mut);font-size:12.5px;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.hd .dm b{color:var(--ink);font-weight:600}
.int{border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut);background:var(--bg)}
.tabs{display:flex;gap:26px;width:100%;margin-top:12px}
.tabs button{background:none;border:0;padding:10px 0 11px;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;font-size:14.5px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--or)}
.tabs button:hover{color:var(--ink)}
.prow{position:sticky;top:0;z-index:20;background:rgba(247,245,240,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--bd)}
.prow .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.plab{font-weight:600;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap}
.seg button.on{background:var(--pu);color:#fff;font-weight:600}
.seg button:not(.on):hover{background:var(--pu2)}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.rng{font-size:13px;color:var(--ink);font-weight:500}.vs{font-size:12.5px;color:var(--mut)}
.pnote{font-size:12.5px;color:var(--am);background:var(--amb);border-radius:6px;padding:3px 8px}
main{padding:18px 0 40px}
.subnav{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--bd)}
.subnav button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--pu);border-bottom-color:var(--pu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,26,51,.03)}
.card h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3{font-size:14.5px;margin:0;font-weight:600}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.desc{color:var(--mut);font-size:12.5px;margin-top:3px;font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g21{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:960px){.g2,.g3,.g21{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi.em{border:1.5px solid var(--pu);box-shadow:0 0 0 3px var(--pu2)}
.kpi .l{font-size:13px;font-weight:500;color:var(--ink)}
.kpi .v{font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
.kpi .c{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .pr{font-size:12px;color:var(--mut2);margin-top:2px}
.up,.dn,.nt{font-weight:600}.good{color:var(--gr)}.bad{color:var(--rd)}.neu{color:var(--ink)}
.ac{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;font-size:15px}
.ic.r{background:var(--rd)}.ic.a{background:var(--amI)}.ic.g{background:var(--gr)}
.ac .v{font-size:22px;font-weight:700;line-height:1.1}.ac .l{font-size:13px}.ac .w{font-size:11.5px;color:var(--mut);margin-top:2px}
.ac .lk{margin-left:auto;white-space:nowrap;font-size:13px;font-weight:600;background:none;border:0;color:var(--pu);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ac .ok{margin-left:auto;font-size:12.5px;color:var(--mut)}
.link{background:none;border:0;color:var(--pu);cursor:pointer;font-weight:600;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.btn2{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--ink);white-space:nowrap}
.btn2:hover{border-color:var(--pu3);background:var(--pu2)}
.cvs{display:grid;grid-template-columns:1fr 2fr;gap:14px}
@media(max-width:860px){.cvs{grid-template-columns:1fr}}
.pop{border:1px solid var(--bd2);background:#fbfaf7;border-radius:10px;padding:12px 14px}
.pop .pl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
.pop .big{font-size:22px;font-weight:700;margin:4px 0 2px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}.stats div{font-size:12.5px;color:var(--mut)}.stats b{display:block;font-size:18px;color:var(--ink)}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:10px}
.tw.sc{max-height:560px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:#faf8f4;z-index:2;text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}th.n,td.n{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--bd2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fcfbf8}
tr.tot td{font-weight:600;background:#faf8f4;border-top:1px solid var(--bd)}
td.co{font-weight:600;min-width:150px}td.co a{color:var(--ink);text-decoration:none}td.co a:hover{color:var(--pu);text-decoration:underline}
.xp{background:none;border:0;cursor:pointer;color:var(--mut);padding:0 6px 0 0;font-size:12px;width:18px}
tr.det td{background:#fbfaf7;font-size:12.5px;color:var(--mut)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px}.dg b{color:var(--ink);font-weight:600;display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-g{background:var(--grb);color:var(--gr)}.p-a{background:var(--amb);color:var(--am)}.p-r{background:var(--rdb);color:var(--rd)}.p-n{background:#f0efec;color:var(--mut)}.p-p{background:var(--pu2);color:var(--pu)}
.tag{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:1px}
.t-ret{background:#f0efec;color:var(--mut)}.t-par{background:var(--pu2);color:var(--pu)}
.gv{color:var(--gr);font-weight:600}.rv{color:var(--rd);font-weight:600}
.gv::after{content:" \2713";font-size:11px}.rv::after{content:" !";font-size:11px}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tb input[type=search]{border:1px solid var(--bd);border-radius:8px;padding:7px 11px;min-width:240px;font:inherit;font-size:13px;background:#fff}
.tb select{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fff;max-width:230px}
.tb .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;min-height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pu3);background:var(--pu2);color:var(--pu);border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;font-weight:500}
.chip button{border:0;background:none;color:var(--pu);cursor:pointer;font-size:14px;line-height:1;padding:0 3px}
.sel{font-size:12.5px;color:var(--mut);margin-bottom:8px}.sel b{color:var(--ink);font-weight:600}
.notice{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.notice.ni{background:var(--pu2);color:#2e2470;border:1px solid var(--pu3)}.notice.nw{background:var(--amb);color:#5c3800;border:1px solid #f4d9a6}
.notice .nb{font-weight:700;flex:none}
.cols{position:relative}.cols summary{list-style:none}.cols summary::-webkit-details-marker{display:none}
.cols .menu{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;z-index:30;box-shadow:0 8px 24px rgba(20,26,51,.12);min-width:200px}
.cols label{display:block;font-size:13px;padding:3px 0;white-space:nowrap}
details.def{margin-top:10px;font-size:12.5px;color:var(--mut)}details.def summary{cursor:pointer;color:var(--pu);font-weight:600;font-size:12.5px}details.def[open] summary{margin-bottom:6px}
details.def p{margin:4px 0}
.i{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--mut2);color:var(--mut);font-size:11px;font-weight:700;cursor:help;position:relative;font-style:normal}
.i .tip{display:none;position:absolute;left:50%;top:22px;transform:translateX(-50%);width:320px;background:var(--ink);color:#fff;font-weight:400;font-size:12px;line-height:1.45;padding:9px 11px;border-radius:8px;z-index:40;text-align:left}
.i:hover .tip,.i:focus .tip{display:block}
.chart svg{display:block}
.legend{font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:6px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.snap td{padding:7px 8px}
.crs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:1000px){.crs{grid-template-columns:repeat(2,1fr)}}
.cr{border:1px solid var(--bd2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cr img{width:100%;height:120px;object-fit:cover;object-position:top;border-radius:7px;cursor:zoom-in;border:1px solid var(--bd2)}
.cr .vn{font-weight:600;font-size:13px}.cr .vd{font-size:11.5px;color:var(--mut)}
.cr .m{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.cr .m div{font-size:11px;color:var(--mut)}.cr .m b{display:block;font-size:14px;color:var(--ink)}
.thumb{width:132px;height:88px;object-fit:cover;object-position:top;border-radius:7px;border:1px solid var(--bd);cursor:zoom-in;display:block}
.thumb:hover{outline:2px solid var(--pu3)}
.vlab{font-weight:600}.vdesc{font-size:12px;color:var(--mut);margin-top:2px;max-width:200px}
tr.leg td{background:#fbfaf7;cursor:pointer}tr.kid td{background:#fdfcfa}tr.kid td:first-child{padding-left:28px}
th.grp{text-align:center;background:#f4f1ea;color:var(--ink);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-left:1px solid var(--bd)}
th.bl,td.bl{border-left:1px solid var(--bd)}
.empty{border:1px dashed var(--bd);border-radius:10px;padding:22px;text-align:center;color:var(--mut);background:#fbfaf7}
.empty .et{font-weight:600;color:var(--ink);font-size:15px;margin-bottom:4px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--mut)}
.pager button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:2px 10px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:default}
.chg li{margin:3px 0}.chg{margin:8px 0 0;padding-left:0;list-style:none;font-size:13px}.chg b{display:inline-block;min-width:96px;font-weight:600}
.pc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}.pc summary{cursor:pointer}
details.pcd summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}details.pcd summary::-webkit-details-marker{display:none}
.secd summary{cursor:pointer;font-weight:600;font-size:14px;padding:2px 0}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}.facts li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.fx{min-width:64px;font-weight:700;font-size:18px;text-align:right}
#lb{position:fixed;inset:0;background:rgba(20,26,51,.82);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:10px;padding:20px}
#lb img{max-width:92vw;max-height:82vh;border-radius:8px;background:#fff}#lb .cap{color:#fff;font-size:14px}#lb button{position:absolute;top:16px;right:20px;background:#fff;border:0;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer}
.foot{font-size:12px;color:var(--mut)}.foot p{margin:6px 0}
.hide{display:none!important}
td.wd{min-width:210px;white-space:normal}

 else{const pts=d.map((r,i)=>r[key]==null?null:[x(i),y(r[key])]).filter(Boolean);
  body=(type=='area'&&pts.length?`<polygon fill="${col}" opacity=".08" points="${pts[0][0]},${H-B} ${pts.map(p=>p.join(',')).join(' ')} ${pts[pts.length-1][0]},${H-B}"/>`:'')+`<polyline fill="none" stroke="${col}" stroke-width="2.2" ${type=='dash'?'stroke-dasharray="6 4"':''} points="${pts.map(p=>p.join(',')).join(' ')}"/>`+d.map((r,i)=>r[key]==null?'':`<circle cx="${x(i)}" cy="${y(r[key])}" r="3" fill="${col}"><title>${tip(r,i)}</title></circle>`).join('')}

  mk+=(b&&j>=0?`<rect x="${x0}" y="${T}" width="${x1-x0}" height="${H-T-B}" fill="#5b3fd6" opacity=".05"/>`:'')+`<line x1="${x0}" x2="${x0}" y1="${o.top?ly+3:T}" y2="${H-B}" stroke="#141a33" stroke-width="1" stroke-dasharray="3 4" opacity=".45"><title>${sd(a)}: ${esc(full)}</title></line>`+(o.top?TX(x0+3,ly,esc(short),{fs:10,c:'#141a33',b:1}):'')});
 const step=Math.ceil(n/12);const lab=o.xl?d.map((r,i)=>i%step==0||i==n-1?TX(x(i),H-B+18,sd(r[0]),{a:'middle'}):'').join(''):'';
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.name)} by day">${g}${mk}${body}${lab}${TX(L-8,T-(o.top?28:4)<0?10:T-6,'',{})}</svg>`}
